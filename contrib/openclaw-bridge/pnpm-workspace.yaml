# pnpm view of this package for rules_js (MODULE.bazel npm_openclaw).
# npm (package-lock.json) drives local use; pnpm-lock.yaml is its `pnpm
# import` translation.

# No install scripts under Bazel. openclaw's postinstall prunes/patches
# packaged plugin dist the bridge never imports; the others build optional
# native or generated pieces the bridge does not load. The suite passes the
# same under `npm ci --ignore-scripts`.
allowBuilds:
  "@google/genai": false
  koffi: false
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false

# Security pin, mirrored by package.json "overrides" for npm so both lockfiles
# resolve the same tree (lockfiles_in_sync_test): openclaw 2026.8.35 pins
# @modelcontextprotocol/sdk 1.30.0. 1.31.0 fixes GHSA-6qxp-vccf-f47h; 1.32.0
# fixes GHSA-6prh-2h8m-c8cw, GHSA-22jm-h49p-29qw, GHSA-rvq5-wwqv-78pq and
# GHSA-46jr-4wx8-v453. Drop both once openclaw pins >= 1.32.0.
overrides:
  "@modelcontextprotocol/sdk": 1.32.2
