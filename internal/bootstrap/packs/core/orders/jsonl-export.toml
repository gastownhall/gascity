# Converted from formula+pool to exec. All JSONL export operations are
# deterministic: gc bd export per bead scope, jq record-count comparisons, git
# push. No LLM judgment needed — runs inline in the controller.
[order]
description = "Export bead scopes to a JSONL git archive"
exec = "$PACK_DIR/assets/scripts/jsonl-export.sh"
trigger = "cooldown"
interval = "15m"
timeout = "900s"
skip_aliases = ["mol-dog-jsonl"]
# Interim: the script reads through `gc bd sql`, which an http-served store
# refuses. Until it moves onto served verbs it is not dispatched for an http
# scope (reported as inapplicable there); every other backend keeps it.
requires_backend = ["dolt", "doltlite", "postgres"]
