# nudge-on-route wakes a warm-idle worker the moment a bead is routed to
# it. `gc sling` does not nudge warm-idle workers (issue #1129, closed by
# design), so without this a routed bead sits unclaimed until the worker's
# next turn cycle. Event-driven and idempotent; routing is read off the
# bead.created and bead.updated events and a given (bead, routed_to) pair
# is nudged at most once. See assets/scripts/nudge-on-route.sh.
#
# Each run processes every bead.created/bead.updated event with seq above
# the high-water seq mark persisted by the previous run, so dispatch gaps
# drop nothing. Routing is mechanical: read gc.routed_to from the event,
# nudge the named session — once per target per run, covering every bead
# routed to it. No LLM judgment needed, so the controller runs it via exec.
[order]
description = "Nudge the target session when a bead is routed to it"
trigger = "event"
on = "bead.updated"
exec = "$PACK_DIR/assets/scripts/nudge-on-route.sh"
