# A condition checks created AND updated routing and outstanding retries.
# One city-scoped order owns the shared cursor/outbox. Keep the work gate
# enabled to serialize execs; a second event order would race this state.
[order]
description = "Nudge the target session when a bead is routed to it"
scope = "city"
trigger = "condition"
check = "$PACK_DIR/assets/scripts/nudge-on-route.sh --check"
check_timeout = "5s"
exec = "$PACK_DIR/assets/scripts/nudge-on-route.sh"
