# Closes stale order tracking beads left behind by crashed or resource-starved
# exec dispatches, and prunes expired closed tracking history according to
# [beads.policies.order_tracking].delete_after_close. Fresh tracking beads are
# left alone so in-flight orders keep their normal single-flight protection.
#
# The prune deletes expired history a chunk at a time as it clears its
# checks. --check-budget and the chunk span are cooperative limits, checked
# between candidate checks: --check-budget stops starting new retention
# checks at 3m. It does not bound an in-flight store read, the final chunk's
# set-level re-check and delete, or stale-close and the confirm count; the 5m
# timeout leaves headroom for those. A run that stops there keeps what it
# deleted, declares a partial outcome (order.skipped) naming each store it
# did not finish, and leaves the rest of the backlog to the next run. The
# timeout, the 300s exec default, is explicit so the two values change
# together.
[order]
description = "Close stale order-tracking beads and prune expired tracking history"
trigger = "cooldown"
interval = "1m"
timeout = "5m"
exec = "gc order sweep-tracking --stale-after 10m --check-budget 3m --quiet --confirm"
