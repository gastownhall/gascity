    # env var that merely PREFIXES a bead this session owns would be silently
    # promoted to it — the derive block must not lean on the verify block for
    # that, because B6 and the prompt hunks ship it without one.
    # Read, then parse, in two statements. Piping the show straight into `jq` on a
    # single line reads to gastown lint as a beads command carrying jq's own
    # `--arg` and `-r` flags, which that command does not have, and the upstream
    # suite fails it (tests/test_gastown_lint_findings.py). Every other read in
    # this pack is already written this way.
    CAND_JSON=$(gc bd show "$CAND" --json 2>/dev/null)
    OWNED=$(printf '%s' "$CAND_JSON" | jq -r --arg me "$ME" --arg id "$CAND" \
      '.[0] | select((.id // "") == $id)
            | select(((.assignee // "") == $me) or ((.metadata.polecat_session // "") == $me))
            | .id' 2>/dev/null)
    if [ -n "$OWNED" ]; then WORK_BEAD_ID="$OWNED"; break; fi
  done
fi
if [ -z "$WORK_BEAD_ID" ]; then
  echo "cannot derive the work bead: no single-child convoy, and no bead this session owns" >&2
  gc runtime drain-ack
  exit 1
fi
# Verify before use. `bd` FUZZY-MATCHES an id it cannot resolve exactly, so an id
# carried in from a stale env var must be proven to name a real, non-convoy bead
# before anything writes to it — a wrong id here reassigns somebody else's work.
WORK_JSON=$(gc bd show "$WORK_BEAD_ID" --json 2>/dev/null)
RESOLVED_ID=$(printf '%s' "$WORK_JSON" | jq -r '.[0].id // empty' 2>/dev/null)
RESOLVED_TYPE=$(printf '%s' "$WORK_JSON" | jq -r '.[0] | (.issue_type // .type // "")' 2>/dev/null)
if [ "$RESOLVED_ID" != "$WORK_BEAD_ID" ] || [ "$RESOLVED_TYPE" = "convoy" ]; then
  echo "refusing to use WORK_BEAD_ID=$WORK_BEAD_ID (resolved to '${RESOLVED_ID:-nothing}' type '${RESOLVED_TYPE:-?}')" >&2
  gc runtime drain-ack
  exit 1
fi
gc bd list --assignee=$GC_AGENT --status=in_progress
```

The work bead is your assigned issue. Read it carefully:
```bash
gc bd show "$WORK_BEAD_ID"           # Full issue details
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'  # Check for existing metadata
```

**3. Check for rejection (IMPORTANT):**

If `metadata.rejection_reason` exists, this bead was previously attempted
and rejected by the refinery. Read the reason carefully:
- Rebase conflict → you'll resume the existing branch and rebase
- Test failure → you'll resume the branch and fix the issue

If `metadata.branch` exists, a branch already exists from the prior attempt.
You will use it in workspace-setup instead of creating a new one.

**3b. Check for an ALREADY-FINISHED bead (STOP if it is).**

If the bead is already at branch-ready, a prior session finished it and parked it
for publication. Do NOT redo the implementation and do NOT re-run the test gate —
confirm, record, and drain.

This block repeats the derivation and does its own `gc bd show` rather than reusing
step 2's. Formula steps are PROSE: an agent may run each fenced block in a separate
shell, so a block that depends on a variable another block set is a block that
sometimes does nothing. `tests/test_work_bead_derivation.sh` scores it both ways.

