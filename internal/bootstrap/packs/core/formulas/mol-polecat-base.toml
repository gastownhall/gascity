  gc runtime drain-ack
  exit 1
fi
# STOP if a PRIOR session already finished this bead. `branch_ready` is written in
# the SAME `gc bd update` that sets status=open and clears the assignee, so a bead
# that arrives on your hook already carrying it was finished by somebody else,
# earlier — it is parked work awaiting a publish, not an assignment. Re-running
# the implementation and the test gate on it produces nothing; fph-bcqp8 had that
# done to it four times and fph-e3i40.9 three (gci-mar6).
#
# A `rejection_reason` overrides: the refinery deliberately sent the branch back,
# and doing more work on it is the whole point.
# Self-contained: reuse the read the verify block already did when this runs in the
# same shell, and do its own when it does not. Formula steps are PROSE — an agent
# may run each fenced block as a separate shell, so nothing here may depend on a
# variable another block set.
WORK_JSON="${WORK_JSON:-$(gc bd show "$WORK_BEAD_ID" --json 2>/dev/null)}"
