# on its own: a session is spawned FOR one bead, but `gc hook --claim` checks
# assigned work first and only then falls through to the routed pool, so it
# routinely hands the session a DIFFERENT bead. Measured in gci-utzx's own
# session: GC_TRIGGER_WORK_BEAD_ID=gci-5ts6 while the claim returned gci-utzx,
# and gci-5ts6 is a real, open, non-convoy bug bead — so the verify block below
# passes it. Taking the env var there would branch, push and reassign an
# unrelated bead: failing OPEN onto somebody else's work, which is strictly
# worse than the convoy-only abort this replaced.
ME="${BEADS_ACTOR:-${GC_SESSION_NAME:-${GC_SESSION_ID:-${GC_AGENT:-}}}}"
# (1) The bead this session actually holds. This is what the claim block
# established, so it outranks every env var.
if [ -z "$WORK_BEAD_ID" ] && [ -n "$ME" ]; then
  MINE_JSON=$(gc bd list --assignee="$ME" --status=in_progress --json 2>/dev/null)
  # Exactly one, counting only non-convoy beads: a convoy wrapper is never the work
  # bead, and a molecule holds both. Exactly one, not the first of several — two
  # beads in progress means the question has no answer, and picking either is the
  # wrong-bead write this whole block exists to prevent.
  WORK_BEAD_ID=$(printf '%s' "$MINE_JSON" | jq -r '
      if type != "array" then empty
      else [.[] | select((.issue_type // .type // "") != "convoy")]
           | if length == 1 then .[0].id else empty end
      end' 2>/dev/null)
fi
# (2) Past the handoff the bead is no longer assigned here, and that is exactly
# when the "already submitted" short-circuit needs to find it. `polecat_session`
# is stamped by the claim block and SURVIVES reassignment, so it still names the
# session that did the work. Each candidate must pass that test; an unowned one
# is discarded, not used.
if [ -z "$WORK_BEAD_ID" ] && [ -n "$ME" ]; then
  for CAND in "${GC_TRIGGER_WORK_BEAD_ID:-}" "${GC_TRIGGER_BEAD_ID:-}" "${GC_BEAD_ID:-}"; do
    [ -n "$CAND" ] || continue
    # Exact id AND ownership. `bd` fuzzy-matches, so without the id test a stale
    # env var that merely PREFIXES a bead this session owns would be silently
    # promoted to it — the derive block must not lean on the verify block for
    # that, because B6 and the prompt hunks ship it without one.
    # Read, then parse, in two statements. Piping the show straight into `jq` on a
    # single line reads to gastown lint as a beads command carrying jq's own
    # `--arg` and `-r` flags, which that command does not have, and the upstream
    # suite fails it (tests/test_gastown_lint_findings.py). Every other read in
    # this pack is already written this way.
    CAND_JSON=$(gc bd show "$CAND" --json 2>/dev/null)
    OWNED=$(printf '%s' "$CAND_JSON" | jq -r --arg me "$ME" --arg id "$CAND" \
      '.[0] | select((.id // "") == $id)
            | select(((.assignee // "") == $me) or ((.metadata.polecat_session // "") == $me))
            | .id' 2>/dev/null)
    if [ -n "$OWNED" ]; then WORK_BEAD_ID="$OWNED"; break; fi
  done
fi
if [ -z "$WORK_BEAD_ID" ]; then
  echo "cannot derive the work bead: no single-child convoy, and no bead this session owns" >&2
  gc runtime drain-ack
  exit 1
fi
EXISTING=""
MATCHES=$(gc bd list --title-contains "$SYMPTOM_KEY" --status open,in_progress,blocked --json)
LOOKUP_RC=$?
if [ "$LOOKUP_RC" -ne 0 ]; then
    echo "Ledger lookup failed (rc=$LOOKUP_RC). NOT filing — a failed lookup is not proof the bead is missing."
    gc mail send {{escalation_target}} -s "NOTICE: {{base_branch}} pre-flight failed, dedupe lookup broken" \
      -m "Symptom: $SYMPTOM_KEY. Lookup exited $LOOKUP_RC so nothing was filed. Proceeding with $WORK_BEAD_ID."
else
    EXISTING=$(printf '%s' "$MATCHES" | jq -r '.[0].id // empty')
fi
```

**3b2. If the exact key matched nothing, widen to the family.** Sibling
tests in one package usually fail for one reason: three different
`TestDisableAndPurge*` functions were filed separately when a single
environment leak broke all of them, and that package accumulated eight beads
in under two days. Search the shared prefix, or the package name:

```bash
if [ "$LOOKUP_RC" -eq 0 ] && [ -z "$EXISTING" ]; then
    SYMPTOM_FAMILY="<shared test prefix or failing package, e.g. TestDisableAndPurge>"
    FAMILY_MATCHES=$(gc bd list --title-contains "$SYMPTOM_FAMILY" --status open,in_progress,blocked --json)
    FAMILY_RC=$?
    if [ "$FAMILY_RC" -ne 0 ]; then
        echo "Family lookup failed (rc=$FAMILY_RC). NOT filing — a failed lookup is not proof the bead is missing."
    else
        printf '%s' "$FAMILY_MATCHES" | jq -r '.[] | "\\(.id)\\t\\(.title)"'
    fi
fi
```

Read what comes back rather than matching on the string alone. A hit whose
symptom is genuinely the same defect — same package, same failure mode —
means comment on it as in 3c. Set it by hand — this one is a judgement
call, so nothing assigns it for you:

```bash
EXISTING="<the bead id you judged to be the same defect>"
```

A hit that merely shares a prefix but fails for a different reason is not
your bead; keep going to 3d.

**3c. If `$EXISTING` is set — comment, do not file:**

```bash
gc bd comment "$EXISTING" "Also observed on {{base_branch}} while starting $WORK_BEAD_ID."
```

One bead, N confirmations. Then get on with your own work.

**3d. If the lookup succeeded and matched nothing, check whether the fix
already landed** and your baseline is simply stale. Re-filing a defect that
is already fixed puts a ready bead in the pool, and the next sling sends a
polecat to redo merged work:

```bash
CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)
CLOSED_MATCHES=$(gc bd list --title-contains "$SYMPTOM_KEY" --status closed --closed-after "$CUTOFF" --json)
CLOSED_RC=$?
```

On a match — or on a non-zero `$CLOSED_RC`, since a failed lookup is not
proof the fix has not landed — re-fetch `origin/{{base_branch}}`, reset your
worktree to the current tip, and re-run the pre-flight before filing
anything.

**3e. Only now file it** — with the symptom key verbatim in the title, so
the next polecat's 3b lookup finds your bead. Put the full failure,
including the subtest you stripped in 3a and the package, in the body:

```bash
gc bd create --title "Pre-existing failure: $SYMPTOM_KEY — <short description>" \
  --type bug --priority 1 \
  --design "Observed on {{base_branch}}. Full failure: $RAW_FAILURE"
gc mail send {{escalation_target}} -s "NOTICE: {{base_branch}} has failing pre-flights" \
  -m "Filed: <bead-id> for $SYMPTOM_KEY. Proceeding with $WORK_BEAD_ID."
```

**Exit criteria:** Pre-flights pass, or the failure is recorded exactly once
— a new bead you filed, or your comment on the bead that already had it —
or, when the ledger lookup itself was broken, `{{escalation_target}}` has been notified
instead."""

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["preflight-tests"]
description = """
Do the actual implementation work.

