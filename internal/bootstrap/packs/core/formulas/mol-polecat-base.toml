HALT=$(printf '%s' "$WORK_JSON" | jq -r '(.[0].metadata.halt_reason // "")' 2>/dev/null)
REJECTED=$(printf '%s' "$WORK_JSON" | jq -r '(.[0].metadata.rejection_reason // "")' 2>/dev/null)
