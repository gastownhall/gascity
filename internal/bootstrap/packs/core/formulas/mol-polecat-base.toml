description = """
Polecat base formula — shared steps for all polecat work variants.

This formula defines the common lifecycle steps that every polecat variant
shares: loading context, workspace setup (placeholder), preflight tests,
implementation, and self-review. Variant formulas extend this base and
override workspace-setup with their specific branching/worktree strategy,
then add a terminal step (submit, commit, etc).

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy_id | runtime | Input convoy tracking the single work bead |
| base_branch | caller | Base branch to rebase on (default: main) |
| setup_command | rig `formula_vars` | Setup/install command. Empty = skip. |
| typecheck_command | rig `formula_vars` | Type check command. Empty = skip. |
| test_command | rig `formula_vars` | Test command. Empty = skip. |
| lint_command | rig `formula_vars` | Lint command. Empty = skip. |
| build_command | rig `formula_vars` | Build command. Empty = skip. |

Steps run in independent shell contexts, so each step that needs the work
bead re-derives it from the input convoy:

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
```"""
formula = "mol-polecat-base"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "The base branch to rebase on and compare against (e.g., main, integration/convoy-id)"
default = "main"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). From rig `formula_vars` or empty to skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). From rig `formula_vars` or empty to skip."
default = ""

[vars.test_command]
description = "Command to run tests. From rig `formula_vars` or empty to skip."
default = ""

[vars.lint_command]
description = "Command to run linting. From rig `formula_vars` or empty to skip."
default = ""

[vars.build_command]
description = "Command to run build. From rig `formula_vars` or empty to skip."
default = ""

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gc prime                    # Load role context
gc bd prime                    # Load beads context
```

**2. Derive your work bead and check your hook:**
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-base requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd list --assignee=$GC_AGENT --status=in_progress
```

The work bead is your assigned issue. Read it carefully:
```bash
gc bd show "$WORK_BEAD_ID"           # Full issue details
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'  # Check for existing metadata
```

**3. Check for rejection (IMPORTANT):**

If `metadata.rejection_reason` exists, this bead was previously attempted
and rejected by the refinery. Read the reason carefully:
- Rebase conflict → you'll resume the existing branch and rebase
- Test failure → you'll resume the branch and fix the issue

If `metadata.branch` exists, a branch already exists from the prior attempt.
You will use it in workspace-setup instead of creating a new one.

**4. Check inbox for additional context:**
```bash
gc mail inbox
# Read any HANDOFF or assignment messages, then archive after absorbing context
# gc mail read <id> → process → gc mail archive <id>
```

**5. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- Are there dependencies or blockers?
- What does "done" look like?
- If rejected: what specifically needs fixing?

If blocked or unclear, mail Witness:
```bash
gc mail send <rig>/witness -s "HELP: Unclear requirements" -m "Issue: $WORK_BEAD_ID
Question: <what you need clarified>"
```

**Exit criteria:** You understand the work and can begin."""

[[steps]]
id = "workspace-setup"
title = "Set up workspace (override in variant formulas)"
needs = ["load-context"]
description = """
Override this step in variant formulas to define the workspace strategy.

Variants should set up an isolated worktree and working context appropriate
for their merge strategy (feature branch, direct commit, etc)."""

[[steps]]
id = "preflight-tests"
title = "Verify pre-flights pass on base branch"
needs = ["workspace-setup"]
description = """
Check if the codebase is healthy BEFORE starting your work.

**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: test_command = {{test_command}}**

**Skip this step if resuming a rejected branch** — pre-flights were
already verified on the prior attempt. Close this step and proceed.

**1. Run pre-flights (skip empty commands silently):**
```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```

**If ALL commands above are empty**, check the repo's CLAUDE.md or AGENTS.md
(whichever your provider uses) for quality-gate guidance. Look for sections
named "Quality Gates", "CI", "Testing", "Build", or "Lint" and run any
commands found in their code blocks. This ensures quality checks are not
silently skipped when the formula was instantiated without explicit commands.

**2. If pre-flights pass:** proceed.

**3. If pre-flights fail on {{base_branch}}:**

The failure is on the base branch, so it is not yours and every polecat
starting a baseline right now sees the same thing. Report it ONCE: search
the ledger first, and add your confirmation to the existing bead instead of
filing another copy. Do NOT fix pre-existing failures — that's not your
assignment.

FORBIDDEN: Pushing to {{base_branch}}. FORBIDDEN: Fixing pre-existing
failures. FORBIDDEN: Filing before searching.

**3a. Derive a stable symptom key.** Two agents describe one defect in two
different ways, so free-text prose cannot match; a symptom key can.

Use the failing **test function** name, with any Go subtest suffix stripped
at the first `/`. Two polecats often trip different subtests of the same
function — `TestDisableAndPurge.../clean_config_with_residual_files` versus
`.../peer_successor_cross-device_tree` — and searching the full subtest path
means neither finds the other's bead. Key on the function; note the subtest
in the description.

```bash
RAW_FAILURE="<failing test as reported, e.g. TestFoo/some_subtest>"
SYMPTOM_KEY="${RAW_FAILURE%%/*}"
```

When the failure has no test name at all, use the failing package or target
path (`internal/api/genclient`). Handle each distinct failure under its own
key.

**3b. Search before filing — and fail CLOSED on lookup error.** A lookup
that errors is not an all-clear. Include claimed beads: the existing report
is usually already `in_progress` with someone fixing it.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
EXISTING=""
MATCHES=$(gc bd list --title-contains "$SYMPTOM_KEY" --status open,in_progress,blocked --json)
LOOKUP_RC=$?
if [ "$LOOKUP_RC" -ne 0 ]; then
    echo "Ledger lookup failed (rc=$LOOKUP_RC). NOT filing — a failed lookup is not proof the bead is missing."
    gc mail send <rig>/witness -s "NOTICE: {{base_branch}} pre-flight failed, dedupe lookup broken" \
      -m "Symptom: $SYMPTOM_KEY. Lookup exited $LOOKUP_RC so nothing was filed. Proceeding with $WORK_BEAD_ID."
else
    EXISTING=$(printf '%s' "$MATCHES" | jq -r '.[0].id // empty')
fi
```

**3b2. If the exact key matched nothing, widen to the family.** Sibling
tests in one package usually fail for one reason: three different
`TestDisableAndPurge*` functions were filed separately when a single
environment leak broke all of them, and that package accumulated eight beads
in under two days. Search the shared prefix, or the package name:

```bash
if [ "$LOOKUP_RC" -eq 0 ] && [ -z "$EXISTING" ]; then
    SYMPTOM_FAMILY="<shared test prefix or failing package, e.g. TestDisableAndPurge>"
    FAMILY_MATCHES=$(gc bd list --title-contains "$SYMPTOM_FAMILY" --status open,in_progress,blocked --json)
    FAMILY_RC=$?
    if [ "$FAMILY_RC" -ne 0 ]; then
        echo "Family lookup failed (rc=$FAMILY_RC). NOT filing — a failed lookup is not proof the bead is missing."
    else
        printf '%s' "$FAMILY_MATCHES" | jq -r '.[] | "\\(.id)\\t\\(.title)"'
    fi
fi
```

Read what comes back rather than matching on the string alone. A hit whose
symptom is genuinely the same defect — same package, same failure mode —
means comment on it as in 3c. Set it by hand — this one is a judgement
call, so nothing assigns it for you:

```bash
EXISTING="<the bead id you judged to be the same defect>"
```

A hit that merely shares a prefix but fails for a different reason is not
your bead; keep going to 3d.

**3c. If `$EXISTING` is set — comment, do not file:**

```bash
gc bd comment "$EXISTING" "Also observed on {{base_branch}} while starting $WORK_BEAD_ID."
```

One bead, N confirmations. Then get on with your own work.

**3d. If the lookup succeeded and matched nothing, check whether the fix
already landed** and your baseline is simply stale. Re-filing a defect that
is already fixed puts a ready bead in the pool, and the next sling sends a
polecat to redo merged work:

```bash
CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)
CLOSED_MATCHES=$(gc bd list --title-contains "$SYMPTOM_KEY" --status closed --closed-after "$CUTOFF" --json)
CLOSED_RC=$?
```

On a match — or on a non-zero `$CLOSED_RC`, since a failed lookup is not
proof the fix has not landed — re-fetch `origin/{{base_branch}}`, reset your
worktree to the current tip, and re-run the pre-flight before filing
anything.

**3e. Only now file it** — with the symptom key verbatim in the title, so
the next polecat's 3b lookup finds your bead. Put the full failure,
including the subtest you stripped in 3a and the package, in the body:

```bash
gc bd create --title "Pre-existing failure: $SYMPTOM_KEY — <short description>" \
  --type bug --priority 1 \
  --design "Observed on {{base_branch}}. Full failure: $RAW_FAILURE"
gc mail send <rig>/witness -s "NOTICE: {{base_branch}} has failing pre-flights" \
  -m "Filed: <bead-id> for $SYMPTOM_KEY. Proceeding with $WORK_BEAD_ID."
```

**Exit criteria:** Pre-flights pass, or the failure is recorded exactly once
— a new bead you filed, or your comment on the bead that already had it —
or, when the ledger lookup itself was broken, witness has been notified
instead."""

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["preflight-tests"]
description = """
Do the actual implementation work.

**Working principles:**
- Follow existing codebase conventions
- Make atomic, focused commits
- Keep changes scoped to the assigned issue
- Don't gold-plate or scope-creep

**If resuming a rejected branch:** Read `metadata.rejection_reason`
from load-context. Focus on fixing the specific issue that caused
rejection — don't redo everything.

Derive your work bead in this shell context:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
```

**Commit frequently with detailed messages.** Every commit gets a
subject AND a body. The body is what makes the repo navigable a year
from now — the reviewer (and future-you) needs to understand *why* the
change exists, not just *what* the diff did. The diff already shows
the what.

```bash
git add <files>
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<1-3 paragraph explanation:>
- The motivation: which bug, regression, design decision, or upstream
  request drove this commit
- What the change actually does at a higher level than the diff
- Anything non-obvious about the approach: trade-offs taken, paths not
  chosen, hidden constraints honored
- Validation: which tests/benchmarks/manual checks confirmed correctness

Note any follow-ups, deferred edge cases, or downstream impacts here.
BODY
)"
```

Commit types: feat, fix, refactor, perf, test, docs, chore

**Examples of strong subjects + bodies:**
- `fix(session): preserve lifecycle metadata during crash adoption (ga-xxxx)`
  body: explains the stale session projection, the resume path that
  lost metadata, the projection update, and the focused adoption test
- `perf(events): batch typed payload registration lookups (ga-xxxx)`
  body: cites the event fan-out profile, names the registry call site
  that drove the regression, and notes why the cache stays read-only

**Weak commits to avoid** (refinery/reviewer can't tell what's going on):
- `fix: stuff (ga-xxxx)`
- `perf: speed up the slow loop`
- `refactor` with no body

**Discovered work (outside scope):**
```bash
gc bd create --title "Found: <description>" --type bug --priority 2
```
Do NOT fix unrelated issues in this branch.

**If stuck (>15 minutes):**
```bash
gc mail send <rig>/witness -s "HELP: Stuck on implementation" -m "Issue: $WORK_BEAD_ID
Problem: <what's blocking you>
Tried: <what you've attempted>"
```

**If context filling up:**
```bash
gc runtime request-restart
```
This blocks until the controller kills your session. The next session
resumes from context (re-reads formula steps, checks git/bead state).

**Exit criteria:** Implementation complete, all changes committed."""

[[steps]]
id = "self-review"
title = "Self-review and run tests"
needs = ["implement"]
description = """
Review your changes and verify they work.

**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**
**Config: test_command = {{test_command}}**

**1. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD
git log --oneline origin/{{base_branch}}..HEAD
git diff --stat origin/{{base_branch}}...HEAD
```

Check for: bugs, security issues, style violations, missing error handling,
debug cruft, unintended file changes. Fix anything you find.

**2. Run quality checks (skip empty commands):**
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
{{test_command}}
```

**If ALL commands above are empty**, check the repo's CLAUDE.md or AGENTS.md
(whichever your provider uses) for quality-gate guidance. Look for sections
named "Quality Gates", "CI", "Testing", "Build", or "Lint" and run any
commands found in their code blocks.

**ALL CHECKS MUST PASS.** If your change caused the failure, fix it.

If the failure is pre-existing, report it through the search-first protocol
in the `preflight-tests` step (3a-3e): derive the symptom key, search the
ledger, comment on the bead that already covers it, and only file when the
lookup succeeded and found nothing. Reaching this step later than the other
polecats makes a duplicate more likely here, not less.

**3. Ensure everything is committed:**
```bash
git status                  # Must be clean
git log origin/{{base_branch}}..HEAD --oneline  # Must show your commits
```

If uncommitted changes exist, commit them with a body explaining what
slipped through the `implement` step (typically a self-review touch-up,
test addition, or formatter run):
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
git add -A
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain what these residual changes are: a self-review fix,
test-only addition, formatter run, etc. Be specific.>
BODY
)"
```

NEVER discard implementation changes with `git checkout -- .`

**Exit criteria:** All checks pass, all changes committed, working tree clean."""
