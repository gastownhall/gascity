description = """
Polecat report-only variant — investigates an issue and writes findings
as bead notes, without creating a branch or opening a pull request.

Extends mol-polecat-base with a lightweight workspace (no git checkout, no
isolated worktree) and a write-report terminal step instead of commit+push.
Designed for tasks that produce analysis, recommendations, or investigation
results — not code changes.

## Polecat Contract (Report-Only Model)

1. Receive work (molecule poured with this formula, assigned to you)
2. Follow steps in order (read descriptions, execute, move to next)
3. Write findings to bead notes, close bead, exit
4. You are GONE — no branch, no PR, no push

**No code changes.** Investigation results land as bead notes. Zero calls
to `git push` or `gh pr create`.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Investigation blocked | Mail the escalation target, close your own step `gc.outcome=fail`, then `gc runtime drain-ack` (see Stopping The Workflow Early in mol-polecat-base) |
| Blocked on external | Same as investigation blocked |
| Context filling | `gc runtime request-restart` (blocks until controller kills you) |
| Unsure what to do | Mail the escalation target, don't guess |"""
formula = "mol-polecat-report"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "workspace-setup"
title = "Verify assignment (report-only, no worktree)"
needs = ["load-context"]
description = """
No code changes are expected in this formula. Confirm the scope and
verify the investigation environment is ready.

**No git checkout, no isolated worktree.** You investigate with existing
sources in place. If you discover the issue requires a code fix, do NOT
attempt it here: stop the workflow so the operator can re-pour with
`mol-polecat-commit` or `mol-polecat-pr`. `gc runtime drain-ack` gives back
every claim this session still holds, so close this step failed before the ack:
acking with it open hands it back to the pool and a fresh session runs it
again. Closed failed, it skips every later step and the workflow finalizes
FAILED for `{{escalation_target}}`.
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
gc mail send {{escalation_target}} -s "HELP: $WORK_BEAD_ID needs a code fix" \
  -m "Issue: $WORK_BEAD_ID. This report-only workflow makes no code changes; re-pour with mol-polecat-commit or mol-polecat-pr."
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".workspace-setup"))' >/dev/null || { echo "workspace-setup: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason=needs_code_change --status=closed || exit 1
gc runtime drain-ack
exit 1
```

**1. Confirm scope:**

Derive your work bead from the input convoy, then re-read the issue with
fresh eyes:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-report requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
```

**2. Prime environment:**
```bash
gc prime
gc bd prime
```

**Exit criteria:** Scope confirmed as investigation/analysis only.

**Close this step:** `gc bd update <step-id> --set-metadata gc.outcome=pass --status closed`
(a bare close counts as a failure)."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "preflight-tests"
title = "Skip pre-flights (no code changes)"
needs = ["workspace-setup"]
description = """
No pre-flights needed — this formula produces no code changes.

Close this step immediately and proceed to implement.

**Exit criteria:** (immediate — no action required)"""

[[steps]]
id = "implement"
title = "Investigate (no code changes)"
needs = ["preflight-tests"]
description = """
Investigate the issue. This is analysis only — you produce findings, not
code changes.

- Read the relevant sources, traces, logs, and configuration in place.
- Gather concrete evidence: file paths, line numbers, command output.
- Identify the root cause, or state clearly that it is unknown.
- Do NOT edit, create, or delete any files.

**If you discover a code fix is required,** do NOT attempt it here: stop the
workflow so the operator can re-pour with mol-polecat-commit or
mol-polecat-pr. Close this step failed before the ack, or
`gc runtime drain-ack` hands it back to the pool and a fresh session runs it
again:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
gc mail send {{escalation_target}} -s "HELP: $WORK_BEAD_ID needs a code fix" \
  -m "Issue: $WORK_BEAD_ID. This report-only workflow makes no code changes; re-pour with mol-polecat-commit or mol-polecat-pr."
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".implement"))' >/dev/null || { echo "implement: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason=needs_code_change --status=closed || exit 1
gc runtime drain-ack
exit 1
```

**Exit criteria:** Investigation complete, evidence gathered, no files modified.

**Close this step:** `gc bd update <step-id> --set-metadata gc.outcome=pass --status closed`
(a bare close counts as a failure)."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "self-review"
title = "Self-review: verify investigation is complete"
needs = ["implement"]
description = """
Review your findings before writing the final report.

**1. Verify completeness:**

- Does the investigation answer every question in the issue description?
- Are findings specific (file paths, line numbers, concrete observations)?
- Are open questions or unresolved ambiguities noted?
- Is the root cause identified (or clearly stated as unknown)?
- Are recommended next steps actionable?

**2. Check for accidental code changes:**

```bash
git status
```

There must be NO uncommitted code changes. If `git status` shows any
modifications, STOP — do not run a broad `git checkout`. This is a shared,
non-isolated checkout, so a blanket discard can wipe unrelated local work.
Stop the workflow so the operator can inspect, closing this step failed before
the ack so `gc runtime drain-ack` does not hand it back to the pool. Only revert
files you are certain you touched, by explicit path (e.g.
`git checkout -- path/to/file`).
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
gc mail send {{escalation_target}} -s "HELP: $WORK_BEAD_ID has an unexpected dirty checkout" \
  -m "Issue: $WORK_BEAD_ID. git status shows modifications in the shared checkout; nothing was reverted. Inspect before anything is discarded."
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".self-review"))' >/dev/null || { echo "self-review: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason=dirty_checkout --status=closed || exit 1
gc runtime drain-ack
exit 1
```

This formula produces ZERO code changes. All output is bead notes.

**Exit criteria:** Findings complete, git status clean.

**Close this step:** `gc bd update <step-id> --set-metadata gc.outcome=pass --status closed`
(a bare close counts as a failure)."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }

[[steps]]
id = "write-report"
title = "Write report to bead notes and close"
needs = ["self-review"]
description = """
Write your investigation findings to the bead and close it. No branch,
no push, no PR. You cease to exist after this step.

**1. Format and write the report:**

Compose a clear summary of your findings. Include:
- Root cause (or "unknown — further investigation required")
- Supporting evidence (file paths, line numbers, log snippets)
- Recommended next steps
- Any open questions or caveats

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
REPORT="$(cat <<'ENDREPORT'
## Findings

<root cause or "unknown — further investigation required">

## Evidence

<specific evidence: file:line, log snippet, command output>

## Recommended next steps

<actionable items>

## Open questions

<unresolved items, caveats>
ENDREPORT
)"
gc bd update "$WORK_BEAD_ID" --append-notes "$REPORT"
```

**2. Close the bead:**
```bash
gc bd close "$WORK_BEAD_ID"
```

**3. Close this step, signal reconciler, and exit.**

`gc runtime drain-ack` gives back every claim this session still holds, so
close this step first: acking with it still open hands it back to the pool
and a fresh session runs it again. `gc hook current` names the step you
claimed; refuse to ack if it is not this one.
```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".write-report"))' >/dev/null || { echo "write-report: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed || exit 1
gc runtime drain-ack
exit
```

`gc runtime drain-ack` tells the reconciler to kill this session. The
reconciler only restarts you if the pool check command finds more work.
You are GONE. Done means gone. There is no idle state.

**Exit criteria:** Report written to bead notes, bead closed, this step
closed, session exited."""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope" }
