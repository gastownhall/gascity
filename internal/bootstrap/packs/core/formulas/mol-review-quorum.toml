description = """
Gas City-owned review quorum primitive.

This graph.v2 workflow fans out exactly two read-only reviewer lanes, Kimi and
DeepSeek, then synthesizes their durable structured outputs. It is intentionally
just the primitive: lifecycle owners decide when to invoke it, and future
dx-review compatibility can consume the durable output without owning the
workflow.
"""
formula = "mol-review-quorum"
version = 2
contract = "graph.v2"

[vars]
[vars.subject]
description = "The bead, PR, commit range, or artifact being reviewed"
required = true

[vars.base_ref]
description = "Optional baseline ref used by reviewer prompts when inspecting a diff"
default = "origin/main"

[vars.kimi_model]
description = "Kimi reviewer model target"
default = "opencode-go/kimi-k2.6"

[vars.deepseek_model]
description = "DeepSeek reviewer model target"
default = "opencode-go/deepseek-v4-pro"

[vars.kimi_target]
description = "Configured Gas City agent target for the Kimi OpenCode reviewer lane"
default = "opencode-kimi"

[vars.deepseek_target]
description = "Configured Gas City agent target for the DeepSeek OpenCode reviewer lane"
default = "opencode-deepseek"

[[steps]]
id = "review-kimi"
title = "Review with Kimi"
description = """
Run a read-only review of `{{subject}}` using model target `{{kimi_model}}`.

You are one lane in a two-lane review quorum. Do not modify user files,
branches, comments, external systems, or unrelated beads. Before reviewing,
record a mutation baseline for the workspace. After reviewing, compare against
that baseline and report only the delta introduced after your baseline.
Pre-existing dirty state and pre-existing untracked files are not
reviewer-created mutations.

Persist durable structured output compatible with a future `dx-review
summarize` consumer. The output must include these keys:

- `verdict`: one of `pass`, `pass_with_findings`, `fail`, or `blocked`
- `summary`: concise review summary
- `findings_count`: integer count of findings
- `findings`: array of findings with severity, title, body, file, line or range
- `evidence`: commands, files, diffs, or artifacts inspected
- `usage`: model/runtime usage if available, otherwise null
- `read_only_enforcement`: baseline command, after command, and whether the delta is empty
- `mutations_delta`: files or state changes created after the baseline; empty if none
- `failure_class`: `none`, `transient`, or `hard`
- `failure_reason`: stable reason string or empty

On success, close with `gc.outcome=pass`. If the provider is unavailable,
rate-limited, or another retryable infrastructure issue occurs, close with
`gc.outcome=fail`, `gc.failure_class=transient`, and a stable
`gc.failure_reason`. For non-retryable input or contract failures, use
`gc.failure_class=hard`.
"""
metadata = { "gc.run_target" = "{{kimi_target}}", "gc.provider" = "opencode", "gc.model" = "{{kimi_model}}", "gc.review_quorum_lane" = "kimi", "gc.reviewer_model" = "{{kimi_model}}", "gc.output_json" = "review-quorum.lane.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 3
on_exhausted = "soft_fail"

[[steps]]
id = "review-deepseek"
title = "Review with DeepSeek"
description = """
Run a read-only review of `{{subject}}` using model target `{{deepseek_model}}`.

You are one lane in a two-lane review quorum. Do not modify user files,
branches, comments, external systems, or unrelated beads. Before reviewing,
record a mutation baseline for the workspace. After reviewing, compare against
that baseline and report only the delta introduced after your baseline.
Pre-existing dirty state and pre-existing untracked files are not
reviewer-created mutations.

Persist durable structured output compatible with a future `dx-review
summarize` consumer. The output must include these keys:

- `verdict`: one of `pass`, `pass_with_findings`, `fail`, or `blocked`
- `summary`: concise review summary
- `findings_count`: integer count of findings
- `findings`: array of findings with severity, title, body, file, line or range
- `evidence`: commands, files, diffs, or artifacts inspected
- `usage`: model/runtime usage if available, otherwise null
- `read_only_enforcement`: baseline command, after command, and whether the delta is empty
- `mutations_delta`: files or state changes created after the baseline; empty if none
- `failure_class`: `none`, `transient`, or `hard`
- `failure_reason`: stable reason string or empty

On success, close with `gc.outcome=pass`. If the provider is unavailable,
rate-limited, or another retryable infrastructure issue occurs, close with
`gc.outcome=fail`, `gc.failure_class=transient`, and a stable
`gc.failure_reason`. For non-retryable input or contract failures, use
`gc.failure_class=hard`.
"""
metadata = { "gc.run_target" = "{{deepseek_target}}", "gc.provider" = "opencode", "gc.model" = "{{deepseek_model}}", "gc.review_quorum_lane" = "deepseek", "gc.reviewer_model" = "{{deepseek_model}}", "gc.output_json" = "review-quorum.lane.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 3
on_exhausted = "soft_fail"

[[steps]]
id = "synthesize-review-quorum"
title = "Synthesize review quorum"
needs = ["review-kimi", "review-deepseek"]
description = """
Read the durable outputs from the Kimi and DeepSeek reviewer lanes for
`{{subject}}`, including any soft-failed retry controls, then write the quorum
summary as durable structured output.

The synthesis output must preserve lane provenance and include:

- `subject`: `{{subject}}`
- `base_ref`: `{{base_ref}}`
- `lanes`: Kimi and DeepSeek lane summaries, verdicts, findings counts,
  failure classes, failure reasons, read-only enforcement, and mutation deltas
- `verdict`: combined quorum verdict
- `summary`: combined summary
- `findings_count`: total actionable findings
- `findings`: deduplicated findings with lane evidence
- `evidence`: lane outputs and any synthesis-only checks
- `usage`: aggregate usage if available
- `read_only_enforcement`: synthesis baseline/after delta and lane deltas
- `mutations_delta`: synthesis-created delta only; empty if none
- `failure_class`: `none`, `transient`, or `hard`
- `failure_reason`: stable reason string or empty

Propagate this JSON through `gc.output_json` when available, or store it in the
bead notes/metadata exactly enough for future `dx-review summarize` ingestion.
Do not treat `dx-review` as the lifecycle owner; it is only a future
compatibility consumer for this primitive's durable state.
"""
metadata = { "gc.run_target" = "worker", "gc.review_quorum_role" = "synthesis", "gc.output_json" = "review-quorum.summary.v1", "gc.output_json_required" = "true" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"
