[[steps]]
id = "cleanup-worktree"
title = "Clean up the worktree"
needs = ["body"]
description = """
Remove the temporary worktree after the body reaches terminal state.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORK_BEAD=$(gc bd show "$WORK_BEAD_ID" --json)
meta() { printf '%s' "$WORK_BEAD" | jq -r --arg k "$1" '.[0].metadata[$k] // empty'; }
WORKTREE=$(meta gc.work_dir)
if [ -n "$WORKTREE" ]; then
  STORE_REF=$(meta gc.root_store_ref)
  WT_ARGS=(--json --repo "$(meta gc.worktree_repo)" --root "$(meta gc.worktree_root)" \\
    --path "$WORKTREE" --branch "$(meta gc.work_branch)" --base "$(meta gc.worktree_base_ref)" \\
    --bead "$WORK_BEAD_ID" --store-ref "${STORE_REF:-city}" --creator "$(meta gc.worktree_creator)" \\
    --owner "$(meta gc.worktree_owner)" --generation "$(meta gc.worktree_generation)" \\
    --lifecycle "$(meta gc.worktree_lifecycle)")
  # gc worktree cleanup is the only remover: no force mode, no recursive-delete fallback.
  # It is bound to the attempt that created the worktree, so read that id from
  # the durable provenance.
  ATTEMPT_ID=$(gc worktree verify "${WT_ARGS[@]}" | jq -r '.provenance.attempt_id // empty')
  if [ -z "$ATTEMPT_ID" ]; then
    gc bd update "$WORK_BEAD_ID" --append-notes "cleanup_pending: no provisioning attempt id for $WORKTREE (worktree missing or evidence incomplete); evidence left in place"
  else
    CLEANUP=$(gc worktree cleanup "${WT_ARGS[@]}" --attempt-id "$ATTEMPT_ID") || true
    if [ "$(printf '%s' "$CLEANUP" | jq -r '.removed or .already_absent')" = "true" ]; then
      gc bd update "$WORK_BEAD_ID" \\
        --unset-metadata gc.work_dir --unset-metadata gc.work_branch --unset-metadata work_dir \\
        --unset-metadata gc.worktree_repo --unset-metadata gc.worktree_root \\
        --unset-metadata gc.worktree_base_ref --unset-metadata gc.worktree_base_sha \\
        --unset-metadata gc.worktree_creator --unset-metadata gc.worktree_owner \\
        --unset-metadata gc.worktree_generation --unset-metadata gc.worktree_lifecycle
    else
      # A dirty tree or work not merged into the base is refused on purpose and
      # reported as cleanup_pending. Keep the evidence: it is the only record of
      # where that work lives.
      gc bd update "$WORK_BEAD_ID" --append-notes "cleanup_pending: $WORKTREE kept: $(printf '%s' "$CLEANUP" | jq -r '.error.code // "unknown"')"
    fi
  fi
fi
```

Close this step with its outcome. The step is retry-managed: a close without
