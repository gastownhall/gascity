description = """
Graph-first worktree lifecycle.

This is the built-in v2 workflow prototype for Gas City. It models work as an
explicit DAG with:

- a durable `body` scope bead
- explicit worktree setup and teardown
- first-class step beads that can be routed independently
- continuation metadata for same-session execution

Use this as the opt-in replacement for hierarchy-first single-session formulas.
"""
formula = "mol-scoped-work"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "Base branch to branch from"
default = "main"

[vars.setup_command]
description = "Optional setup command (install deps, bootstrap tools)"
default = ""

[vars.typecheck_command]
description = "Optional typecheck command"
default = ""

[vars.lint_command]
description = "Optional lint command"
default = ""

[vars.build_command]
description = "Optional build command"
default = ""

[vars.test_command]
description = "Optional test command"
default = ""

[[steps]]
id = "load-context"
title = "Load context and inspect the assignment"
description = """
Prime the workspace, inspect the assigned work, and understand the current bead
metadata before doing anything destructive.

```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'
gc mail inbox
```

Close this step with its outcome. The step is retry-managed: a close without
`gc.outcome` counts as a failed attempt (`missing_outcome`), and once its
attempts run out the workflow hard-fails even though the work succeeded.
Close the step bead your claim returned; `gc hook current --id-only` prints it:

```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed
```

Do not set `gc.failure_class` or `gc.failure_reason` on success: a pass that
carries them is retried. If the step cannot succeed, close it with
`gc.outcome=fail`, a short stable `gc.failure_reason`, and
`gc.failure_class=transient` when a retry can succeed (network, provider,
flaky checks) or `gc.failure_class=hard` when it cannot (bad input, a broken
contract):

```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=transient --set-metadata gc.failure_reason="<short_reason>" --status=closed
```
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "body"
title = "Worktree body scope"
needs = ["workspace-setup", "preflight-tests", "implement", "self-review", "submit"]
description = """
Terminal latch for the main worktree body.

Normal work beads inside this scope can fail. Paired `scope-check` control
beads handle fail-fast skipping, close this bead with `gc.outcome=fail|pass`,
and allow teardown to proceed.
"""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "workspace-setup"
title = "Set up a worktree and branch"
needs = ["load-context"]
description = """
Ensure there is an isolated worktree for this work item.

```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORK_BEAD=$(gc bd show "$WORK_BEAD_ID" --json)
# A run started before the managed key existed still records `work_dir`.
WORKTREE=$(printf '%s' "$WORK_BEAD" | jq -r '.[0].metadata["gc.work_dir"] // .[0].metadata.work_dir // empty')
if [ -z "$WORKTREE" ]; then
  # gc worktree ensure creates the worktree on an attached, uniquely named
  # branch and records durable ownership provenance. It publishes nothing on
  # the bead, so the evidence below is published in a single update: the
  # controller refuses a work dir whose evidence is partial.
  REPO=$(pwd)
  WORK_ROOT="$REPO/worktrees"
  WORK_BRANCH="gc-work/$WORK_BEAD_ID"
  STORE_REF=$(printf '%s' "$WORK_BEAD" | jq -r '.[0].metadata["gc.root_store_ref"] // "city"')
  ENSURE=$(gc worktree ensure --json --repo "$REPO" --root "$WORK_ROOT" \\
    --path "$WORK_ROOT/$WORK_BEAD_ID" --branch "$WORK_BRANCH" --base origin/{{base_branch}} \\
    --bead "$WORK_BEAD_ID" --store-ref "$STORE_REF" --creator mol-scoped-work \\
    --owner "${GC_AGENT:-mol-scoped-work}" --generation 1) || exit 1
  WORKTREE=$(printf '%s' "$ENSURE" | jq -r '.path')
  gc bd update "$WORK_BEAD_ID" \\
    --set-metadata gc.work_dir="$WORKTREE" \\
    --set-metadata gc.work_branch="$WORK_BRANCH" \\
    --set-metadata gc.worktree_repo="$REPO" \\
    --set-metadata gc.worktree_root="$WORK_ROOT" \\
    --set-metadata gc.worktree_base_ref="$(printf '%s' "$ENSURE" | jq -r '.provenance.base_ref')" \\
    --set-metadata gc.worktree_base_sha="$(printf '%s' "$ENSURE" | jq -r '.provenance.base_sha')" \\
    --set-metadata gc.worktree_creator="$(printf '%s' "$ENSURE" | jq -r '.provenance.creator')" \\
    --set-metadata gc.worktree_owner="$(printf '%s' "$ENSURE" | jq -r '.provenance.owner')" \\
    --set-metadata gc.worktree_generation="$(printf '%s' "$ENSURE" | jq -r '.provenance.generation')" \\
    --set-metadata gc.worktree_lifecycle="$(printf '%s' "$ENSURE" | jq -r '.provenance.lifecycle')" || exit 1
fi
cd "$WORKTREE"
{{setup_command}}
```

Close this step with its outcome. The step is retry-managed: a close without
`gc.outcome` counts as a failed attempt (`missing_outcome`), and once its
attempts run out the workflow hard-fails even though the work succeeded.
Close the step bead your claim returned; `gc hook current --id-only` prints it:

```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed
```

Do not set `gc.failure_class` or `gc.failure_reason` on success: a pass that
carries them is retried. If the step cannot succeed, close it with
`gc.outcome=fail`, a short stable `gc.failure_reason`, and
`gc.failure_class=transient` when a retry can succeed (network, provider,
flaky checks) or `gc.failure_class=hard` when it cannot (bad input, a broken
contract):

```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=transient --set-metadata gc.failure_reason="<short_reason>" --status=closed
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "preflight-tests"
title = "Run preflight checks on the base branch"
needs = ["workspace-setup"]
description = """
Run the configured checks before implementation.

```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```

Close this step with its outcome. The step is retry-managed: a close without
`gc.outcome` counts as a failed attempt (`missing_outcome`), and once its
attempts run out the workflow hard-fails even though the work succeeded.
Close the step bead your claim returned; `gc hook current --id-only` prints it:

```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed
```

Do not set `gc.failure_class` or `gc.failure_reason` on success: a pass that
carries them is retried. If the step cannot succeed, close it with
`gc.outcome=fail`, a short stable `gc.failure_reason`, and
`gc.failure_class=transient` when a retry can succeed (network, provider,
