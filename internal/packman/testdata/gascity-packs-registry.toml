    description = "Maintenance release for Gas City 1.5.x, cut from 0.1.10: the refinery and deacon stop leaking patrol wisps and drain instead of stalling on a failed patrol-wisp operation, the deacon dolt-health step tells a missing or bd-owned Dolt from an outage, the deacon no longer re-enters its loop from inside a turn, the mayor reports a failed dispatch instead of doing the work itself, warrants and digests are filed with bd flags that exist, and polecats close their claimed terminal step before acknowledging drain."

