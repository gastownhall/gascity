# Swarm — flat peer pack with shared-directory rigs.
#
# A mayor coordinates, a deacon patrols health, and the initialized city
# picks up mechanical housekeeping orders from the builtin core pack.
# Per-rig: N coders self-organize via beads and mail, a dedicated committer
# handles git. No worktree isolation — all rig agents share one directory.
#
# Contrast with Gas Town (examples/gastown/): fewer rig roles (2 vs 4),
# no formulas, no worktree isolation, flat peer coordination instead of
# hierarchical dispatch.
#
# To use: gc init --from examples/swarm ~/swarm-city
# Requires rigs to be registered: gc rig add <path>
#
# The sibling pack.toml owns the Swarm import.

[workspace]
name = "swarm"
provider = "claude"

[providers.claude]
base = "builtin:claude"

# Storage classes (docs/runbooks/split-storage-classes.md): work stays in the
# work ledger, and the five infrastructure classes live in one local SQLite
# store under .gc/store, created on first start. This is the split gc init
# writes for a new city. `gc init --from` copies it, except where gc init
# would start a new city single-store (a bd a split city's gc bd refuses):
# there the copy leaves it out and says why.
[storage.classes]
work = "work"
graph = "infra"
sessions = "infra"
messaging = "infra"
orders = "infra"
nudges = "infra"

[storage.bindings.infra]
provider = "sqlite-beads"
path = ".gc/store"

[daemon]
patrol_interval = "30s"
max_restarts = 5
restart_window = "1h"
shutdown_timeout = "5s"

# Register a rig to activate per-rig agents (coder, committer):
# [[rigs]]
# name = "myproject"
# path = "/path/to/your/project"
