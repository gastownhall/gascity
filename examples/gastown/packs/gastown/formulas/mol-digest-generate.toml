description = """
Generate activity digest for the mayor.

After claiming this vapor wisp, run:

```bash
gc bd formula show mol-digest-generate --json
```

Follow the step descriptions in order. When finished, close this bead, then run:

```bash
gc runtime drain-ack
```

The drain-ack tells the controller this session is done.

This formula is dispatched by the `digest-generate` order
(`orders/digest-generate.toml`), a city-scoped cooldown order:

```toml
[order]
formula = "mol-digest-generate"
scope = "city"      # exactly one townwide run/day, never one per rig
trigger = "cooldown"
interval = "24h"
pool = "dog"
```

When the 24h cooldown elapses, the controller's order dispatcher records
the run via a `type:order-run` bead (the same bead the cooldown check
reads), pours a wisp, and labels it for the dog pool. A dog picks it up
and runs this formula. There is exactly ONE townwide digest per day — the
order is `scope = "city"`, so it is not instantiated per rig, and the
single cooldown clock prevents re-pours of the same window (co-ktkqt).

## What it produces

A formatted markdown digest covering:
- Issues filed and closed (by rig, by type)
- Merge activity
- Incidents and escalations
- Agent health summary
- Trends (backlog direction, throughput)

The digest is mailed to the mayor and archived as a digest bead.

Read each step's description before acting — Config values override defaults."""
formula = "mol-digest-generate"
phase = "vapor"

[vars]
[vars.period]
description = "The digest period type (daily, weekly)"
default = "daily"

[vars.event_timeout]
description = "Seconds to wait for slow queries before giving up"
default = "30"

[[steps]]
id = "determine-period"
title = "Determine digest time range"
description = """
Establish the time range for this digest.

**1. Determine period type:**
Use {{period}} (from formula vars, defaults to "daily").

**2. Calculate time range:**

| Period | Since | Until |
|--------|-------|-------|
| daily | Yesterday 00:00 UTC | Today 00:00 UTC |
| weekly | Last Monday 00:00 UTC | This Monday 00:00 UTC |

```bash
# For daily:
SINCE=$(date -u -d 'yesterday 00:00' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
        date -u -v-1d -j -f '%H:%M' '00:00' +%Y-%m-%dT%H:%M:%SZ)
UNTIL=$(date -u -d 'today 00:00' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
        date -u -j -f '%H:%M' '00:00' +%Y-%m-%dT%H:%M:%SZ)
```

**3. Derive a stable window key** — the start date of the window, used to
label the digest bead and to detect a duplicate run of the same window:

```bash
# daily: the SINCE date, e.g. 2026-06-20 -> window:2026-06-20
WINDOW=${SINCE%%T*}
```

Note the timestamps and $WINDOW for the digest header and dedup check.

Continue to data collection when the time range is established."""

[[steps]]
id = "collect-data"
title = "Collect activity data from all rigs"
description = """
Gather activity data from each rig.

**1. List rigs:**
```bash
gc rig list
```

**2. For each rig, collect:**

a) **Issues filed and closed:**
```bash
gc bd list --created-after=$SINCE --json --limit=0
gc bd list --status=closed --closed-after=$SINCE --json --limit=0
```

b) **Merge activity:**
```bash
git -C <rig-path> log --merges --since=$SINCE --oneline main
```

c) **Incidents:**
```bash
gc bd list --label=incident --created-after=$SINCE --json
```

**3. Collect town-level data:**

a) **Session lifecycle events:**
```bash
gc events --since=$SINCE --type=session.woke,session.stopped,session.crashed --json
```

b) **Escalations:**
```bash
gc bd list --label=escalation --created-after=$SINCE --json
```

c) **Warrants filed:**
```bash
gc bd list --label=warrant --created-after=$SINCE --json
```

Continue to digest generation when all data is collected."""

[[steps]]
id = "generate-and-send"
title = "Generate digest, send to mayor, archive"
description = """
Transform data into a formatted digest and deliver it.

**0. Dedup guard — never mail two digests for the same window.**
The city-scoped order + 24h cooldown make a same-window re-pour unlikely,
but a manual `gc order run`, a cross-midnight retry, or clock skew can
still produce one. Before generating, check for an existing digest bead
for this $WINDOW:

```bash
gc bd list --label=digest,window:$WINDOW --json --limit=1
```

If one already exists, this window is already delivered. Do NOT mail or
create a second digest bead — skip to step 4 (close the work bead, augment
the existing digest bead if you have new data, drain-ack, exit).

**1. Generate digest markdown:**

```markdown
# Gas Town {{period}} Digest: {{date}}

## Summary
- **Issues filed**: N (tasks: X, bugs: Y)
- **Issues closed**: N
- **Net change**: +/-N

## By Rig
| Rig | Filed | Closed | Merges |
|-----|-------|--------|--------|
| ... | ...   | ...    | ...    |

## Highlights
- Notable completions
- Incidents (if any)

## Agent Health
- Agents started/stopped/crashed: N/N/N
- Warrants filed: N (pardoned: X, executed: Y)

## Trends
- Backlog: increasing / stable / decreasing
- Throughput: N issues/day
```

**2. Send to mayor:**
```bash
gc mail send mayor/ -s "Gas Town Digest: $DATE" -m "$DIGEST"
```

**3. Archive as bead:**
The `window:$WINDOW` label is what the step-0 dedup guard matches on, so it
MUST be present and MUST be the start date of the window (not today's date):
```bash
gc bd create --type=task \
  --title="Digest: $DATE" \
  --label=digest,{{period}},window:$WINDOW
```

**4. Close work bead, signal reconciler, and exit:**
```bash
gc bd close <work-bead> --reason "Digest generated and sent"
gc runtime drain-ack
exit
```

The controller's order dispatcher records this run via a `type:order-run`
bead for cooldown tracking; the next tick honors the 24h interval."""
