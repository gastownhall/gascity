# Binding definitions for the class map in city.toml.
#
# A binding names one storage provider compiled into this gc binary plus that
# provider's own secret-free configuration. The reserved `work` binding is
# synthesized from the city's own work topology: it needs no definition here
# and must not be redefined.
#
# The built-in sqlite-beads provider owns everything under `path` (default
# ".gc/store"): one pure-Go SQLite bead engine, at <path>/graph/beads.sqlite,
# serving every class assigned to this binding.
[storage.bindings.infra]
provider = "sqlite-beads"
path = ".gc/store"

# A provider that is not built in takes an opaque config_ref it resolves
# itself instead of a path, and the class map points at it by name:
#
#   [storage.classes]
#   graph = "elsewhere"
#
#   [storage.bindings.elsewhere]
#   provider = "<compiled-provider-id>"
#   config_ref = "infrastructure-production"
#
# A downstream fork adds that provider by appending one factory to its own
# copy of the compiled provider list and implementing the engine-open seam;
# nothing in this file changes shape for it.
#
# There is no migration or mode key. Changing an assignment, a provider, or a
# provider's configuration takes effect on restart, and a city whose data has
# not moved to match refuses to start rather than serving from the wrong side
# of the change. `gc storage migrate --from-work` performs the move.
