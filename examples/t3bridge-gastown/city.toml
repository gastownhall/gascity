# Minimal Gas Town city for testing the native T3 bridge provider.

[workspace]
name = "t3bridge-gastown"
provider = "codex"

[providers.codex]
base = "builtin:codex"

[session]
provider = "t3bridge"
startup_timeout = "2m"
nudge_ready_timeout = "30s"

[imports.t3demo]
source = "packs/t3demo"

# Storage classes (docs/runbooks/split-storage-classes.md): work stays in the
# work ledger, and the five infrastructure classes live in one local SQLite
# store under .gc/store, created on first start. This is the split gc init
# writes for a new city; `gc init --from` copies it as it is.
[storage.classes]
work = "work"
graph = "infra"
sessions = "infra"
messaging = "infra"
orders = "infra"
nudges = "infra"

[storage.bindings.infra]
provider = "sqlite-beads"
path = ".gc/store"

[daemon]
patrol_interval = "30s"
max_restarts = 3
restart_window = "1h"
shutdown_timeout = "5s"
formula_v2 = true

[[rigs]]
name = "example"
path = "."

[rigs.imports.t3demo]
source = "packs/t3demo"

# Builtin packs compose through explicit imports; the gc binary pre-seeds
# these pinned versions offline from its embedded content. Pinning a
# different commit fetches that commit from git like any remote import.
# The builtin-pack-imports doctor check repairs missing entries.
[imports.core]
source = "https://github.com/gastownhall/gascity.git//internal/bootstrap/packs/core"
version = "sha:e38ce9cc55d15fa351199c042f0d07aba1a347af"

[imports.bd]
source = "https://github.com/gastownhall/gascity.git//examples/bd"
version = "sha:e38ce9cc55d15fa351199c042f0d07aba1a347af"
