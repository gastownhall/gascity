# BD — beads provider pack.
#
# Ships the bd (beads) CLI integration. The default bd backend uses the
# managed Dolt pack; [beads].backend = "doltlite" keeps bd on local doltlite
# storage without starting a Dolt SQL server.
#
# This pack is bundled with the gc binary and active by default.
# The SDK's default [beads].provider = "bd" relies on this pack's provider
# script. Gascity auto-includes the dolt pack separately when needed.

[pack]
name = "bd"
schema = 2
