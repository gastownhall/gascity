# Converted from formula+pool to exec. All backup operations are
# deterministic: `bd backup status/init/sync` per bead scope through gc bd,
# then an rsync of the backup artifacts to the offsite path. No LLM judgment
# needed — runs inline in the controller. For up to ten scopes, the default
# budget covers scope lookup/status/init (3*60s), three sync attempts (3*120s),
# source HEAD lookup (60s), offline restore verification (120s+60s), plus
# rig discovery (60s), the lock wait (5s), and offsite rsync (300s): 8165s.
# A known verified no-op avoids the restore. Larger cities or raised bounds
# require a corresponding order timeout increase.
[order]
description = "Back up every bead scope with bd backup"
exec = "$PACK_DIR/assets/scripts/mol-dog-backup.sh"
trigger = "cooldown"
interval = "6h"
timeout = "9000s"
