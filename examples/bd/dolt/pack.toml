# Dolt — reusable Dolt database management pack.
#
# Provides lifecycle commands (status, start, restart, logs, sql, list, recover,
# sync, rollback, cleanup, health) for the Dolt SQL server backing bead storage.
#
# Formula-backed orders route to this pack's local dog agent pool.
#
# Minimum dolt version: 2.6.0. This is the managed bd/Dolt compatibility
# floor: the first Dolt built with a Go toolchain that distrusts the
# compromised eMudhra CA intermediates. It also preserves the original guard
# for the GC/writer deadlock fixed in dolthub/dolt commit ccf7bde206
# (PR #10876). The doctor check (doctor/check-dolt) fails closed on it.
# mol-dog-backup runs `bd backup`, so bd owns its Dolt floor.

[pack]
name = "dolt"
schema = 2
