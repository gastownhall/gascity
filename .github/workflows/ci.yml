name: CI

on:
  workflow_call:
    inputs:
      force_blacksmith:
        description: Force all jobs in the reusable CI graph onto Blacksmith runners.
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-policy:
    name: Runner policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      use_blacksmith: ${{ steps.policy.outputs.use_blacksmith }}
      reason: ${{ steps.policy.outputs.reason }}
      runner_2vcpu: ${{ steps.policy.outputs.runner_2vcpu }}
      runner_8vcpu: ${{ steps.policy.outputs.runner_8vcpu }}
      runner_16vcpu: ${{ steps.policy.outputs.runner_16vcpu }}
      runner_32vcpu: ${{ steps.policy.outputs.runner_32vcpu }}
      runner_windows: ${{ steps.policy.outputs.runner_windows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select runner backend
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FORCE_BLACKSMITH: ${{ inputs.force_blacksmith }}
        run: |
          python3 .github/workflows/scripts/runner_policy.py

  # Detect which paths changed to gate the path-scoped jobs below.
  changes:
    name: Detect changes
    needs: runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_2vcpu }}
    outputs:
      # Gated outputs fold in the `shared` filter: a change to a cross-cutting
      # core path runs the full suite (union run) even when the path-scoped
      # filter would not match on its own. This closes the path-filter
      # asymmetry where a subtle change in shared code skips the jobs it could
      # break. Downstream consumers read these outputs unchanged.
      mail: ${{ steps.filter.outputs.mail == 'true' || steps.filter.outputs.shared == 'true' }}
      beads: ${{ steps.filter.outputs.beads == 'true' || steps.filter.outputs.shared == 'true' }}
      packs: ${{ steps.filter.outputs.packs == 'true' || steps.filter.outputs.shared == 'true' }}
      credential_provider: ${{ steps.filter.outputs.credential_provider == 'true' || steps.filter.outputs.shared == 'true' }}
      # Raw cross-cutting signal and per-run coverage classification (metric).
      shared: ${{ steps.filter.outputs.shared }}
      suite_mode: ${{ steps.coverage.outputs.suite_mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            mail:
              - 'internal/mail/**'
              - 'contrib/mail-scripts/**'
            beads:
              - 'go.mod'
              - 'internal/beads/**'
              - 'test/acceptance/beads_cli_contract_test.go'
              - 'deps.env'
              - '.github/scripts/install-bd-archive.sh'
              - 'cmd/gc/init_provider_readiness.go'
            packs:
              - 'examples/gastown/**'
              - 'internal/config/pack.go'
              - 'internal/config/compose.go'
              - 'cmd/gc/embed_builtin_packs.go'
              - 'scripts/update-bundled-gastown-pack'
            credential_provider:
              - 'go.mod'
              - 'go.sum'
              - 'internal/credentialprovider/**'
              - 'internal/testenv/**'
              - 'internal/testutil/**'
            # Cross-cutting core paths. A change here is folded into every
            # gated output above, forcing a full union run. Beads is the
            # universal persistence substrate, events the universal observation
            # substrate, config the universal activation mechanism; build,
            # dependency, and CI workflow/composite-action files affect every
            # job. The setup-gascity-ubuntu and go-mod-download composite
            # actions and the scripts they invoke are shared by nearly every
            # job, so a change to them must re-run all path-gated suites.
            shared:
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/**'
              - '.github/actions/setup-gascity-ubuntu/**'
              - '.github/actions/go-mod-download/**'
              - '.github/scripts/go-mod-download-retry.sh'
              - '.github/scripts/go-mod-verify-cache.sh'
              - '.github/scripts/install-dolt-archive.sh'
              - '.github/scripts/install-bd-archive.sh'
              - '.github/scripts/install-claude-native.sh'
              - 'internal/beads/**'
              - 'internal/events/**'
              - 'internal/config/**'
      - name: Classify suite coverage
        id: coverage
        env:
          SHARED_FILTER_RESULT: ${{ steps.filter.outputs.shared }}
        run: python3 .github/workflows/scripts/ci_suite_coverage.py classify "$SHARED_FILTER_RESULT"

  # Every build and test of this tree runs under Bazel on rbe-west, gated by
  # bazel.yml's required checks "bazel test (side-by-side)" and "BUILD files
  # in sync" (unit lane: //..., nogo lint/vet, gofmt, generated-artifact
  # drift incl. the OpenAPI breaking-change gate, policy guards, dashboard,
  # //:goreleaser_check_test; acceptance lane: Tier A incl. the beads
  # topology rows; integration-packages and integration-smoke lanes;
  # bazel-nightly.yml: the full //test/integration suite and `bazel
  # coverage` to Codecov). This workflow keeps only what Bazel cannot run:
  #   - credential-provider-windows: rbe-west has no Windows workers, so the
  #     Windows process-tree tests run on a Blacksmith Windows runner;
  #   - pack-gate, mcp-mail, contract-radar-bd-head: live probes of upstream
  #     services (the gascity-packs registry, mcp_agent_mail, beads main
  #     HEAD), not tests of this tree.
  # Check and CI / required keep their names for branch protection and the
  # main ruleset; both fan in exactly those gating jobs.

  contract-radar-bd-head:
    name: Contract radar (gc HEAD x bd main HEAD)
    needs:
      - runner-policy
      - changes
    if: ${{ needs.changes.outputs.beads == 'true' }}
    runs-on: ${{ needs.runner-policy.outputs.runner_32vcpu }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download
      - name: Build bd from beads main HEAD
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/beads-src"
          git clone --depth 1 --filter=blob:none https://github.com/gastownhall/beads "$src"
          mkdir -p "${HOME}/.local/bin"
          go -C "$src" build -tags gms_pure_go -o "${HOME}/.local/bin/bd" ./cmd/bd
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Verify bd on PATH
        run: bd version
      - name: bd CLI contract (main HEAD)
        run: make test-bd-cli-contract
      - name: bd CLI contract HOME isolation (main HEAD)
        run: make test-bd-cli-contract-home-isolation

  credential-provider-windows:
    name: Credential provider / Windows process tree
    needs:
      - runner-policy
      - changes
    if: needs.changes.outputs.credential_provider == 'true'
    runs-on: ${{ needs.runner-policy.outputs.runner_windows }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download
      - name: Test credential-provider unit contract
        run: go test -count=1 ./internal/credentialprovider
      - name: Test Windows Job Object descendant cleanup
        run: go test -tags=integration -count=1 ./internal/credentialprovider -run '^TestCredentialProviderWindowsJob' -timeout=45s

  # Runs distinct live/provenance checks when pack-related files change.
  pack-gate:
    name: Pack compatibility gate
    needs:
      - runner-policy
      - changes
    if: needs.changes.outputs.packs == 'true'
    runs-on: ${{ needs.runner-policy.outputs.runner_32vcpu }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download
      # The gastown pack ships via the gascity-packs Go module, so a routine
      # go.mod bump can silently desync the embedded pack bytes from the
      # provenance pins in internal/config/public_packs.go and the
      # examples/gastown import. This check fails when any pin drifts from
      # the latest registry release; every in-repo test stays green after
      # such a drift, so this is the only automated guard.
      - name: Bundled gastown pack pin check
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if scripts/update-bundled-gastown-pack --check; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Live registry smoke
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if make test-pack-registry-live; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
        env:
          GC_TEST_GASCITY_PACKS_REGISTRY: main

  # Runs when mail-related source paths change.
  mcp-mail:
    name: MCP mail conformance
    needs:
      - runner-policy
      - changes
    if: needs.changes.outputs.mail == 'true'
    runs-on: ${{ needs.runner-policy.outputs.runner_8vcpu }}
    continue-on-error: true  # upstream mcp_agent_mail API may drift
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install mcp_agent_mail
        run: python -m pip install --no-deps --require-hashes -r .github/requirements/mcp-agent-mail.txt

      - name: MCP mail conformance test
        run: make test-mcp-mail

  # The main ruleset's required "Check". It fans in the same gating jobs as
  # CI / required (the Bazel lanes gate through bazel.yml's own required
  # checks).
  check:
    name: Check
    needs:
      - runner-policy
      # `changes` is a hard dependency so a filter-job flake fails Check
      # directly.
      - changes
      - credential-provider-windows
      - pack-gate
    if: ${{ always() }}
    runs-on: ${{ needs.runner-policy.outputs.runner_2vcpu }}
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Summarize check gates
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # credential-provider-windows and pack-gate are path-gated: a
          # skipped result means the change does not touch their paths.
          allow_skipped = {"credential-provider-windows", "pack-gate"}
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {}
          for job, meta in sorted(needs.items()):
              result = meta.get("result", "unknown")
              if result == "success":
                  continue
              if result == "skipped" and job in allow_skipped:
                  continue
              failed[job] = result

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("## Check\n\n")
              handle.write("| Job | Result |\n| --- | --- |\n")
              for job, meta in sorted(needs.items()):
                  handle.write(f"| {job} | {meta.get('result', 'unknown')} |\n")

          if failed:
              for job, result in failed.items():
                  print(f"{job}: {result}", file=sys.stderr)
              sys.exit(1)
          PY

  # Branch protection's (and the hotfix/release ruleset's) required
  # "CI / required".
  ci-required:
    name: CI / required
    needs:
      - runner-policy
      - changes
      - check
      - credential-provider-windows
      - pack-gate
    if: ${{ always() }}
    runs-on: ${{ needs.runner-policy.outputs.runner_2vcpu }}
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Summarize required gates
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # credential-provider-windows and pack-gate are path-gated: a
          # skipped result means the change does not touch their paths.
          allow_skipped = {"credential-provider-windows", "pack-gate"}
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {}
          for job, meta in sorted(needs.items()):
              result = meta.get("result", "unknown")
              if result == "success":
                  continue
              if result == "skipped" and job in allow_skipped:
                  continue
              failed[job] = result

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("## CI Required\n\n")
              handle.write("| Job | Result |\n| --- | --- |\n")
              for job, meta in sorted(needs.items()):
                  handle.write(f"| {job} | {meta.get('result', 'unknown')} |\n")

          if failed:
              for job, result in failed.items():
                  print(f"{job}: {result}", file=sys.stderr)
              sys.exit(1)
          PY
