name: Bazel canary

on:
  workflow_dispatch:
  # Run every PR so docs-only changes can prove the bounded graph is unrelated;
  # a trigger-level paths filter would hide that evidence and could hide an
  # unexpectedly affected config change.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  bazel-canary:
    name: Bazel selective canary
    runs-on: ubuntu-24.04
    # Evidence only; required Go/Make lanes remain authoritative.
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed Bazel targets
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT: ${{ runner.temp }}/gascity-bazel-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          scripts/bazel-canary.sh resolve

      - name: Set up Go for parity and Bazelisk
        if: steps.resolve.outputs.run_bazel == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install pinned Bazelisk
        if: steps.resolve.outputs.run_bazel == 'true'
        env:
          GOBIN: ${{ runner.temp }}/bazel-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/bazelbuild/bazelisk@v1.26.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Run Go parity and selected Bazel targets
        if: steps.resolve.outputs.run_bazel == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT: ${{ runner.temp }}/gascity-bazel-${{ github.run_id }}-${{ github.run_attempt }}
          RESOLVER: scripts/bazel_target_resolver.py
        run: |
          set -euo pipefail
          # The resolver phase wrote the selected labels to GITHUB_OUTPUT and
          # the artifact directory; the execution phase is kept in one script
          # so local backtests and CI exercise the same bounded command.
          scripts/bazel-canary.sh

      - name: Shut down Bazel canary server
        if: always()
        env:
          OUT: ${{ runner.temp }}/gascity-bazel-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          base="${CACHE_ROOT:-${OUT}.cache}/output-base"
          bazel="$(command -v bazelisk || command -v bazel || true)"
          if [[ -n "$bazel" ]]; then
            timeout --signal=TERM --kill-after=3 10 "$bazel" --output_base="$base" shutdown \
              >"$OUT/shutdown-final.log" 2>&1 || true
          fi

      - name: Summarize canary artifacts
        if: always()
        env:
          OUT: ${{ runner.temp }}/gascity-bazel-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -u
          mkdir -p "$OUT"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            [[ -f "$OUT/summary.txt" ]] && cat "$OUT/summary.txt"
          } >"$OUT/summary.final.txt"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "## Bazel canary"
              echo
              if [[ -f "$OUT/summary.txt" ]]; then sed 's/^/- /' "$OUT/summary.txt"; else echo "- no summary was produced"; fi
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Bazel canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gascity-bazel-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 14
