# Bazel side-by-side build + test. Does not gate the Go CI (ci.yml); runs
# the Bazel arm against the same commit so drift is caught early.
#
# Execution mode is env-driven:
#   BAZEL_REMOTE_EXECUTOR  remote execution endpoint (grpc://...). Unset (fork
#                 PRs, no secrets; rbe=cache/off dispatches) = local execution
#                 with lookups in rbe-west's anonymous read-only cache
#                 (.bazelrc `fork-cache`; misses run here, nothing is
#                 uploaded), or with no remote at all for rbe=off.
#   RBE_TLS_CERT / RBE_TLS_KEY / RBE_TLS_CA
#                 client certificate for mTLS endpoints (optional, base64).
#   RBE_INSTANCE  RE instance name (optional, default empty).
#
# Fork and Dependabot PRs (no secrets, no OIDC, no vars) first ask rbe-west's
# certificate mint (rbe-fork, infra nativelink-cas/west README "rbe-fork";
# rbe-mint.ops.gascity.com:8444): while it is open for this run, the job
# proves itself with a CSR uploaded as an artifact of the run, gets a
# short-lived certificate (tools/rbe/fork-credential.sh, a byte copy of
# beads' setup-bazel one) and executes remotely on
# rbe-fork.ops.gascity.com:8444, instance oss-fork (the fork pool, nothing
# cached) or, for allowlisted authors (.github/rbe-fork-allowlist.txt), oss.
# Anything else (closed, refused, unreachable, a failed step) leaves the job
# on the read-only fork cache exactly as before: the rbe-fork steps are
# continue-on-error and nothing below reads them but the certificate.
#
# rbe-west (farm v2, opt-in with repo variable RBE_WEST_WORKERS=true):
#   RBE_WEST_EXECUTOR  grpcs:// endpoint of the Phoenix core (secret; not in git).
#   RBE_WORKER_TLS_CERT / RBE_WORKER_TLS_KEY  base64 PEM, CN=rbe-oss-worker.
#   The bazel job targets instance "oss" (rbe-west's OSS scheduler), served by
#   the Blacksmith worker pool (rbe-worker-pool.yml). The job pre-warms the
#   pool (one worker if none is up) so capacity boots during checkout and
#   analysis; the rbe-west scaler adds workers from OSS queue depth. Blacksmith
#   donates that compute for OSS-repo workflows only, so only this repo's own
#   runs (never fork PRs, never developer builds) use it.
name: bazel-test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rbe:
        description: "on: remote execution (secrets); cache: fork simulation (anonymous read-only cache); off: local only"
        type: choice
        default: "on"
        options: ["on", "cache", "off"]

# A PR's runs share one group and a newer one cancels the older. Every other
# event (push to main, dispatch) gets its own group (the run id), so it is
# never cancelled or queued behind another run: main runs save the runner
# cache and upload coverage. (A shared group without cancel-in-progress
# would still replace a pending run with the next one.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bazel:
    name: bazel test (side-by-side)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write # dispatch rbe-worker-pool.yml (pre-warm)
      issues: read # worker-env drift issues (tools/rbe/worker-env-drift)
    env:
      # Hoisted so the step-level `if:` below can see it. Empty for forks
      # (no secrets) and for rbe=cache/off dispatches: the job then runs
      # locally.
      BAZEL_REMOTE_EXECUTOR: ${{ inputs.rbe != 'cache' && inputs.rbe != 'off' && ((vars.RBE_WEST_WORKERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && secrets.RBE_WEST_EXECUTOR || secrets.BAZEL_REMOTE_EXECUTOR) || '' }}
      RBE_INSTANCE_OVERRIDE: ${{ (vars.RBE_WEST_WORKERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'oss' || '' }}
      # Without an executor: rbe-west's anonymous read-only cache, unless rbe=off.
      BAZEL_FORK_CACHE: ${{ inputs.rbe != 'off' && 'true' || '' }}
      # Fork and Dependabot PRs: remote execution on rbe-fork with a
      # short-lived certificate from rbe-west's mint (infra README "rbe-fork";
      # tools/rbe/fork-credential.sh). If the mint is closed or refuses, the
      # job falls back to the read-only fork cache as before.
      BAZEL_FORK_REMOTE: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'true' || '' }}
    steps:
      # Best effort: a worker boots (~30 s) while this job checks out and
      # analyzes. The rbe-west scaler covers anything beyond one worker.
      - name: Pre-warm the OSS worker pool (rbe-west)
        if: env.BAZEL_REMOTE_EXECUTOR != '' && vars.RBE_WEST_WORKERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rbe-worker-pool.yml --limit 50 \
            --json status --jq '[.[] | select(.status != "completed")] | length' || echo 0)
          if [ "${active:-0}" -eq 0 ]; then
            gh workflow run rbe-worker-pool.yml -R "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              && echo "dispatched a pool worker" || echo "::warning::pool dispatch failed; relying on the rbe-west scaler"
          else
            echo "${active} pool worker(s) already up"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # History for the merge below (blobless: commits and trees only).
          fetch-depth: 0
          filter: blob:none

      # A pull_request run checks out refs/pull/N/merge as GitHub computed it
      # when the event fired. A reopen, an approval-delayed first-time run or
      # "Re-run jobs" reuses that commit, so it can predate fixes on main
      # (2026-10-03: #6956 was closed and reopened at 21:24Z and its run tested
      # a merge onto 28279be, before #6974's no-network test stubs). Test the PR
      # head merged onto main's current tip instead; a conflict fails here
      # (pull_request only; .github/actions/fresh-merge).
      - name: Merge the PR head onto the base branch's current tip
        id: fresh-merge
        uses: ./.github/actions/fresh-merge

      - name: Install bazel via bazelisk
        run: |
          curl -sSfL -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazel
          # Blacksmith (gastownhall pool): the image user's ~/.cache is root-owned and the
          # bazel JVM stats user.home/.cache regardless of HOME/output_user_root. Make it
          # writable; also keep bazelisk state under the runner temp.
          sudo chmod 755 /home/ubuntu
          sudo mkdir -p /home/ubuntu/.cache && sudo chown "$(id -u):$(id -g)" /home/ubuntu/.cache
          mkdir -p "$RUNNER_TEMP/bazel-home" && echo "BAZELISK_HOME=$RUNNER_TEMP/bazel-home" >> "$GITHUB_ENV"

      # Runner-side bazel caches: without these every run re-hashes the
      # 205MB repo_source_tree + SDK before a single action can start.
      # The output base's local action cache records outputs that live only in
      # the remote CAS (--remote_download_minimal). A key that never changes is
      # never re-saved, so those records go stale when the farm or its CAS
      # changes and every run pays a lost-inputs build restart. Rotate daily.
      # Only pushes to main save (~880MB): per-PR saves would churn the repo's
      # 10GB cache and evict main's entry. PRs restore main's latest.
      # The path list keeps everything under --output_user_root except the
      # repository cache's download store (cache/repos/v1/content_addressable),
      # which holds raw archives by sha256: the ~1.9GB LLVM tarball alone would
      # take the entry from ~880MB to ~3.7GB. Extracted repositories stay
      # cached in cache/repos/v1/contents (repo contents cache), so a warm run
      # downloads nothing. actions/cache tars each matched directory
      # recursively, so a lone `!` exclusion under a listed parent is ignored:
      # every ancestor of the excluded directory is expanded one level instead.
      # Restore and save must list the same paths (they are part of the cache
      # version). scripts/bazel_output_cache_test.go pins this.
      - name: Bazel cache day
        id: bazel-cache-day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore bazel output base
        id: bazel-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/bazel-outputs/*
            !${{ runner.temp }}/bazel-outputs/cache
            ${{ runner.temp }}/bazel-outputs/cache/*
            !${{ runner.temp }}/bazel-outputs/cache/repos
            ${{ runner.temp }}/bazel-outputs/cache/repos/*
            !${{ runner.temp }}/bazel-outputs/cache/repos/v1
            ${{ runner.temp }}/bazel-outputs/cache/repos/v1/*
            !${{ runner.temp }}/bazel-outputs/cache/repos/v1/content_addressable
          key: bazel-v2-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}-${{ steps.bazel-cache-day.outputs.day }}
          restore-keys: |
            bazel-v2-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}-
            bazel-v2-${{ runner.os }}-

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      # rbe-fork (fork and Dependabot PRs): the mint's status decides; on
      # "open" a key and CSR, the CSR as an artifact of this run (the mint's
      # proof), then the certificate. Any failure here leaves the job on the
      # read-only fork cache (the steps below key on steps.fork-cert).
      - name: rbe-fork status
        id: fork-status
        if: env.BAZEL_REMOTE_EXECUTOR == '' && env.BAZEL_FORK_REMOTE == 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          st=$(curl -sS --connect-timeout 5 --max-time 30 --retry 3 --retry-all-errors \
            "https://rbe-mint.ops.gascity.com:8444/v1/status?repo=${GITHUB_REPOSITORY#*/}&run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT&pr=$PR_NUMBER" || echo '{}')
          tier=$(jq -r 'if .open == true then .tier else "" end' <<<"$st" 2>/dev/null || true)
          case "$tier" in ro|rw) ;; *) tier= ;; esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          [ -n "$tier" ] || echo "::warning title=rbe-fork closed for this run::$(jq -r '.reason // .error // "unreachable"' <<<"$st" 2>/dev/null || echo unreachable); read-only fork cache instead"
      - name: rbe-fork key and CSR
        id: fork-key
        if: steps.fork-status.outputs.tier != ''
        continue-on-error: true
        env:
          BAZEL_CI_SECRET_DIR: ${{ runner.temp }}/rbe-fork
        run: bash tools/rbe/fork-credential.sh key
      - name: rbe-fork CSR artifact (proof of this run)
        id: fork-csr
        if: steps.fork-key.outputs.csr != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.fork-key.outputs.artifact-name }}
          path: ${{ steps.fork-key.outputs.csr }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: rbe-fork certificate (rbe-fork-mint)
        id: fork-cert
        if: steps.fork-csr.outputs.artifact-id != ''
        continue-on-error: true
        env:
          BAZEL_CI_SECRET_DIR: ${{ runner.temp }}/rbe-fork
          ARTIFACT_ID: ${{ steps.fork-csr.outputs.artifact-id }}
          RBE_FORK_PR: ${{ github.event.pull_request.number }}
          RBE_FORK_TIER: ${{ steps.fork-status.outputs.tier }}
        run: bash tools/rbe/fork-credential.sh cert

      # worker-env (tools/rbe/worker-env-drift): rbe-west's schedulers match
      # the worker-env pin exactly, and pool workers serve the default
      # branch's pin only. A change that moves the pin can't run remotely
      # before it merges: the remote suite is skipped (pin-moved) and the
      # last step measures this Blacksmith host against the new manifest
      # instead, as it does for any change to the worker host (measure). A
      # remote run on a pin with an open drift issue fails here rather than
      # queueing for an hour.
      - name: worker-env preflight
        id: worker-env
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RBE_FORK_CERT: ${{ steps.fork-cert.outputs.cert }}
        run: |
          # Remote exactly when the bazel steps pass --config=remote-exec.
          if [ -n "$BAZEL_REMOTE_EXECUTOR" ] || [ -n "$RBE_FORK_CERT" ]; then export WORKER_ENV_REMOTE=true; fi
          git fetch --no-tags --filter=blob:none origin "refs/heads/$DEFAULT_BRANCH"
          git show FETCH_HEAD:platforms/BUILD.bazel >"$RUNNER_TEMP/worker-env-base.bazel" 2>/dev/null ||
            : >"$RUNNER_TEMP/worker-env-base.bazel"
          git diff --name-only FETCH_HEAD HEAD >"$RUNNER_TEMP/worker-env-changed"
          tools/rbe/worker-env-drift preflight "$RUNNER_TEMP/worker-env-base.bazel" "$RUNNER_TEMP/worker-env-changed"

      # One .bazelrc.local for both remote modes, carrying endpoints and
      # credentials only: every key-affecting flag is committed in .bazelrc,
      # so trusted, fork and developer runs hash actions alike. With an
      # executor (secrets, or an rbe-fork certificate): build:remote-exec
      # (endpoint, instance, mTLS). Without one (forks, no secrets; rbe=cache
      # dispatches): build --config=fork-cache, so lookups go to the anonymous
      # read-only cache and misses run here. rbe=off writes nothing.
      # scripts/bazel_fork_cache_test.go and bazel_key_parity_test.go run this
      # script in every mode and check the output.
      - name: Configure remote execution or the read-only fork cache
        if: env.BAZEL_REMOTE_EXECUTOR != '' || env.BAZEL_FORK_CACHE == 'true'
        env:
          RBE_FORK_ENDPOINT: ${{ steps.fork-cert.outputs.endpoint }}
          RBE_FORK_INSTANCE: ${{ steps.fork-cert.outputs.instance }}
          RBE_FORK_CERT_FILE: ${{ steps.fork-cert.outputs.cert }}
          RBE_FORK_KEY_FILE: ${{ steps.fork-cert.outputs.key }}
          RBE_TLS_CERT: ${{ secrets.RBE_TLS_CERT }}
          RBE_TLS_KEY: ${{ secrets.RBE_TLS_KEY }}
          RBE_TLS_CA: ${{ secrets.RBE_TLS_CA }}
          RBE_INSTANCE: ${{ env.RBE_INSTANCE_OVERRIDE || secrets.RBE_INSTANCE }}
        run: |
          {
            if [ -n "$BAZEL_REMOTE_EXECUTOR" ]; then
              echo 'build:remote-exec --remote_executor='"$BAZEL_REMOTE_EXECUTOR"
              [ -n "$RBE_INSTANCE" ] && echo 'build:remote-exec --remote_instance_name='"$RBE_INSTANCE"
              if [ -n "$RBE_TLS_CERT" ]; then
                printf '%s' "$RBE_TLS_CERT" | base64 -d > /tmp/rbe-cert.pem
                printf '%s' "$RBE_TLS_KEY" | base64 -d > /tmp/rbe-key.pem
                echo 'build:remote-exec --tls_client_certificate=/tmp/rbe-cert.pem'
                echo 'build:remote-exec --tls_client_key=/tmp/rbe-key.pem'
                if [ -n "$RBE_TLS_CA" ]; then
                  printf '%s' "$RBE_TLS_CA" | base64 -d > /tmp/rbe-ca.pem
                  echo 'build:remote-exec --tls_certificate_authority=/tmp/rbe-ca.pem'
                fi
              fi
            fi
            if [ -n "$RBE_FORK_CERT_FILE" ]; then
              # rbe-fork: the mint's endpoint, instance (oss-fork, or oss for
              # allowlisted authors) and short-lived certificate.
              echo "build:remote-exec --remote_executor=$RBE_FORK_ENDPOINT"
              echo "build:remote-exec --remote_instance_name=$RBE_FORK_INSTANCE"
              echo "build:remote-exec --tls_client_certificate=$RBE_FORK_CERT_FILE"
              echo "build:remote-exec --tls_client_key=$RBE_FORK_KEY_FILE"
              echo 'build:remote-exec --remote_max_connections=8'
            elif [ -z "$BAZEL_REMOTE_EXECUTOR" ]; then
              echo 'build --config=fork-cache'
              # REAPI zstd for the anonymous cache's transfers, only while
              # rbe-cache (:8443) advertises it: cache-zstd-probe.sh asks its
              # GetCapabilities, and any failure means no flag (never a failed
              # step). A probe, not a repository variable: fork pull_request
              # runs see no vars. Never under remote-exec: rbe-west's trusted
              # schedulers and the fork edge advertise no compressor, and
              # Bazel then refuses the remote. Transport only, so action keys
              # are unchanged.
              if bash tools/rbe/cache-zstd-probe.sh; then
                echo 'build:fork-cache --remote_cache_compression'
              fi
            fi
          } > .bazelrc.local

      # Locally run tests (fork cache, rbe=off) see .bazelrc's pinned test
      # PATH, so give them the Go the remote workers have at /usr/local/go.
      - name: Provide /usr/local/go for locally run tests
        if: env.BAZEL_REMOTE_EXECUTOR == '' && steps.fork-cert.outputs.cert == ''
        run: |
          if [ ! -e /usr/local/go ]; then
            sudo ln -s "$(go env GOROOT)" /usr/local/go
          elif [ ! -x /usr/local/go/bin/go ]; then
            echo "::warning::/usr/local/go exists without bin/go; tests that exec go may fail"
          fi

      - name: Create Bazel test tmpdir
        run: |
          # .bazelrc sets test --test_tmpdir=/tmp/bt and
          # --sandbox_writable_path=/tmp/bt unconditionally (#6525). Nothing
          # else creates that directory on the runner, so every sandboxed
          # action fails on a cold runner without this.
          # HOME is deliberately NOT overridden or forwarded: remote workers
          # run as their own user, and a HOME pointing at a nonexistent path
          # makes git fail there (fail-closed code reads that as dirty-repo);
          # with HOME unset in the action env, git falls back to the passwd
          # entry, correct on every machine.
          mkdir -p /tmp/bt

      - name: "bazel test //... (+ acceptance)"
        if: steps.worker-env.outputs.pin-moved != 'true'
        env:
          RBE_FORK_CERT: ${{ steps.fork-cert.outputs.cert }}
        run: |
          ARGS=(--output_user_root="$RUNNER_TEMP"/bazel-outputs)
          PROFILE=(--profile=/tmp/bazel-profile.json)
          # Build Event Protocol per invocation: the cache report step below
          # counts cached vs executed test targets from these.
          mkdir -p /tmp/bazel-bep
          # Unit arm runs in the default configuration so its cache keys stay
          # stable; tagged suites get their own invocations because
          # --define=gotags reconfigures every action under it (a full-world
          # define would double the farm's cache entries). bd/dolt ship as
          # pinned prebuilt release binaries via MODULE.bazel http_archive
          # data deps, so workers need no network or system bd.
          # --test_timeout stays at or below 1100s: the scheduler caps action
          # timeouts at 1200s and rejects anything larger as NO STATUS.
          # --config=remote-exec only with an executor: its --remote_timeout=3600
          # would otherwise override fork-cache's 15s (.bazelrc.local applies
          # fork-cache for forks).
          if [ -n "$BAZEL_REMOTE_EXECUTOR" ] || [ -n "$RBE_FORK_CERT" ]; then
            RCEXEC=(--config=remote-exec)
          else
            RCEXEC=()
          fi
          bazel "${ARGS[@]}" test "${PROFILE[@]}" //... \
            --build_event_json_file=/tmp/bazel-bep/unit.json \
            "${RCEXEC[@]}" --test_output=errors --keep_going
          bazel "${ARGS[@]}" test "${PROFILE[@]}" //test/acceptance:acceptance_test \
            --build_event_json_file=/tmp/bazel-bep/acceptance.json \
            "${RCEXEC[@]}" --test_output=errors --keep_going \
            --define=gotags=acceptance_a --test_timeout=1100

      - name: Save bazel output base
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/bazel-outputs/*
            !${{ runner.temp }}/bazel-outputs/cache
            ${{ runner.temp }}/bazel-outputs/cache/*
            !${{ runner.temp }}/bazel-outputs/cache/repos
            ${{ runner.temp }}/bazel-outputs/cache/repos/*
            !${{ runner.temp }}/bazel-outputs/cache/repos/v1
            ${{ runner.temp }}/bazel-outputs/cache/repos/v1/*
            !${{ runner.temp }}/bazel-outputs/cache/repos/v1/content_addressable
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Critical-path report + budget (the optimization loop metric)
        if: always()
        run: python3 tools/bazel/critpath.py /tmp/bazel-profile.json --tier T2 --budget 150 || true

      # Cross-phase test skipping, measured: per invocation, how many test
      # targets were cache hits (local / remote / disk) vs executed (remote /
      # local), plus failures, flakes and action-level runner counts, from the
      # BEP files above (internal/testpolicy/bepsummary). A phase that did not
      # run (a failed unit step stops acceptance) shows as "no BEP file".
      # Reporting only: a parse failure marks this step, never the job.
      - name: Bazel test cache report (BEP)
        if: always()
        continue-on-error: true
        run: |
          case "$GITHUB_EVENT_NAME/$GITHUB_REF" in
            pull_request/*) context="pr" ;;
            push/refs/heads/main) context="main" ;;
            *) context="$GITHUB_EVENT_NAME" ;;
          esac
          mkdir -p /tmp/bazel-bep
          go run ./scripts/bazel-bep-summary.go --context "$context" --allow-missing \
            --json-out /tmp/bazel-bep/summary.json \
            unit=/tmp/bazel-bep/unit.json \
            acceptance=/tmp/bazel-bep/acceptance.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bazel test cache report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-bep-summary-${{ github.run_attempt }}
          path: /tmp/bazel-bep/summary.json
          retention-days: 30
          if-no-files-found: warn

      # Coverage reporting only matters on the main branch — mirrors the go-test
      # arm's policy (preflight-unit-cover-*). The lcov combined report uploads
      # under its own flag so Codecov keeps bazel and go-test signals separable;
      # instrumented builds are a separate bazel configuration, so the first run
      # on a cold cache compiles the world under coverage (~15-20 min remote).
      - name: "bazel coverage //... (lcov)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ARGS=(--output_user_root="$RUNNER_TEMP"/bazel-outputs)
          if [ -n "$BAZEL_REMOTE_EXECUTOR" ]; then RCEXEC=(--config=remote-exec); else RCEXEC=(); fi
          bazel "${ARGS[@]}" coverage //... \
            "${RCEXEC[@]}" --combined_report=lcov \
            --test_output=errors --keep_going --test_timeout=600

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('bazel-out/_coverage/_coverage_report.dat') != ''
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          flags: bazel-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Last, after every bazel run: provisioning installs the worker toolset,
      # Go and dolt on this runner, which must not change what the client's
      # own actions see. The PR's own blacksmith-worker.sh and manifest, on the
      # Blacksmith image the pool runs: a manifest no worker would measure
      # can't merge.
      - name: Measure this Blacksmith host against the worker-env manifest
        if: always() && steps.worker-env.outputs.measure == 'true'
        env:
          WORKER_MODE: measure
        run: tools/rbe/blacksmith-worker.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-testlogs
          path: |
            bazel-testlogs/**/test.log
          retention-days: 7

  sync-check:
    name: BUILD files in sync
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # History for the merge below (blobless: commits and trees only).
          fetch-depth: 0
          filter: blob:none
      # The same fresh merge as the bazel job: the sync check runs on the
      # PR head merged onto main's current tip (pull_request only).
      - name: Merge the PR head onto the base branch's current tip
        id: fresh-merge
        uses: ./.github/actions/fresh-merge
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Install bazel via bazelisk
        run: |
          curl -sSfL -o /tmp/bazelisk             https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazel
          sudo chmod 755 /home/ubuntu 2>/dev/null || true
          sudo mkdir -p /home/ubuntu/.cache && sudo chown "$(id -u):$(id -g)" /home/ubuntu/.cache
      - name: BUILD files are in sync (gazelle + repo tree)
        run: |
          make bazel-sync
          git diff --exit-code || {
            echo "BUILD files out of sync; run 'make bazel-sync' and commit the result." >&2
            git diff | head -80 >&2
            exit 1
          }
