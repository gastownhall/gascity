# Multi-lane Bazel CI (rbe-west plan W1). Target shape: every gascity build,
# test, lint and codegen check is a Bazel target; each lane below is a thin
# client (4-8 vCPU) that checks out, merges the PR head
# onto the run's base commit (.github/actions/fresh-merge), attaches rbe-west
# with .github/actions/setup-bazel (a byte copy of beads' composite: modes
# remote, fork-ro, fork-rw, cache, local) and runs one bazel command with
# --config=ci. The rbe job decides the mode once per run; for fork and
# Dependabot PRs rbe-west's mint decides.
#
# The only Bazel workflow: its gate job carries the required check "bazel
# test (side-by-side)" and its sync job "BUILD files in sync" (the main
# ruleset and branch protection name both; no other job anywhere may,
# scripts/bazel_multilane_test.go). So:
#   - every key-affecting flag is committed unconditionally in .bazelrc, and
#     --config=ci, setup-bazel's rc and the lane's .bazelrc.local carry
#     transport and result policy only (scripts/bazel_key_parity_test.go), so
#     these lanes and pre-push hash actions alike and the second run of a
#     commit is mostly cache hits;
#   - lanes reuse cached test results (the farm action cache is writable
#     only by trusted runs, so a cached PASS for hermetic, identical inputs
#     is valid); push to main fresh re-execution to sample flakiness is a
#     follow-up, not part of this change;
#   - the rbe job's lane list (event and mode) decides which lanes start;
#     every mode starts unit and acceptance, so the gate never passes a run
#     that tested nothing (an empty lane list fails it);
#   - integration-packages runs every package's `//go:build integration`
#     tests and GC_FAST_UNIT=0 process tests outside //test/integration
#     (//test:integration_packages, tools/bazel/integration_suite.py) and
#     gates, in every mode (fork PRs included: no network needed);
#   - integration-smoke runs //test/integration's bdstore and REST smoke
#     tests (scripts/test-integration-shard's bdstore_tests and
#     rest_smoke_tests; .bazelrc test:integration-smoke) and gates, in
#     every mode: they
#     never failed in 33 main runs of the full suite, which is still flaky;
#   - integration runs on the nightly schedule and dispatches only,
#     evidence-only, until G3 (bazel-nightly.yml; off every push since
#     rbe-ci-cost-latency-study.md recommendation 5: evidence-only, so its
#     wall time on every push bought nothing);
#   - fork and Dependabot PRs ask rbe-west's mint (mode fork-ro/fork-rw);
#     closed, refused or unreachable, the run takes mode cache: lanes execute
#     on the runner with lookups in the anonymous read-only cache. A lane
#     whose certificate the mint then refuses falls back to that cache too;
#   - with rbe-west off (vars.RBE_WEST_WORKERS) runs take mode cache as well;
#   - a fork run mints at most 4 rbe-fork certificates, one per lane:
#     unit, acceptance, integration-packages and integration-smoke, in
#     fork-ro and fork-rw alike (the mint allows 12 per run and 160 per PR a
#     day, so a run and two re-runs stay inside both);
#   - coverage (nightly schedule or dispatch, remote) uploads lcov to
#     Codecov (flag bazel-unit) and as an artifact; also off every push
#     since recommendation 5, same reasoning as integration above;
#   - bep-summary reports cached vs executed test targets per lane from the
#     lanes' BEP files and gates nothing; it also runs the shard-balance
#     budget (recommendation 4) over the same BEP files, warning-only.
name: bazel

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue (dormant until the main ruleset enables one; TESTING.md
  # "Merge queue"): both required checks of this workflow must report on
  # every queue entry's merge-group commit. A merge group is same-repo
  # trust (only people who can merge can queue), so the rbe job takes mode
  # remote; the queue ref is already the merge, so fresh-merge and the base
  # step skip it, and the OpenAPI gate diffs against merge_group.base_sha.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rbe:
        description: "on: remote execution; cache: fork simulation (anonymous read-only cache); off: local only"
        type: choice
        default: "on"
        options: ["on", "cache", "off"]
      fresh-test-results:
        description: "Re-execute every lane's tests (--config=fresh: no cached test results), as the nightly run does"
        type: boolean
        default: false
  workflow_call:
    inputs:
      rbe:
        type: string
        required: false
        default: "on"
      fresh-test-results:
        type: boolean
        required: false
        default: false
    secrets:
      RBE_WEST_EXECUTOR:
        required: false
      RBE_TLS_CERT:
        required: false
      RBE_TLS_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

# A PR's runs share one group and a newer one cancels the older. A merge
# group keys on its own queue ref (refs/heads/gh-readonly-queue/main/pr-N-
# <base sha>, unique per entry and base) and is never cancelled: cancelling
# a queue run fails the entry's required checks and ejects it, and a PR's
# own runs (keyed on its number) never share a queue entry's group. Every
# other event (push to main, dispatch, call) gets its own group (the run
# id), so it is never cancelled or queued behind another run: main runs save
# the runner cache and report coverage. (A shared group without
# cancel-in-progress would still replace a pending run with the next one.)
# The prefix is a literal: under workflow_call github.workflow is the
# caller's name, and the group would collide with the caller's own.
concurrency:
  group: bazel-yml-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rbe:
    name: execution mode
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # dispatch rbe-worker-pool.yml (pre-warm)
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      enabled: ${{ steps.decide.outputs.enabled }}
      tier: ${{ steps.decide.outputs.tier }}
      lanes: ${{ steps.lanes.outputs.lanes }}
      base-sha: ${{ steps.base.outputs.base-sha }}
      rrc: ${{ steps.rrc.outputs.rrc }}
    steps:
      # merge_group: PULL_REQUEST and FORK are false (no
      # github.event.pull_request on that event), so a queue run takes the
      # same-repo path, mode remote (scripts/ci_merge_queue_test.go).
      - name: Decide remote execution
        id: decide
        env:
          RBE_VAR_ON: ${{ vars.RBE_WEST_WORKERS == 'true' }}
          RBE_INPUT_OFF: ${{ inputs.rbe == 'off' }}
          RBE_INPUT_CACHE: ${{ inputs.rbe == 'cache' }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          HAS_EXECUTOR: ${{ secrets.RBE_WEST_EXECUTOR != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for v in RBE_VAR_ON RBE_INPUT_OFF RBE_INPUT_CACHE PULL_REQUEST FORK DEPENDABOT HAS_EXECUTOR; do
            case "${!v}" in true|false) ;; *) echo "::error::$v is '${!v}'"; exit 1 ;; esac
          done
          tier=
          if [ "$RBE_INPUT_OFF" = true ]; then
            mode=local
          elif [ "$RBE_INPUT_CACHE" = true ]; then
            mode=cache
          elif [ "$PULL_REQUEST" = true ] && { [ "$FORK" = true ] || [ "$DEPENDABOT" = true ]; }; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::PR number '$PR_NUMBER'"; exit 1; }
            url="https://rbe-mint.ops.gascity.com:8444/v1/status?repo=${GITHUB_REPOSITORY#*/}&run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT&pr=$PR_NUMBER"
            st=$(curl -sS --connect-timeout 5 --max-time 30 --retry 3 --retry-all-errors "$url" || echo '{}')
            tier=$(jq -r 'if .open == true then .tier else "" end' <<<"$st" 2>/dev/null || true)
            case "$tier" in
              ro|rw) mode="fork-$tier" ;;
              *) tier=; mode=cache
                 echo "::warning title=rbe-fork closed for this run::$(jq -r '.reason // .error // "unreachable"' <<<"$st" 2>/dev/null || echo unreachable)" ;;
            esac
          elif [ "$RBE_VAR_ON" != true ]; then
            # rbe-west off: no remote execution, but the run still tests
            # (locally, with the read-only cache's hits).
            mode=cache
          elif [ "$HAS_EXECUTOR" = true ]; then
            mode=remote
          else
            mode=cache
          fi
          enabled=false
          case "$mode" in remote|fork-ro|fork-rw) enabled=true ;; esac
          { echo "mode=$mode"; echo "enabled=$enabled"; echo "tier=$tier"; } >> "$GITHUB_OUTPUT"
          echo "Bazel execution mode: **$mode**" >> "$GITHUB_STEP_SUMMARY"

      # Bazel's remote repo contents cache on rbe-west (ga-vnycm2.25,
      # engdocs/design/bazel-remote-repo-contents-cache.md): extracted
      # external repositories (go_deps, npm, debs) come from rbe-west's
      # action cache instead of being re-fetched by every cold lane client.
      # vars.RBE_REPO_CONTENTS_CACHE rolls it out after rbe-west's writer
      # path (rrc-gate, the rbe-rrc-writer certificate) is deployed:
      #   unset/off  nothing (the default: merging this changes no run);
      #   seed       main pushes seed the cache (rrc-seed); no lane reads it;
      #   canary     seed, and the unit lane reads;
      #   on         seed, and every lane reads.
      # Mode remote only: fork pull_request runs see no vars (fork-cache
      # lanes read through their own probe-gated step, "Fork cache remote
      # repo contents cache (read)"). Any other value is off, with a
      # warning, so a typo never fails the required gate.
      - name: Remote repo contents cache
        id: rrc
        env:
          RRC: ${{ vars.RBE_REPO_CONTENTS_CACHE }}
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          rrc=off
          case "$RRC" in
            "" | off) ;;
            seed | canary | on)
              if [ "$MODE" = remote ]; then rrc=$RRC; fi ;;
            *) echo "::warning title=RBE_REPO_CONTENTS_CACHE::unknown value '$RRC' (want off, seed, canary or on); treated as off" ;;
          esac
          echo "rrc=$rrc" >> "$GITHUB_OUTPUT"
          echo "Remote repo contents cache: **$rrc**" >> "$GITHUB_STEP_SUMMARY"

      # The lane job's matrix, as JSON: a lane left out never starts a runner
      # (nor mints an rbe-fork certificate, so a fork run mints at most 4).
      # A matrix's exclude cannot do this: GitHub applies include after
      # exclude, and an include entry keyed on the lane adds it back.
      - name: Lanes
        id: lanes
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.decide.outputs.mode }}
          FRESH: ${{ inputs.fresh-test-results }}
        run: |
          set -euo pipefail
          case "$MODE" in remote|fork-ro|fork-rw|cache|local) ;; *) echo "::error::mode '$MODE'"; exit 1 ;; esac
          # The nightly fresh-test-results run (bazel-nightly.yml) appends
          # --config=fresh (.bazelrc: --nocache_test_results) to every
          # lane's cmd: worker-env (tools/rbe/worker-env) keys git and yq
          # at major version only, so a minor upgrade on the rbe-west
          # workers moves no action key, and a regression it causes can
          # hide behind every push's cached PASS forever otherwise
          # (2026-10-07 worker-env outage review). FRESH is empty outside
          # workflow_dispatch/workflow_call, which never ask for it.
          # Built as a suffix rather than substituted into each lane's JSON:
          # bash 3.2 (macOS's /bin/bash, which scripts/bazel_multilane_test.go
          # runs this step with) keeps the backslash of an escaped brace in a
          # ${var/pat/rep} replacement.
          fresh=""
          realtime=""
          if [ "$FRESH" = "true" ]; then
            fresh=" --config=fresh"
            # Plus the timer-bound acceptance tests at their real timers
            # (test/acceptance/BUILD.bazel REALTIME_TESTS): PR and push runs
            # shorten their quiescence window and idle timeout.
            realtime=" //test/acceptance:acceptance_realtime_tests"
          fi
          unit='{"lane":"unit","cmd":"test --config=ci --keep_going //...'"$fresh"'"}'
          acceptance='{"lane":"acceptance","cmd":"test --config=ci --config=acceptance --keep_going //test/acceptance:acceptance_test //test/acceptance:acceptance_solo_tests'"$realtime$fresh"'"}'
          # Evidence-only until G3: agent-flow tests depend on ambient
          # agent-template resolution (product-side fix, D13).
          integration='{"lane":"integration","cmd":"test --config=ci --config=integration --keep_going //test/integration:integration_test'"$fresh"'","evidence-only":true}'
          # Gating. Every package's integration-tagged and GC_FAST_UNIT=0
          # tests outside //test/integration (scripts/test-integration-shard's
          # packages-* shards).
          packages='{"lane":"integration-packages","cmd":"test --config=ci --config=integration --keep_going //test:integration_packages'"$fresh"'"}'
          # Gating. The integration suite's bdstore and REST smoke tests
          # (scripts/test-integration-shard bdstore_tests + rest_smoke_tests:
          # .bazelrc test:integration-smoke's --test_filter).
          smoke='{"lane":"integration-smoke","cmd":"test --config=ci --config=integration-smoke --keep_going //test/integration:integration_test'"$fresh"'"}'
          # Every mode tests: the gate (the required check) fails a run that
          # started no lane. Acceptance and integration-packages run on the
          # fork pool too (mode fork-ro, instance oss-fork, loopback only):
          # `gc init` no longer clones gascity-packs (#7005), and no
          # integration_packages target needs the network.
          lanes="$unit,$acceptance,$packages,$smoke"
          # Dispatches and the nightly schedule only (rbe-ci-cost-latency-
          # study.md recommendation 5): evidence-only until G3, so paying its
          # wall time on every push to main bought nothing; bazel-nightly.yml
          # calls this workflow on a schedule (github.event_name is then
          # "schedule", inherited from the calling run) and workflow_dispatch
          # dispatches it directly too. When integration becomes required,
          # gate it in a merge queue instead of moving it back onto push
          # (follow-up, not built here).
          case "$EVENT" in workflow_dispatch|schedule) lanes+=",$integration" ;; esac
          echo "lanes=[$lanes]" >> "$GITHUB_OUTPUT"

      - name: Resolve the base branch commit (fresh-merge)
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}"
          ref="refs/heads/${BASE_REF}"
          # Three attempts, 5 s then 10 s apart.
          for delay in 5 10 0; do
            if heads="$(git ls-remote --heads "$url" "$ref")"; then
              break
            fi
            [ "$delay" -gt 0 ] || { echo "::error::git ls-remote $url failed 3 times"; exit 1; }
            sleep "$delay"
          done
          # ls-remote matches the pattern as a ref name's tail
          # (refs/heads/x/refs/heads/main too): exactly one head named $ref.
          # awk counts the matches itself: no mapfile, which macOS's bash 3.2
          # lacks, and scripts/bazel_multilane_test.go runs this step there.
          sha="$(awk -F '\t' -v ref="$ref" '
            $2 == ref { n++; sha = $1 }
            END {
              if (n != 1) { printf "::error::%d heads named %s\n", n, ref; exit 1 }
              print sha
            }' <<<"$heads")" || { echo "$sha"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve ${BASE_REF}: '${sha}'"; exit 1; }
          echo "base-sha=${sha}" >> "$GITHUB_OUTPUT"

      # Best effort: a worker boots (~30 s) while the lanes check out and
      # analyze. The rbe-west scaler covers anything beyond one worker.
      - name: Pre-warm the OSS worker pool (rbe-west)
        if: steps.decide.outputs.mode == 'remote'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rbe-worker-pool.yml --limit 50 \
            --json status --jq '[.[] | select(.status != "completed")] | length' || echo 0)
          if [ "${active:-0}" -eq 0 ]; then
            gh workflow run rbe-worker-pool.yml -R "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              && echo "dispatched a pool worker" || echo "::warning::pool dispatch failed; relying on the rbe-west scaler"
          else
            echo "${active} pool worker(s) already up"
          fi

  lane:
    name: bazel / ${{ matrix.lane }}
    needs: rbe
    # Every mode yields lanes; should the list ever be empty, an empty
    # matrix is an error, so the job is skipped instead and the gate fails.
    if: needs.rbe.outputs.lanes != '[]'
    # Unit and acceptance get 8 vCPU, every other lane 4. Local modes (cache,
    # local) execute here, and so may fork-ro/fork-rw (a refused certificate
    # falls back to the read-only cache). In mode remote the runner is only a
    # Bazel client, but its loading and analysis (go_deps fetches, gazelle,
    # npm, Starlark) is CPU-bound and gates every action: analysis-only
    # measurements per lane (ga-vnycm2.8, seeded runner cache) took 34-58 s
    # on 2 vCPU, 23-34 s on 4 and 15-19 s on 8. Unit and acceptance are the
    # critical lanes (ga-vnycm2.12).
    runs-on: ${{ (matrix.lane == 'unit' || matrix.lane == 'acceptance') && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read # worker-env drift issues (tools/rbe/worker-env-drift)
    strategy:
      fail-fast: false
      # Entries {lane, cmd, evidence-only?} from the rbe job's Lanes step.
      matrix:
        include: ${{ fromJSON(needs.rbe.outputs.lanes) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/fresh-merge
        with:
          base-sha: ${{ needs.rbe.outputs.base-sha }}

      # worker-env (tools/rbe/worker-env-drift): rbe-west's schedulers match
      # the worker-env pin exactly, and pool workers serve the default
      # branch's pin only. A change that moves the pin can't run remotely
      # before it merges: the bazel run is skipped (pin-moved) and the
      # worker-host job measures this Blacksmith host against the new
      # manifest instead, as it does for any change to the worker host
      # (measure). A remote run on a pin with an open drift issue fails here
      # rather than queueing for an hour (and before setup-bazel mints an
      # rbe-fork certificate).
      - name: worker-env preflight
        id: worker-env
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ needs.rbe.outputs.mode }}
        run: |
          # Remote exactly when setup-bazel enables remote execution.
          case "$MODE" in remote|fork-ro|fork-rw) export WORKER_ENV_REMOTE=true ;; esac
          git fetch --no-tags --filter=blob:none origin "refs/heads/$DEFAULT_BRANCH"
          git show FETCH_HEAD:platforms/BUILD.bazel >"$RUNNER_TEMP/worker-env-base.bazel" 2>/dev/null ||
            : >"$RUNNER_TEMP/worker-env-base.bazel"
          git diff --name-only FETCH_HEAD HEAD >"$RUNNER_TEMP/worker-env-changed"
          tools/rbe/worker-env-drift preflight "$RUNNER_TEMP/worker-env-base.bazel" "$RUNNER_TEMP/worker-env-changed"

      # Modes fork-ro/fork-rw: the mint said open when the rbe job asked, but
      # it may still refuse this lane's certificate (closed since, a quota, a
      # changed tier). That must neither fail the required gate with no
      # remedy nor leave the PR untested, so the lane falls back to mode
      # cache (the read-only fork cache, executing here) as the rbe job would
      # have chosen with the mint closed.
      - name: Set up Bazel
        id: bazel
        if: steps.worker-env.outputs.pin-moved != 'true'
        continue-on-error: ${{ startsWith(needs.rbe.outputs.mode, 'fork-') }}
        uses: ./.github/actions/setup-bazel
        env:
          BAZEL_REMOTE_EXECUTOR: ${{ needs.rbe.outputs.mode == 'remote' && secrets.RBE_WEST_EXECUTOR || '' }}
          RBE_TLS_CERT: ${{ needs.rbe.outputs.mode == 'remote' && secrets.RBE_TLS_CERT || '' }}
          RBE_TLS_KEY: ${{ needs.rbe.outputs.mode == 'remote' && secrets.RBE_TLS_KEY || '' }}
          RBE_INSTANCE: ${{ needs.rbe.outputs.mode == 'remote' && 'oss' || '' }}
          BAZEL_FORK_CACHE: ${{ needs.rbe.outputs.mode == 'cache' && 'true' || '' }}
          BAZEL_FORK_REMOTE: ${{ startsWith(needs.rbe.outputs.mode, 'fork-') && 'true' || '' }}
          RBE_FORK_TIER: ${{ needs.rbe.outputs.tier }}
          RBE_FORK_PR: ${{ github.event.pull_request.number }}
      - name: rbe-fork refused this lane
        if: steps.bazel.outcome == 'failure' && startsWith(needs.rbe.outputs.mode, 'fork-')
        env:
          MODE: ${{ needs.rbe.outputs.mode }}
        run: |
          echo "::warning title=rbe-fork refused this lane::mode $MODE got no certificate; this lane runs here on the read-only fork cache instead"
          echo "bazel: mode $MODE got no rbe-fork certificate; read-only fork cache instead" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Bazel (read-only fork cache)
        id: bazel-fallback
        if: steps.bazel.outcome == 'failure' && startsWith(needs.rbe.outputs.mode, 'fork-')
        uses: ./.github/actions/setup-bazel
        env:
          BAZEL_FORK_CACHE: "true"
      # After the last setup-bazel (its runner cache restore), before any
      # bazel command.
      - name: Restore the LLVM archive
        id: llvm
        uses: ./.github/actions/llvm-archive-cache

      # Lanes that execute here (modes cache and local, and a fork lane that
      # fell back to the read-only cache) run tests with .bazelrc's pinned
      # test PATH, so give them the Go the remote workers have at
      # /usr/local/go.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: needs.rbe.outputs.mode == 'cache' || needs.rbe.outputs.mode == 'local' || steps.bazel-fallback.outcome == 'success'
        with:
          go-version-file: go.mod
          cache: false
      - name: Provide /usr/local/go for locally run tests
        if: needs.rbe.outputs.mode == 'cache' || needs.rbe.outputs.mode == 'local' || steps.bazel-fallback.outcome == 'success'
        run: |
          if [ ! -e /usr/local/go ]; then
            sudo ln -s "$(go env GOROOT)" /usr/local/go
          elif [ ! -x /usr/local/go/bin/go ]; then
            echo "::warning::/usr/local/go exists without bin/go; tests that exec go may fail"
          fi

      # Integration tests drive tmux, lsof and ssh from the host, as
      # on the remote workers (tools/rbe/worker-env pins their versions).
      # Where this lane executes here instead, install them, or those tests
      # would skip ("tmux not installed") rather than run.
      - name: Host tools for locally run integration tests
        if: (matrix.lane == 'integration-packages' || matrix.lane == 'integration-smoke') && (needs.rbe.outputs.mode == 'cache' || needs.rbe.outputs.mode == 'local' || steps.bazel-fallback.outcome == 'success')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux lsof openssh-client

      # The remote repo contents cache, read-only (the rbe job's rrc output:
      # canary, the unit lane; on, every lane). Each cached repository costs
      # several sequential round trips and ~3700 of them resolve through
      # Skyframe's loading threads (default: the CPU count), so without 64 of
      # them a cached read is slower than fetching. Both lines are key
      # neutral (scripts/bazel_key_parity_test.go). Reading only: the lane
      # keeps setup-bazel's --noremote_upload_local_results, so nothing here
      # writes; rrc-seed writes, on push to main.
      - name: Remote repo contents cache (read)
        if: needs.rbe.outputs.mode == 'remote' && (needs.rbe.outputs.rrc == 'on' || (needs.rbe.outputs.rrc == 'canary' && matrix.lane == 'unit'))
        run: |
          {
            echo 'startup --experimental_remote_repo_contents_cache'
            echo 'common --loading_phase_threads=64'
          } >> .bazelrc.local

      # zstd transfers with the anonymous read-only cache (rbe-cache, :8443),
      # only while it advertises zstd: cache-zstd-probe.sh asks its
      # GetCapabilities, and any failure means no flag (never a failed step).
      # A probe, not a repository variable: fork pull_request runs see no
      # vars. Never for remote execution: rbe-west's trusted schedulers and
      # the fork edge advertise no compressor, and Bazel then refuses the
      # remote. Transport only (the line's config is fork-cache, which only
      # setup-bazel's rc selects), so action keys are unchanged. .bazelrc
      # try-imports the gitignored .bazelrc.local.
      - name: Fork cache zstd transfers
        if: needs.rbe.outputs.mode == 'cache' || steps.bazel-fallback.outcome == 'success'
        run: |
          if bash tools/rbe/cache-zstd-probe.sh; then
            echo 'build:fork-cache --remote_cache_compression' >> .bazelrc.local
          fi

      # The remote repo contents cache, read-only, for the lanes that use
      # fork-cache (engdocs/design/bazel-remote-repo-contents-cache.md):
      # external repositories come from the trees rrc-seed wrote on main
      # pushes, served by rbe-cache's anonymous AC and CAS reads, instead of
      # every fork lane re-running ~600 repository rules. The same two lines
      # as the trusted reader above, key neutral
      # (scripts/bazel_key_parity_test.go); fork-cache uploads nothing, and
      # rbe-cache refuses every write. Only while cache-rrc-probe.sh gets an
      # answer from rbe-cache and its committed kill switch (fork_rrc_read)
      # is on: with the startup flag set and the cache unreachable, Bazel
      # retries every repository against it before fetching it (R6), so a
      # closed or down rbe-cache writes no lines here.
      - name: Fork cache remote repo contents cache (read)
        if: needs.rbe.outputs.mode == 'cache' || steps.bazel-fallback.outcome == 'success'
        run: |
          if why=$(bash tools/rbe/cache-rrc-probe.sh 2>&1); then
            {
              echo 'startup --experimental_remote_repo_contents_cache'
              echo 'common --loading_phase_threads=64'
            } >> .bazelrc.local
            echo "$why"
          else
            echo "::notice title=No remote repo contents cache::$why"
          fi

      - name: Create Bazel test tmpdir
        run: |
          # .bazelrc sets test --test_tmpdir=/tmp/bt and
          # --sandbox_writable_path=/tmp/bt unconditionally (#6525); nothing
          # else creates it on the runner, and every sandboxed action fails
          # without it.
          mkdir -p /tmp/bt

      # The OpenAPI breaking-change gate (//cmd/openapi-breaking:
      # openapi-breaking_test, in the unit lane's //...) compares the tested
      # tree's internal/api/openapi.json with the spec of the commit the PR
      # is merged onto (fresh-merge's base-sha; for a merge group, the commit
      # the entry is queued onto, merge_group.base_sha: main or the entry
      # ahead of it, an ancestor of this fetch-depth 0 checkout).
      # @openapi_base_spec (tools/bazel/rules/openapi_base_spec.bzl) reads
      # the file this names from the client environment: no Bazel flag, so no
      # other action key changes. Other events have no base; the spec
      # compares with itself.
      - name: OpenAPI breaking-change base spec
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.lane == 'unit'
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || needs.rbe.outputs.base-sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base-sha is '$BASE_SHA'"; exit 1; }
          spec="$RUNNER_TEMP/openapi-base.json"
          git show "$BASE_SHA:internal/api/openapi.json" > "$spec"
          echo "GC_OPENAPI_BREAKING_BASE_SPEC=$spec" >> "$GITHUB_ENV"
          echo "OpenAPI breaking-change base: \`$BASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # --profile, --build_event_json_file, --execution_log_compact_file and
      # --experimental_build_event_upload_strategy are command options, so
      # they go after the command (CMD's first word), never in a startup
      # position. upload_strategy=local keeps the profile and exec log (the
      # BEP's local_file/uri fields) out of the farm CAS: both hold argv/env
      # values the ci-analytics extractor reads and redacts, never the farm.
      - name: bazel ${{ matrix.cmd }}
        id: test
        if: steps.worker-env.outputs.pin-moved != 'true'
        env:
          CMD: ${{ matrix.cmd }}
          MODE: ${{ needs.rbe.outputs.mode }}
          LANE: ${{ matrix.lane }}
          EVIDENCE_ONLY: ${{ matrix.evidence-only == true }}
        run: |
          set -o pipefail
          read -r -a args <<<"$CMD"
          rc=0
          start=$(date +%s)
          bazel "${args[@]}" \
            --profile="$RUNNER_TEMP/bazel-profile.json" \
            --build_event_json_file="$RUNNER_TEMP/bazel-bep.json" \
            --execution_log_compact_file="$RUNNER_TEMP/bazel-exec.log.zst" \
            --experimental_build_event_upload_strategy=local || rc=$?
          echo "bazel / $LANE: exit $rc, $(( $(date +%s) - start ))s wall, mode $MODE" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] && [ "$EVIDENCE_ONLY" = true ]; then
            echo "::warning title=$LANE is evidence-only::bazel exited $rc; not gating until G3"
            exit 0
          fi
          exit "$rc"

      # R4: the client heap (setup-bazel sets -Xmx4g). Two weeks of these
      # numbers size any lane that needs a 4 vCPU (16 GB) runner instead; a
      # peak above 3.5 GB warns (the lane is near an OOM).
      - name: Bazel client heap
        if: always() && (steps.bazel.outcome == 'success' || steps.bazel-fallback.outcome == 'success')
        env:
          LANE: ${{ matrix.lane }}
        run: |
          info=$(bazel info peak-heap-size used-heap-size-after-gc max-heap-size 2>/dev/null || true)
          echo "bazel / $LANE heap: $(tr '\n' ' ' <<<"${info:-unavailable}")" | tee -a "$GITHUB_STEP_SUMMARY"
          peak=$(sed -n 's/^peak-heap-size: \([0-9][0-9]*\)MB$/\1/p' <<<"$info")
          if [ -n "$peak" ] && [ "$peak" -gt 3584 ]; then
            echo "::warning title=bazel / $LANE client heap near its limit::peak heap ${peak}MB, above 3.5 GB of the 4 GB -Xmx4g (R4)"
          fi

      - name: Critical-path report
        if: always() && steps.test.outcome != 'skipped' && hashFiles('tools/bazel/critpath.py') != ''
        run: |
          [ -f "$RUNNER_TEMP/bazel-profile.json" ] || exit 0
          python3 tools/bazel/critpath.py "$RUNNER_TEMP/bazel-profile.json" --tier T2 --budget 150 || true

      # CI analytics (rbe-ci-bep-analytics-design.md): a whitelisted summary of this lane's
      # Bazel invocation for the internal-services collector. Only numbers, enums, mnemonics and
      # validated labels leave the runner; the raw BEP, execution log and profile never do.
      # Reporting only: continue-on-error, and no job needs it.
      - name: CI analytics summary
        id: ci-analytics
        if: "!cancelled() && steps.test.outcome != 'skipped'"
        continue-on-error: true
        timeout-minutes: 3
        env:
          LANE: ${{ matrix.lane }}
          MODE: ${{ steps.bazel-fallback.outcome == 'success' && 'cache' || needs.rbe.outputs.mode }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
          PR_HINT: ${{ github.event.pull_request.number || 0 }}
        run: |
          [ -f "$RUNNER_TEMP/bazel-bep.json" ] || exit 0
          zstd --version || echo "::warning::zstd missing: no per-mnemonic data in this lane's summary"
          python3 tools/bazel/ci_analytics_extract.py \
            --lane "$LANE" --mode "$MODE" --check-run-id "$CHECK_RUN_ID" --pr-hint "$PR_HINT" \
            --invocation test "$RUNNER_TEMP/bazel-bep.json" "$RUNNER_TEMP/bazel-exec.log.zst" "$RUNNER_TEMP/bazel-profile.json" \
            --out "$RUNNER_TEMP/ci-analytics/ci-analytics.json"
      - name: Upload CI analytics summary
        if: "!cancelled() && steps.ci-analytics.outcome == 'success'"
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-analytics-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-analytics/ci-analytics.json
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      # The bep-summary job reports every lane's BEP file in one table. The
      # raw file holds the expanded command line (--remote_executor, the
      # client key path) and bytestream:// URIs naming the remote cache, and
      # artifacts of this public repo are world-readable: only the fields
      # bepsummary reads (internal/testpolicy/bepsummary/redact.jq) are
      # uploaded. The redacted file appears only once jq has succeeded.
      - name: Redact BEP file
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/bazel-bep.json" ] || exit 0
          out="$RUNNER_TEMP/bep-upload/bazel-bep.json"
          mkdir -p "${out%/*}"
          jq -R -c -f internal/testpolicy/bepsummary/redact.jq "$RUNNER_TEMP/bazel-bep.json" > "$out.tmp"
          mv -f "$out.tmp" "$out"

      - name: Upload BEP file
        if: always() && steps.test.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-bep-${{ matrix.lane }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bep-upload/bazel-bep.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload test logs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-${{ matrix.lane }}-testlogs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          retention-days: 7

      # //cmd/genschema:genschema_in_sync_test leaves the exact regeneration
      # patch in its test.outputs when the reference docs are stale; the Docs
      # Autofix workflow (docs-autofix.yml) applies this artifact to the PR.
      - name: Collect generated-docs freshness patch
        if: failure() && steps.test.outcome == 'failure' && matrix.lane == 'unit'
        run: |
          patch=bazel-testlogs/cmd/genschema/genschema_in_sync_test/test.outputs/generated-docs-freshness.patch
          if [ -s "$patch" ]; then cp -f "$patch" generated-docs-freshness.patch; fi
      - name: Upload generated-docs freshness patch
        if: failure() && steps.test.outcome == 'failure' && matrix.lane == 'unit' && hashFiles('generated-docs-freshness.patch') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-docs-freshness-patch
          path: generated-docs-freshness.patch
          retention-days: 7

      # The LLVM archive (~1.9 GB) has a runner cache entry of its own, keyed
      # on its sha256 (.github/actions/llvm-archive-cache), saved under the
      # same conditions as the runner cache below; it is then deleted from the
      # repository cache so the runner cache never stores it.
      # scripts/bazel_output_cache_test.go pins the order.
      - name: Was the LLVM archive fetched
        id: llvm-fetched
        if: always() && steps.llvm.outcome == 'success'
        env:
          LLVM_ARCHIVE_DIR: ${{ steps.llvm.outputs.path }}
        run: |
          fetched=false
          [ -f "$LLVM_ARCHIVE_DIR/file" ] && fetched=true
          echo "fetched=$fetched" >> "$GITHUB_OUTPUT"
      - name: Save LLVM archive cache
        if: always() && matrix.lane == 'unit' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.llvm-fetched.outputs.fetched == 'true' && steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.llvm.outputs.path }}
          key: ${{ steps.llvm.outputs.key }}
      - name: Keep the LLVM archive out of the runner cache
        if: always() && steps.llvm.outcome == 'success'
        env:
          LLVM_ARCHIVE_DIR: ${{ steps.llvm.outputs.path }}
        run: rm -rf -- "$LLVM_ARCHIVE_DIR"

      # Only a push to main that missed the exact key writes the runner cache
      # (--repository_cache only, never the rc or credentials), from one lane.
      - name: Save Bazel runner cache
        if: always() && matrix.lane == 'unit' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bazel.outcome == 'success' && steps.bazel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bazel-ci-cache
          key: bazel-repo-v4-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}

  # The remote repo contents cache's only writer (ga-vnycm2.25). On a push to
  # main, with the rbe job's rrc not off, run every lane's command with
  # --nobuild: loading and analysis only, so only main's repository rules and
  # Starlark run (gazelle, fetch_repo, pnpm-lock parsing, extraction: what
  # every lane already runs on its runner), never a build or test action.
  # Bazel uploads each reproducible repository's tree
  # (--remote_upload_local_results) with a 30-minute rbe-rrc-writer
  # certificate that rbe-west's mint signs only for this workflow on a push
  # to main (.github/scripts/rrc-writer-credential.sh); rbe-west's rrc-gate
  # admits repo-contents entries from it and refuses every other action
  # cache write, and the certificate cannot Execute. Cache only (--remote_cache, no
  # executor). Not in the gate's needs: a failed seed only leaves the lanes
  # fetching. setup-bazel runs in local mode (no secrets): its rc, the
  # runner cache and the pinned Bazel, nothing else.
  rrc-seed:
    name: bazel / repo contents cache seed
    needs: rbe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rbe.outputs.mode == 'remote' && needs.rbe.outputs.rrc != 'off'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the rbe-rrc-writer certificate (GitHub OIDC)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
      - name: Restore the LLVM archive
        uses: ./.github/actions/llvm-archive-cache
      - name: rbe-rrc-writer certificate
        id: writer
        env:
          BAZEL_CI_SECRET_DIR: ${{ runner.temp }}/bazel-ci-secret
        run: bash .github/scripts/rrc-writer-credential.sh
      # Bazel exits 1 after `test --nobuild` even when loading and analysis
      # succeed ("Couldn't start the build. Unable to run tests"); any other
      # ERROR line, or no "Build completed successfully", fails the seed.
      - name: Seed the remote repo contents cache
        if: steps.writer.outputs.cert != ''
        env:
          LANES: ${{ needs.rbe.outputs.lanes }}
          CERT: ${{ steps.writer.outputs.cert }}
          KEY: ${{ steps.writer.outputs.key }}
          ENDPOINT: ${{ steps.writer.outputs.endpoint }}
          INSTANCE: ${{ steps.writer.outputs.instance }}
        run: |
          set -euo pipefail
          jq -r '.[].cmd' <<<"$LANES" >"$RUNNER_TEMP/rrc-seed-cmds"
          [ -s "$RUNNER_TEMP/rrc-seed-cmds" ] || { echo "::error::no lane commands"; exit 1; }
          log="$RUNNER_TEMP/rrc-seed.log"
          while IFS= read -r cmd; do
            read -r -a args <<<"$cmd"
            start=$(date +%s)
            rc=0
            bazel --experimental_remote_repo_contents_cache "${args[@]}" --nobuild \
              --loading_phase_threads=64 \
              --remote_cache="$ENDPOINT" --remote_instance_name="$INSTANCE" \
              --tls_client_certificate="$CERT" --tls_client_key="$KEY" \
              --remote_upload_local_results </dev/null 2>&1 | tee "$log" || rc=$?
            if [ "$rc" -ne 0 ] && grep -q '^INFO: Build completed successfully' "$log" &&
              ! grep '^ERROR:' "$log" | grep -qv "^ERROR: Couldn't start the build. Unable to run tests$"; then
              rc=0
            fi
            echo "rrc-seed: \`$cmd\`: exit $rc, $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || exit "$rc"
          done <"$RUNNER_TEMP/rrc-seed-cmds"
      - name: Remove the writer key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/bazel-ci-secret/rrc-writer.key" "$RUNNER_TEMP/bazel-ci-secret/rrc-writer.crt"

  # Nightly check of the remote repo contents cache (ga-vnycm2.26, design
  # R1/R2). A cached repository tree is trusted by every reader, and nothing
  # on the reader checks it against what its rule produces. So, from
  # bazel-nightly.yml (or a dispatch), fetch every lane's repositories cold
  # (each lane's command with --nobuild and no repo contents cache, Bazel set
  # up exactly as a lane) and compare each repository's tree and marker with
  # the cached entry a lane would read for the same key
  # (tools/bazel/rrc_verify.py, reads only, with the lanes' certificate). A
  # mismatch is a poisoned entry or a rule falsely marked reproducible: the
  # job fails and opens (or comments on) an rrc-verify issue. Nothing to
  # check while RBE_REPO_CONTENTS_CACHE is off.
  rrc-verify:
    name: bazel / repo contents cache verify
    needs: rbe
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.rbe.outputs.mode == 'remote' && needs.rbe.outputs.rrc != 'off'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # the rrc-verify alert issue
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        env:
          BAZEL_REMOTE_EXECUTOR: ${{ secrets.RBE_WEST_EXECUTOR }}
          RBE_TLS_CERT: ${{ secrets.RBE_TLS_CERT }}
          RBE_TLS_KEY: ${{ secrets.RBE_TLS_KEY }}
          RBE_INSTANCE: oss
      - name: Restore the LLVM archive
        uses: ./.github/actions/llvm-archive-cache
      - name: Create Bazel test tmpdir
        run: mkdir -p /tmp/bt
      # The same `test --nobuild` exit handling as rrc-seed.
      - name: Cold fetch (every lane, no repo contents cache)
        env:
          LANES: ${{ needs.rbe.outputs.lanes }}
        run: |
          set -euo pipefail
          jq -r '.[].cmd' <<<"$LANES" >"$RUNNER_TEMP/rrc-verify-cmds"
          [ -s "$RUNNER_TEMP/rrc-verify-cmds" ] || { echo "::error::no lane commands"; exit 1; }
          log="$RUNNER_TEMP/rrc-verify-fetch.log"
          while IFS= read -r cmd; do
            read -r -a args <<<"$cmd"
            rc=0
            bazel "${args[@]}" --nobuild --loading_phase_threads=64 </dev/null 2>&1 | tee "$log" || rc=$?
            if [ "$rc" -ne 0 ] && grep -q '^INFO: Build completed successfully' "$log" &&
              ! grep '^ERROR:' "$log" | grep -qv "^ERROR: Couldn't start the build. Unable to run tests$"; then
              rc=0
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done <"$RUNNER_TEMP/rrc-verify-cmds"
      - name: Compare with the cache
        id: verify
        env:
          ENDPOINT: ${{ secrets.RBE_WEST_EXECUTOR }}
          SECRET_DIR: ${{ runner.temp }}/bazel-ci-secret
        run: |
          set -euo pipefail
          python3 tools/bazel/rrc_verify.py \
            --output-base "$(bazel info output_base)" \
            --endpoint "$ENDPOINT" --instance oss \
            --cert "$SECRET_DIR/client.crt" --key "$SECRET_DIR/client.key" \
            --bazel-version "$(tr -d '[:space:]' < .bazelversion)" \
            --json "$RUNNER_TEMP/rrc-verify.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always() && hashFiles(format('{0}/rrc-verify.json', runner.temp)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rrc-verify-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rrc-verify.json
          retention-days: 30
      - name: Alert (rrc-verify issue)
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="rrc-verify: remote repo contents cache differs from a cold fetch"
          body="The nightly rrc-verify run found cached repository trees that differ from a cold fetch, or could not check them: $RUN_URL (summary and the rrc-verify report artifact).

          A mismatch is a poisoned entry or a repository rule falsely marked reproducible (engdocs/design/bazel-remote-repo-contents-cache.md, R1/R2). Stop readers first: set the repository variable RBE_REPO_CONTENTS_CACHE to off. Then follow gascity/infra nativelink-cas/west/README.md (remote repo contents cache writer, poisoned entries)."
          gh label create rrc-verify -R "$GITHUB_REPOSITORY" --color B60205 \
            --description "Remote repo contents cache verification failures" 2>/dev/null || true
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label rrc-verify --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Again: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label rrc-verify --title "$title" --body "$body"
          fi

  # Cross-phase test skipping, measured: one report over every lane's BEP file
  # (scripts/bazel-bep-summary.go, internal/testpolicy/bepsummary), one phase
  # per lane: cached (local / remote / disk) vs executed (remote / local)
  # test targets, failures, flakes and action-level runner counts. A lane
  # this run did not start, or one that wrote no BEP file, shows as "no BEP
  # file". Reporting only: not in the gate's needs, and a parse failure marks
  # the report step, never the job.
  bep-summary:
    name: bazel / test cache report
    needs: [rbe, lane]
    if: always() && needs.rbe.result == 'success' && needs.rbe.outputs.lanes != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      # Lanes that failed before bazel ran upload nothing; the report shows
      # them as "no BEP file".
      - name: Download lane BEP files
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bazel-bep-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-bep
      - name: Bazel test cache report (BEP)
        continue-on-error: true
        env:
          MODE: ${{ needs.rbe.outputs.mode }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$GITHUB_EVENT_NAME/$GITHUB_REF" in
            pull_request/*) context="pr" ;;
            push/refs/heads/main) context="main" ;;
            *) context="$GITHUB_EVENT_NAME" ;;
          esac
          dir="$RUNNER_TEMP/bazel-bep"
          mkdir -p "$dir"
          go run ./scripts/bazel-bep-summary.go --context "$context/$MODE" --allow-missing \
            --json-out "$dir/summary.json" \
            unit="$dir/bazel-bep-unit-$ATTEMPT/bazel-bep.json" \
            acceptance="$dir/bazel-bep-acceptance-$ATTEMPT/bazel-bep.json" \
            integration-packages="$dir/bazel-bep-integration-packages-$ATTEMPT/bazel-bep.json" \
            integration-smoke="$dir/bazel-bep-integration-smoke-$ATTEMPT/bazel-bep.json" \
            integration="$dir/bazel-bep-integration-$ATTEMPT/bazel-bep.json" >> "$GITHUB_STEP_SUMMARY"
      # rbe-ci-cost-latency-study.md recommendation 4: keeps #7241's
      # acceptance re-shard gain and would have caught a slowest-shard
      # straggler like beads' server-Dolt storage tier (4.3-4.5 min behind
      # in 2 of 8 runs). Warns (::warning) on every lane's BEP file; does
      # not fail the run yet (--fail-on-imbalance, not passed here, switches
      # that on once the budget has run clean for a while).
      - name: Shard balance
        continue-on-error: true
        run: |
          dir="$RUNNER_TEMP/bazel-bep"
          go run ./scripts/shard-budget.go \
            "$dir/bazel-bep-unit-${{ github.run_attempt }}/bazel-bep.json" \
            "$dir/bazel-bep-acceptance-${{ github.run_attempt }}/bazel-bep.json" \
            "$dir/bazel-bep-integration-packages-${{ github.run_attempt }}/bazel-bep.json" \
            "$dir/bazel-bep-integration-smoke-${{ github.run_attempt }}/bazel-bep.json" \
            "$dir/bazel-bep-integration-${{ github.run_attempt }}/bazel-bep.json" \
            --allow-missing >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bazel test cache report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-yml-bep-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-bep/summary.json
          retention-days: 30
          if-no-files-found: warn

  # Nightly schedule or dispatch only (rbe-ci-cost-latency-study.md
  # recommendation 5; bazel-nightly.yml calls this workflow once a day).
  # Reporting only, so it bought nothing paying its 90-minute budget on
  # every push to main; moved off push the same way as the integration lane
  # above. As the go-test arm's coverage (preflight-unit-cover-*):
  # instrumented builds are their own configuration, so this is a separate
  # job, and its first run on a cold cache compiles the world under coverage.
  coverage:
    name: bazel / coverage
    needs: rbe
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.rbe.outputs.mode == 'remote'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read # worker-env drift issues (tools/rbe/worker-env-drift)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      # Remote only: fail on an open drift issue for the default branch's
      # pin rather than queue (the lane job's preflight).
      - name: worker-env preflight
        id: worker-env
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKER_ENV_REMOTE: "true"
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          git show FETCH_HEAD:platforms/BUILD.bazel >"$RUNNER_TEMP/worker-env-base.bazel" 2>/dev/null ||
            : >"$RUNNER_TEMP/worker-env-base.bazel"
          git diff --name-only FETCH_HEAD HEAD >"$RUNNER_TEMP/worker-env-changed"
          tools/rbe/worker-env-drift preflight "$RUNNER_TEMP/worker-env-base.bazel" "$RUNNER_TEMP/worker-env-changed"
      - name: Set up Bazel
        id: bazel
        if: steps.worker-env.outputs.pin-moved != 'true'
        uses: ./.github/actions/setup-bazel
        env:
          BAZEL_REMOTE_EXECUTOR: ${{ secrets.RBE_WEST_EXECUTOR }}
          RBE_TLS_CERT: ${{ secrets.RBE_TLS_CERT }}
          RBE_TLS_KEY: ${{ secrets.RBE_TLS_KEY }}
          RBE_INSTANCE: oss
      - name: Restore the LLVM archive
        uses: ./.github/actions/llvm-archive-cache
      - name: Create Bazel test tmpdir
        run: mkdir -p /tmp/bt
      - name: bazel coverage //... (lcov)
        id: test
        if: steps.worker-env.outputs.pin-moved != 'true'
        run: |
          bazel coverage --config=ci //... --combined_report=lcov \
            --keep_going --test_timeout=600 \
            --profile="$RUNNER_TEMP/bazel-profile.json" \
            --build_event_json_file="$RUNNER_TEMP/bazel-bep.json" \
            --execution_log_compact_file="$RUNNER_TEMP/bazel-exec.log.zst" \
            --experimental_build_event_upload_strategy=local
      - name: Bazel client heap
        if: always() && steps.bazel.outcome == 'success'
        env:
          LANE: coverage
        run: |
          info=$(bazel info peak-heap-size used-heap-size-after-gc max-heap-size 2>/dev/null || true)
          echo "bazel / $LANE heap: $(tr '\n' ' ' <<<"${info:-unavailable}")" | tee -a "$GITHUB_STEP_SUMMARY"
          peak=$(sed -n 's/^peak-heap-size: \([0-9][0-9]*\)MB$/\1/p' <<<"$info")
          if [ -n "$peak" ] && [ "$peak" -gt 3584 ]; then
            echo "::warning title=bazel / $LANE client heap near its limit::peak heap ${peak}MB, above 3.5 GB of the 4 GB -Xmx4g (R4)"
          fi

      # Same redacted summary as the lane job; see its comment there.
      - name: CI analytics summary
        id: ci-analytics
        if: "!cancelled() && steps.test.outcome != 'skipped'"
        continue-on-error: true
        timeout-minutes: 3
        env:
          LANE: coverage
          MODE: remote
          CHECK_RUN_ID: ${{ job.check_run_id }}
          PR_HINT: ${{ github.event.pull_request.number || 0 }}
        run: |
          [ -f "$RUNNER_TEMP/bazel-bep.json" ] || exit 0
          zstd --version || echo "::warning::zstd missing: no per-mnemonic data in this lane's summary"
          python3 tools/bazel/ci_analytics_extract.py \
            --lane "$LANE" --mode "$MODE" --check-run-id "$CHECK_RUN_ID" --pr-hint "$PR_HINT" \
            --invocation test "$RUNNER_TEMP/bazel-bep.json" "$RUNNER_TEMP/bazel-exec.log.zst" "$RUNNER_TEMP/bazel-profile.json" \
            --out "$RUNNER_TEMP/ci-analytics/ci-analytics.json"
      - name: Upload CI analytics summary
        if: "!cancelled() && steps.ci-analytics.outcome == 'success'"
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-analytics-coverage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-analytics/ci-analytics.json
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Upload lcov report
        if: hashFiles('bazel-out/_coverage/_coverage_report.dat') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-coverage-lcov
          path: bazel-out/_coverage/_coverage_report.dat
          retention-days: 7
      # The combined lcov report under its own flag, so Codecov keeps the
      # bazel and go-test signals separable.
      - name: Upload coverage to Codecov
        if: hashFiles('bazel-out/_coverage/_coverage_report.dat') != ''
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          flags: bazel-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # The required check "BUILD files in sync" (main ruleset, branch
  # protection): the one job of that name.
  sync-check:
    name: BUILD files in sync
    needs: rbe
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/fresh-merge
        with:
          base-sha: ${{ needs.rbe.outputs.base-sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      # worker-env: pool workers serve the default branch's pin only, so a
      # change that moves the pin cannot execute remotely before it merges
      # (the lanes' worker-env preflight skips their remote suite for the
      # same reason). Without this, gazelle's actions queue on a pin no worker
      # serves until timeout-minutes cancels the job. A plain pin comparison:
      # no API call, so it costs nothing against the installation rate limit.
      - name: worker-env pin
        id: pin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ needs.rbe.outputs.mode }}
        run: |
          git fetch --no-tags --filter=blob:none origin "refs/heads/$DEFAULT_BRANCH"
          git show FETCH_HEAD:platforms/BUILD.bazel >"$RUNNER_TEMP/worker-env-base.bazel" 2>/dev/null ||
            : >"$RUNNER_TEMP/worker-env-base.bazel"
          pin=$(tools/rbe/worker-env-drift pin)
          base=$(tools/rbe/worker-env-drift pin "$RUNNER_TEMP/worker-env-base.bazel")
          remote=false
          if [ "$MODE" = remote ] && [ "$pin" = "$base" ]; then remote=true; fi
          echo "remote=$remote" >> "$GITHUB_OUTPUT"
          echo "worker-env: this checkout pins $pin, the default branch $base; mode=$MODE remote=$remote"
        shell: bash
      # Same env as the lane job's "Set up Bazel" step: with no env at all
      # this job ran gazelle and GoStdlib locally on every PR (64 sandboxed
      # actions). Mode remote on the default branch's pin gets the executor
      # and the mint certificate; every other case gets the read-only fork
      # cache instead, with no mint certificate, so BUILD files in sync never
      # needs rbe-fork-mint.
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        env:
          BAZEL_REMOTE_EXECUTOR: ${{ steps.pin.outputs.remote == 'true' && secrets.RBE_WEST_EXECUTOR || '' }}
          RBE_TLS_CERT: ${{ steps.pin.outputs.remote == 'true' && secrets.RBE_TLS_CERT || '' }}
          RBE_TLS_KEY: ${{ steps.pin.outputs.remote == 'true' && secrets.RBE_TLS_KEY || '' }}
          RBE_INSTANCE: ${{ steps.pin.outputs.remote == 'true' && 'oss' || '' }}
          BAZEL_FORK_CACHE: ${{ steps.pin.outputs.remote != 'true' && 'true' || '' }}
      - name: Restore the LLVM archive
        uses: ./.github/actions/llvm-archive-cache
      - name: BUILD files are in sync (gazelle + repo tree)
        env:
          BAZEL_SYNC_FLAGS: ${{ steps.pin.outputs.remote == 'true' && '--config=remote-exec' || '--config=fork-cache' }}
        run: |
          make bazel-sync
          git diff --exit-code || {
            echo "BUILD files out of sync; run 'make bazel-sync' and commit the result." >&2
            git diff | head -80 >&2
            exit 1
          }

  # rbe-worker S3a (rbe-worker-repo-design.md §5.4): a secret-free job that
  # measures a PR's effect on the worker host and, once a pin moves, checks
  # that every commit in the bump range is signed (H5). Source is pinned
  # unconditionally here: unlike the pool shims (S3b), this job never runs
  # with farm secrets, so there is no in-tree fallback to cut over from.
  worker-host:
    name: rbe worker host
    needs: rbe
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read # worker-env drift issues (tools/rbe/worker-env-drift)
    outputs:
      measure: ${{ steps.host.outputs.measure }}
      pin-changed: ${{ steps.pins.outputs.pin-changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/fresh-merge
        with:
          base-sha: ${{ needs.rbe.outputs.base-sha }}

      # The base this job diffs against: the merge queue's own base
      # (merge_group.base_sha) or the PR's fresh-merge base-sha when either
      # is known (the same commit the lane job's worker-env preflight diffs
      # against, bazel.yml:444), else the default branch's current tip
      # (push, schedule, workflow_dispatch). Reused below (git fetch leaves
      # FETCH_HEAD, which the next git command can lose): capture its sha
      # once, into base.sha, rather than re-fetching per step.
      - name: Fetch the base commit
        id: default-branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || needs.rbe.outputs.base-sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base-sha is '$BASE_SHA'"; exit 1; }
            git fetch --no-tags --filter=blob:none origin "$BASE_SHA"
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --filter=blob:none origin "refs/heads/$DEFAULT_BRANCH"
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Same preflight the lane job runs (its "worker-env preflight" step):
      # measure=true when this change touches the worker host's inputs, or
      # when the worker-env pin itself moves (the lane then skips the remote
      # suite and measures instead; this job measures regardless of mode).
      - name: Does this change move the worker host?
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.default-branch.outputs.sha }}
        run: |
          git show "$BASE_SHA:platforms/BUILD.bazel" >"$RUNNER_TEMP/worker-env-base.bazel" 2>/dev/null ||
            : >"$RUNNER_TEMP/worker-env-base.bazel"
          git diff --name-only "$BASE_SHA" HEAD >"$RUNNER_TEMP/worker-env-changed"
          tools/rbe/worker-env-drift preflight "$RUNNER_TEMP/worker-env-base.bazel" "$RUNNER_TEMP/worker-env-changed"

      # Independent of the worker-env pin above: did this change move the
      # rbe-worker pin (§5.2)? That is the only thing the H5 range check
      # below gates on.
      - name: Which rbe-worker pins moved?
        id: pins
        env:
          BASE_SHA: ${{ steps.default-branch.outputs.sha }}
        run: |
          set -euo pipefail
          old=$(git show "$BASE_SHA:.github/actions/rbe-worker/pin" 2>/dev/null | grep -E '^[0-9a-f]{40}$' || true)
          new=$(grep -E '^[0-9a-f]{40}$' .github/actions/rbe-worker/pin)
          changed=false
          [ "$old" = "$new" ] || changed=true
          echo "pin-changed=$changed" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "rbe-worker: pin $([ "$changed" = true ] && echo moved || echo unchanged) (default branch $old, this checkout $new)"

      # S3-S5 only: every worker-host run fetches and checks parity, pin
      # moved or not, so the host this job measures (below) is always the
      # host the pool would serve once source flips to pinned, and so H5
      # (below) always has the fetched tree's git history to walk the bump
      # range when the pin did move. No secret reaches this step: the fetch
      # is anonymous and verifies the pin before any checkout
      # (.github/actions/rbe-worker/fetch.sh).
      - name: Fetch the PR's pinned rbe-worker
        id: rbe-worker
        uses: ./.github/actions/rbe-worker
        with:
          source: pinned

      # H5 (D12): every commit between the default branch's pin and this
      # PR's pin must be a verified, signed, web-flow (GitHub merge-button)
      # commit on gastownhall/rbe-worker with a pull request merged into
      # main (.github/actions/rbe-worker/h5.sh). Dormant until a bump PR
      # actually moves the pin.
      - name: Every commit in the bump range is signed, merged and verified (H5)
        if: steps.pins.outputs.pin-changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_REPO_DIR: ${{ steps.rbe-worker.outputs.dir }}
          OLD_SHA: ${{ steps.pins.outputs.old }}
          NEW_SHA: ${{ steps.rbe-worker.outputs.sha }}
        run: .github/actions/rbe-worker/h5.sh "$WORKER_REPO_DIR/.." "$OLD_SHA" "$NEW_SHA"

      # S3-S5 only: this checkout's tools/rbe and the fetched pin must agree,
      # so the host this job measures is the host the pool would serve once
      # source flips to pinned. git ls-tree mode+blob comparison: a rename or
      # mode change shows up the same as content drift. Runs on every
      # worker-host run (S3-S5), not just measure or pin-moved runs.
      - name: In-tree and pinned trees are identical (S3-S5 only)
        env:
          RBE_WORKER_DIR: ${{ steps.rbe-worker.outputs.dir }}
        run: |
          set -euo pipefail
          diff <(git ls-tree -r HEAD tools/rbe | awk -F'\t' '{sub("^tools/rbe/", "", $2)} $2 != "worker-env.txt" && $2 != "cache-zstd-probe.sh" {print $1 "\t" $2}') \
               <(git -C "$RBE_WORKER_DIR/.." ls-tree -r HEAD worker | awk -F'\t' '{sub("^worker/", "", $2); print $1 "\t" $2}') \
            || { echo "::error title=rbe-worker drift::in-tree tools/rbe and the pinned rbe-worker differ; S1/S2 parity broke"; exit 1; }

      # §5.6, run against the PR's pinned rbe-worker once rbe-worker ships
      # cmd/product-check (S2). Until then this step has nothing to run
      # against and is intentionally absent; adding it is part of landing S2.

      - name: Measure this Blacksmith host against the PR's manifest
        if: steps.host.outputs.measure == 'true' || steps.pins.outputs.pin-changed == 'true'
        env:
          WORKER_MODE: measure
          RBE_WORKER_DIR: ${{ steps.rbe-worker.outputs.dir }}
          RBE_WORKER_REVISION: ${{ steps.rbe-worker.outputs.sha }}
        run: '"$RBE_WORKER_DIR/blacksmith-worker.sh"'

  # The required check "bazel test (side-by-side)" (main ruleset, branch
  # protection): the one job of that name. It passes only when the rbe job,
  # every lane, sync-check and worker-host succeeded. A run with an empty
  # lane list tested nothing and fails, whatever the event (no mode yields
  # one; this guards the required name against a future one). Lanes are
  # never "skipped" into a pass: a skipped required check would count as
  # passed.
  gate:
    name: bazel test (side-by-side)
    needs: [rbe, lane, sync-check, worker-host]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ needs.rbe.outputs.mode }}
          LANE_LIST: ${{ needs.rbe.outputs.lanes }}
          RBE: ${{ needs.rbe.result }}
          LANES: ${{ needs.lane.result }}
          SYNC: ${{ needs.sync-check.result }}
          WORKER_HOST: ${{ needs.worker-host.result }}
        run: |
          echo "event=$EVENT mode=$MODE rbe=$RBE lanes=$LANES sync=$SYNC worker-host=$WORKER_HOST"
          [ "$RBE" = success ] || exit 1
          [ "$SYNC" = success ] || exit 1
          [ "$WORKER_HOST" = success ] || exit 1
          if [ -z "$LANE_LIST" ] || [ "$LANE_LIST" = '[]' ]; then
            echo "::error title=bazel ran no lanes::mode $MODE started no lane for this $EVENT run; nothing was tested"
            exit 1
          fi
          [ "$LANES" = success ]
