name: Review Formulas

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for label-dispatched runs
        required: false
        type: string
      head_repo:
        description: Pull request head repository for label-dispatched runs
        required: false
        type: string
      head_sha:
        description: Pull request head SHA for label-dispatched runs
        required: false
        type: string
      head_ref:
        description: Pull request head ref for label-dispatched runs
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: review-formulas-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-policy:
    name: Runner policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      use_blacksmith: ${{ steps.policy.outputs.use_blacksmith }}
      reason: ${{ steps.policy.outputs.reason }}
      runner_2vcpu: ${{ steps.policy.outputs.runner_2vcpu }}
      runner_8vcpu: ${{ steps.policy.outputs.runner_8vcpu }}
      runner_16vcpu: ${{ steps.policy.outputs.runner_16vcpu }}
      runner_32vcpu: ${{ steps.policy.outputs.runner_32vcpu }}
      runner_macos: ${{ steps.policy.outputs.runner_macos }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select runner backend
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 .github/workflows/scripts/runner_policy.py

  gate:
    name: review-formulas routing
    needs: runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_2vcpu }}
    outputs:
      run_shard: ${{ steps.gate.outputs.run_shard }}
      reason: ${{ steps.gate.outputs.reason }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        continue-on-error: true
        with:
          filters: |
            review_formulas:
              - '.github/actions/setup-gascity-ubuntu/**'
              - '.github/actions/go-mod-download/**'
              - '.github/scripts/go-mod-download-retry.sh'
              - '.github/scripts/go-mod-verify-cache.sh'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/review-formulas.yml'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/gc/**'
              - 'examples/bd/**'
              - 'examples/dolt/**'
              - 'examples/gastown/**'
              - 'scripts/test-integration-shard'
              - '.bazelrc'
              - 'test/agents/**'
              - 'test/integration/**'
              - 'test/tmuxtest/**'
              - 'internal/**'
      - name: Decide whether shard should run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PATH_HIT: ${{ steps.filter.outputs.review_formulas }}
          NEEDS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'needs-review-formulas') }}
        run: |
          run_shard=false
          reason="skipped"

          # Review-formulas shards each run for ~10-15 min and exercise
          # full agent workflows end-to-end. Keep them as a pre-merge
          # opt-in (via the `needs-review-formulas` label) plus a
          # post-merge safety net on pushes to main. Path-based opt-in
          # on every Go-touching PR pushes the PR wall-clock past the
          # Blacksmith 5-minute budget.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_shard=true
            reason="manual dispatch"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            run_shard=true
            reason="push to main safety net"
          elif [[ "$PR_DRAFT" != "true" ]]; then
            if [[ "$NEEDS_LABEL" == "true" ]]; then
              run_shard=true
              reason="pull request needs-review-formulas label"
            else
              reason="pull request without needs-review-formulas label (path hit: ${PATH_HIT})"
            fi
          else
            reason="draft pull request"
          fi

          {
            echo "run_shard=$run_shard"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
      - name: Report routing decision
        run: |
          echo "review-formulas shard: ${{ steps.gate.outputs.reason }}"
      # Remote execution on rbe-west only for code this repository trusts
      # (a push, a same-repo PR or a dispatch of a same-repo head) while
      # rbe-west is on; otherwise mode cache.
      - name: Decide Bazel execution mode
        id: mode
        env:
          RBE_VAR_ON: ${{ vars.RBE_WEST_WORKERS == 'true' }}
          HAS_EXECUTOR: ${{ secrets.RBE_WEST_EXECUTOR != '' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DISPATCH_HEAD_REPO: ${{ inputs.head_repo }}
          REPO: ${{ github.repository }}
        run: |
          trusted=false
          case "$EVENT_NAME" in
            push) trusted=true ;;
            pull_request) [ "$PR_HEAD_REPO" = "$REPO" ] && trusted=true ;;
            workflow_dispatch) { [ -z "$DISPATCH_HEAD_REPO" ] || [ "$DISPATCH_HEAD_REPO" = "$REPO" ]; } && trusted=true ;;
          esac
          mode=cache
          if [ "$trusted" = true ] && [ "$RBE_VAR_ON" = true ] && [ "$HAS_EXECUTOR" = true ]; then
            mode=remote
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "review-formulas Bazel mode: $mode (trusted=$trusted)"

  # The six review-formula tests (scripts/test-integration-shard's
  # formula_tests: .bazelrc test:integration-review-formulas) as one Bazel
  # run of //test/integration:integration_test, executing on rbe-west. A
  # trusted run (push, same-repo PR, same-repo dispatch) runs remotely;
  # anything else (a fork head via the label dispatcher, or rbe-west off)
  # executes here with lookups in the anonymous read-only cache, as
  # bazel.yml's mode cache does.
  review-formulas-shard:
    name: Integration / review-formulas (bazel)
    needs:
      - runner-policy
      - gate
    if: needs.gate.outputs.run_shard == 'true'
    runs-on: ${{ needs.gate.outputs.mode == 'remote' && 'blacksmith-2vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read # worker-env drift issues (tools/rbe/worker-env-drift)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ inputs.head_repo || github.repository }}
          ref: ${{ inputs.head_sha || github.sha }}
          persist-credentials: false
      # Remote only: fail on an open drift issue for the default branch's
      # worker-env pin rather than queue; a change that moves the pin can't
      # run remotely before it merges (bazel.yml's lane preflight).
      - name: worker-env preflight
        id: worker-env
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          [ "$MODE" = remote ] && export WORKER_ENV_REMOTE=true
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          git show FETCH_HEAD:platforms/BUILD.bazel >"$RUNNER_TEMP/worker-env-base.bazel" 2>/dev/null ||
            : >"$RUNNER_TEMP/worker-env-base.bazel"
          git diff --name-only FETCH_HEAD HEAD >"$RUNNER_TEMP/worker-env-changed"
          tools/rbe/worker-env-drift preflight "$RUNNER_TEMP/worker-env-base.bazel" "$RUNNER_TEMP/worker-env-changed"
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        env:
          BAZEL_REMOTE_EXECUTOR: ${{ needs.gate.outputs.mode == 'remote' && secrets.RBE_WEST_EXECUTOR || '' }}
          RBE_TLS_CERT: ${{ needs.gate.outputs.mode == 'remote' && secrets.RBE_TLS_CERT || '' }}
          RBE_TLS_KEY: ${{ needs.gate.outputs.mode == 'remote' && secrets.RBE_TLS_KEY || '' }}
          RBE_INSTANCE: ${{ needs.gate.outputs.mode == 'remote' && 'oss' || '' }}
          BAZEL_FORK_CACHE: ${{ needs.gate.outputs.mode != 'remote' && 'true' || '' }}
      - name: Restore the LLVM archive
        uses: ./.github/actions/llvm-archive-cache
      # Mode cache executes the tests here, with .bazelrc's pinned test PATH:
      # the Go the remote workers have at /usr/local/go, and the tmux, lsof
      # and ssh they drive.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: needs.gate.outputs.mode != 'remote'
        with:
          go-version-file: go.mod
          cache: false
      - name: Host tools for locally run tests
        if: needs.gate.outputs.mode != 'remote'
        run: |
          if [ ! -e /usr/local/go ]; then
            sudo ln -s "$(go env GOROOT)" /usr/local/go
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux lsof openssh-client
      - name: Create Bazel test tmpdir
        run: mkdir -p /tmp/bt
      - name: bazel test (review formulas)
        if: steps.worker-env.outputs.pin-moved != 'true'
        run: |
          bazel test --config=ci --config=integration-review-formulas --keep_going \
            //test/integration:integration_test
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-formulas-testlogs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          retention-days: 7

  review-formulas:
    # This synthesized result is the historical branch-protected gate.
    # The old workflow carried `continue-on-error`, but PR checks still
    # treated this name as a failing signal. Keep that effective behavior
    # explicit while the shards run in parallel underneath it.
    name: Integration / review-formulas
    needs:
      - runner-policy
      - gate
      - review-formulas-shard
    if: always()
    runs-on: ${{ needs.runner-policy.outputs.runner_2vcpu }}
    steps:
      - name: Finalize review-formulas result
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          RUN_SHARD: ${{ needs.gate.outputs.run_shard }}
          REASON: ${{ needs.gate.outputs.reason }}
          SHARD_RESULT: ${{ needs.review-formulas-shard.result }}
        run: |
          echo "review-formulas shard: ${REASON}"
          if [[ "${GATE_RESULT}" != "success" ]]; then
            echo "review-formulas routing failed" >&2
            exit 1
          fi
          if [[ "${RUN_SHARD}" != "true" ]]; then
            exit 0
          fi
          if [[ "${SHARD_RESULT}" != "success" ]]; then
            echo "review-formulas subshards failed" >&2
            exit 1
          fi
