name: Container Scan

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - ".trivyignore-config"
      - ".github/requirements/mcp-agent-mail.in"
      - ".github/requirements/mcp-agent-mail.overrides.txt"
      - ".github/requirements/mcp-agent-mail.txt"
      - ".github/scripts/install-*.sh"
      - ".github/scripts/mcp-mail-filelock-exit-regression.py"
      - ".github/scripts/mcp-mail-gitpython-path-cache.py"
      - ".github/scripts/mcp-mail-gitpython-path-cache-test.py"
      - ".github/scripts/mcp-mail-archive-burst.py"
      - ".github/scripts/mcp-mail-archive-burst-ci.py"
      - ".github/scripts/mcp-mail-jwt-compatibility.py"
      - ".github/scripts/patch-mcp-mail-jwt-audience.py"
      - ".github/workflows/container-scan.yml"
      - "contrib/beads-scripts/gc-beads-br"
      - "contrib/events-scripts/gc-events-k8s"
      - "contrib/k8s/**"
      - "contrib/mail-scripts/gc-mail-mcp-agent-mail"
      - "contrib/session-scripts/gc-controller-k8s"
      - "deps.env"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main, 'hotfix/**', 'release/**']
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - ".trivyignore-config"
      - ".github/requirements/mcp-agent-mail.in"
      - ".github/requirements/mcp-agent-mail.overrides.txt"
      - ".github/requirements/mcp-agent-mail.txt"
      - ".github/scripts/install-*.sh"
      - ".github/scripts/mcp-mail-filelock-exit-regression.py"
      - ".github/scripts/mcp-mail-gitpython-path-cache.py"
      - ".github/scripts/mcp-mail-gitpython-path-cache-test.py"
      - ".github/scripts/mcp-mail-archive-burst.py"
      - ".github/scripts/mcp-mail-archive-burst-ci.py"
      - ".github/scripts/mcp-mail-jwt-compatibility.py"
      - ".github/scripts/patch-mcp-mail-jwt-audience.py"
      - ".github/workflows/container-scan.yml"
      - "contrib/beads-scripts/gc-beads-br"
      - "contrib/events-scripts/gc-events-k8s"
      - "contrib/k8s/**"
      - "contrib/mail-scripts/gc-mail-mcp-agent-mail"
      - "contrib/session-scripts/gc-controller-k8s"
      - "deps.env"
      - "go.mod"
      - "go.sum"
  schedule:
    - cron: "43 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: "v0.70.0"

jobs:
  runner-policy:
    name: Runner policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      use_blacksmith: ${{ steps.policy.outputs.use_blacksmith }}
      reason: ${{ steps.policy.outputs.reason }}
      runner_2vcpu: ${{ steps.policy.outputs.runner_2vcpu }}
      runner_8vcpu: ${{ steps.policy.outputs.runner_8vcpu }}
      runner_16vcpu: ${{ steps.policy.outputs.runner_16vcpu }}
      runner_32vcpu: ${{ steps.policy.outputs.runner_32vcpu }}
      runner_macos: ${{ steps.policy.outputs.runner_macos }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select runner backend
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 .github/workflows/scripts/runner_policy.py

  dockerfile-config:
    name: Dockerfile config
    needs: runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_8vcpu }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bin_dir="${RUNNER_TEMP}/gascity-trivy-bin"
          TRIVY_INSTALL_BIN_DIR="$bin_dir" .github/scripts/install-trivy-archive.sh "${TRIVY_VERSION}"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Generate Dockerfile and manifest SARIF
        run: |
          mkdir -p trivy-results
          trivy config \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore-config \
            --format sarif \
            --output trivy-results/dockerfile-config.sarif \
            contrib/k8s

      - name: Upload Dockerfile SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: trivy-results/dockerfile-config.sarif

      - name: Upload Dockerfile scan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-dockerfile-config
          path: trivy-results/dockerfile-config.sarif
          retention-days: 5

      - name: Summarize Dockerfile and manifest findings
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore-config \
            --format table \
            contrib/k8s

      - name: Enforce Dockerfile and manifest policy
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore-config \
            --exit-code 1 \
            --format table \
            contrib/k8s

  image-vulnerabilities:
    name: Image vulnerabilities
    needs: runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_32vcpu }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go modules
        uses: ./.github/actions/go-mod-download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Trivy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bin_dir="${RUNNER_TEMP}/gascity-trivy-bin"
          TRIVY_INSTALL_BIN_DIR="$bin_dir" .github/scripts/install-trivy-archive.sh "${TRIVY_VERSION}"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Prepare image build inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . ./deps.env
          bin_dir="${RUNNER_TEMP}/gascity-container-scan-bin"
          mkdir -p "$bin_dir"
          BD_INSTALL_BIN_DIR="$bin_dir" .github/scripts/install-bd-archive.sh "$BD_VERSION"
          BR_INSTALL_BIN_DIR="$bin_dir" .github/scripts/install-br-archive.sh "$BR_VERSION"
          CGO_ENABLED=0 go build -o gc ./cmd/gc
          cp -f "$bin_dir/bd" bd
          cp -f "$bin_dir/br" br

      - name: Build local images
        id: build-images
        run: |
          set -euo pipefail
          . ./deps.env
          source_label="https://github.com/${GITHUB_REPOSITORY}"
          docker build \
            --label "org.opencontainers.image.source=${source_label}" \
            -f contrib/k8s/Dockerfile.base \
            --build-arg DOLT_VERSION="$DOLT_VERSION" \
            -t "gc-agent-base:${IMAGE_TAG}" \
            .
          docker tag "gc-agent-base:${IMAGE_TAG}" gc-agent-base:latest

          docker build \
            --label "org.opencontainers.image.source=${source_label}" \
            -f contrib/k8s/Dockerfile.agent \
            --build-arg BASE_IMAGE=gc-agent-base:latest \
            -t "gc-agent:${IMAGE_TAG}" \
            .
          docker tag "gc-agent:${IMAGE_TAG}" gc-agent:latest

          docker build \
            --label "org.opencontainers.image.source=${source_label}" \
            -f contrib/k8s/Dockerfile.controller \
            --build-arg BASE=gc-agent:latest \
            -t "gc-controller:${IMAGE_TAG}" \
            .

          docker build \
            --label "org.opencontainers.image.source=${source_label}" \
            -f contrib/k8s/Dockerfile.mail \
            -t "gc-mcp-mail:${IMAGE_TAG}" \
            .

      - name: Generate image SARIF and SBOMs
        run: |
          set -euo pipefail
          mkdir -p trivy-results
          images=(
            "gc-agent-base:${IMAGE_TAG}"
            "gc-agent:${IMAGE_TAG}"
            "gc-controller:${IMAGE_TAG}"
            "gc-mcp-mail:${IMAGE_TAG}"
          )
          for image in "${images[@]}"; do
            name="${image%%:*}"
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --timeout 15m \
              --format sarif \
              --output "trivy-results/${name}.sarif" \
              "$image"
            trivy image \
              --scanners vuln \
              --ignorefile .trivyignore.yaml \
              --timeout 15m \
              --format cyclonedx \
              --output "trivy-results/${name}.cdx.json" \
              "$image"
          done

      - name: Enforce image vulnerability policy
        run: |
          set -euo pipefail
          images=(
            "gc-agent-base:${IMAGE_TAG}"
            "gc-agent:${IMAGE_TAG}"
            "gc-controller:${IMAGE_TAG}"
            "gc-mcp-mail:${IMAGE_TAG}"
          )
          overall_rc=0
          for image in "${images[@]}"; do
            if trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --exit-code 1 \
              --timeout 15m \
              --format table \
              "$image"; then
              echo "PASS: ${image} has no unwaived HIGH/CRITICAL findings"
            else
              echo "FAIL: ${image} has unwaived HIGH/CRITICAL findings"
              overall_rc=1
            fi
          done
          exit "$overall_rc"

      - name: Download verified GitPython 3.1.62 comparison wheel
        if: ${{ !cancelled() && steps.build-images.outcome == 'success' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://files.pythonhosted.org/packages/d6/0b/29d7965215f8ef830a7ca1f42997fe13e5693d85e9edb18f938d063ef5f2/gitpython-3.1.62-py3-none-any.whl \
            -o "${RUNNER_TEMP}/gitpython-3.1.62-py3-none-any.whl"
          printf '%s  %s\n' \
            7002251225e10e29d2e1f49e6532613fe5d5d9f0b6f1f02997a52b38fe56899e \
            "${RUNNER_TEMP}/gitpython-3.1.62-py3-none-any.whl" | sha256sum -c -

      - name: Check MCP mail GitPython path cache against the official validator
        if: ${{ !cancelled() && steps.build-images.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python3 \
            -v "${GITHUB_WORKSPACE}/.github/scripts/mcp-mail-gitpython-path-cache-test.py:/tmp/mcp-mail-gitpython-path-cache-test.py:ro" \
            "gc-mcp-mail:${IMAGE_TAG}" \
            /tmp/mcp-mail-gitpython-path-cache-test.py

      - name: Check MCP mail archive performance against GitPython 3.1.62
        if: ${{ !cancelled() && steps.build-images.outcome == 'success' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gascity-mail-samples"
          chmod 2770 "${RUNNER_TEMP}/gascity-mail-samples"
          python3 .github/scripts/mcp-mail-archive-burst-ci.py \
            --image "gc-mcp-mail:${IMAGE_TAG}" \
            --baseline-wheel "${RUNNER_TEMP}/gitpython-3.1.62-py3-none-any.whl" \
            --burst-script "${GITHUB_WORKSPACE}/.github/scripts/mcp-mail-archive-burst.py" \
            --samples-dir "${RUNNER_TEMP}/gascity-mail-samples"

      - name: Check MCP mail image database survives filelock exit
        # filelock 4.x truncated the mail database at exit by writing through a
        # lock fd that mcp-agent-mail's emergency cleanup had closed and SQLite
        # reused (review of #8307). Run the reproduction against the image's own
        # filelock and mcp-agent-mail so a re-lock onto an affected release fails.
        if: ${{ !cancelled() && steps.build-images.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python3 \
            -v "${GITHUB_WORKSPACE}/.github/scripts/mcp-mail-filelock-exit-regression.py:/tmp/mcp-mail-filelock-exit-regression.py:ro" \
            "gc-mcp-mail:${IMAGE_TAG}" \
            /tmp/mcp-mail-filelock-exit-regression.py

      - name: Check MCP mail image JWT compatibility
        if: ${{ !cancelled() && steps.build-images.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python3 \
            -v "${GITHUB_WORKSPACE}/.github/scripts/mcp-mail-jwt-compatibility.py:/tmp/mcp-mail-jwt-compatibility.py:ro" \
            "gc-mcp-mail:${IMAGE_TAG}" \
            /tmp/mcp-mail-jwt-compatibility.py

      - name: Export exact-source images for custody
        id: export-custody
        if: ${{ github.event_name == 'workflow_dispatch' && success() }}
        run: |
          set -euo pipefail
          custody_dir="${RUNNER_TEMP}/c14-image-custody"
          mkdir -p "$custody_dir"
          images=(
            "gc-agent-base:${IMAGE_TAG}"
            "gc-agent:${IMAGE_TAG}"
            "gc-controller:${IMAGE_TAG}"
            "gc-mcp-mail:${IMAGE_TAG}"
          )
          docker image save "${images[@]}" | gzip -1 > "$custody_dir/images.tar.gz"
          image_records="$(
            for image in "${images[@]}"; do
              docker image inspect --format '{{.Id}}' "$image" | \
                jq -R --arg local_ref "$image" '{local_ref: $local_ref, image_id: .}'
            done | jq -s .
          )"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_label "https://github.com/${GITHUB_REPOSITORY}" \
            --argjson images "$image_records" \
            '{source_sha: $source_sha, repository: $repository, ref: $ref,
              run_id: $run_id, run_attempt: $run_attempt,
              source_label: $source_label, images: $images}' \
            > "$custody_dir/scan-receipt.json"

      - name: Upload exact-source images for custody
        if: ${{ steps.export-custody.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c14-verified-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c14-image-custody/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload MCP mail performance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-mail-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gascity-mail-samples/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload base image SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: trivy-results/gc-agent-base.sarif
          category: trivy-image/gc-agent-base

      - name: Upload agent image SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: trivy-results/gc-agent.sarif
          category: trivy-image/gc-agent

      - name: Upload controller image SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: trivy-results/gc-controller.sarif
          category: trivy-image/gc-controller

      - name: Upload MCP mail image SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: trivy-results/gc-mcp-mail.sarif
          category: trivy-image/gc-mcp-mail

      - name: Upload image scan artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-image-results
          path: trivy-results/
          retention-days: 5

  # FINAL-01 fork-only scaffolding; remove or port before proposing this
  # workflow to upstream because the repository and branch guard are private.
  publish-c14-image-custody:
    name: Publish verified C14 images to GHCR
    needs: [runner-policy, dockerfile-config, image-vulnerabilities]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'chris-sanders/gascity' &&
        github.ref == 'refs/heads/codex/gascity-final01-c14-7472f-20261101'
      }}
    runs-on: ${{ needs.runner-policy.outputs.runner_8vcpu }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified scan images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: c14-verified-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c14-image-custody/

      - name: Verify source receipt and load scanned images
        env:
          CUSTODY_DIR: ${{ runner.temp }}/c14-image-custody
        run: |
          set -euo pipefail
          receipt="$CUSTODY_DIR/scan-receipt.json"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            '.source_sha == $sha and .repository == $repo and .ref == $ref and
             (.images | length) == 4' \
            "$receipt" >/dev/null
          docker image load --input "$CUSTODY_DIR/images.tar.gz"
          while IFS=$'\t' read -r local_ref expected_id; do
            actual_id="$(docker image inspect --format '{{.Id}}' "$local_ref")"
            test "$actual_id" = "$expected_id"
            actual_source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$local_ref")"
            expected_source="$(jq -r '.source_label' "$receipt")"
            test "$actual_source" = "$expected_source"
          done < <(jq -r '.images[] | [.local_ref, .image_id] | @tsv' "$receipt")

      - name: Authenticate to GHCR and publish scanned image digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTODY_DIR: ${{ runner.temp }}/c14-image-custody
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          registry_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          receipt="$CUSTODY_DIR/scan-receipt.json"
          published_receipt="$CUSTODY_DIR/published-receipt.json"
          jq '. + {published_images: []}' "$receipt" > "$published_receipt"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

          while IFS=$'\t' read -r local_ref image_id image_name; do
            source_label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$local_ref")"
            test "$source_label" = "https://github.com/${GITHUB_REPOSITORY}"
            package="ghcr.io/${owner}/gascity-c14-${image_name}"
            tagged_ref="${package}:${registry_tag}"
            docker tag "$local_ref" "$tagged_ref"
            push_log="$CUSTODY_DIR/${image_name}.push.log"
            docker push "$tagged_ref" 2>&1 | tee "$push_log"
            digest="$(grep -Eo 'digest: sha256:[0-9a-f]{64}' "$push_log" | tail -n 1 | cut -d' ' -f2)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "failed to read the GHCR manifest digest for ${image_name}" >&2
              exit 1
            fi
            jq \
              --arg local_ref "$local_ref" \
              --arg image_id "$image_id" \
              --arg package "$package" \
              --arg tag "$tagged_ref" \
              --arg digest "$digest" \
              '.published_images += [{local_ref: $local_ref, image_id: $image_id,
                package: $package, tag: $tag, digest: $digest,
                digest_ref: ($package + "@" + $digest)}]' \
              "$published_receipt" > "$published_receipt.tmp"
            mv "$published_receipt.tmp" "$published_receipt"
          done < <(jq -r '.images[] | [.local_ref, .image_id,
            (.local_ref | split(":")[0])] | @tsv' "$receipt")

          # Remove both local tags before the anonymous pull, then compare the
          # pulled image config ID with the image ID that passed the scan.
          while IFS=$'\t' read -r local_ref tagged_ref; do
            docker image rm "$tagged_ref" "$local_ref"
          done < <(jq -r '.published_images[] | [.local_ref, .tag] | @tsv' \
            "$published_receipt")

          # Use a fresh empty Docker credential directory for remote pulls. The
          # registry must allow anonymous access to every content digest.
          export DOCKER_CONFIG="$(mktemp -d)"
          while IFS=$'\t' read -r package digest expected_id; do
            docker pull "${package}@${digest}"
            pulled_id="$(docker image inspect --format '{{.Id}}' "${package}@${digest}")"
            test "$pulled_id" = "$expected_id"
          done < <(jq -r '.published_images[] | [.package, .digest, .image_id] | @tsv' \
            "$published_receipt")

          jq '.published_images |= map(. + {anonymous_pull: "passed"})' \
            "$published_receipt" > "$published_receipt.tmp"
          mv "$published_receipt.tmp" "$published_receipt"
          cat "$published_receipt" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain GHCR custody receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: c14-ghcr-custody-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c14-image-custody/
          if-no-files-found: warn
          retention-days: 90
