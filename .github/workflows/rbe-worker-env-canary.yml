# worker-env canary (gastownhall/rbe-worker worker/worker-env-drift).
# rbe-west's oss and oss-fork schedulers match the worker-env platform
# property exactly, so when the Blacksmith image under the pool workers stops
# being the pinned host (tools/rbe/worker-env.txt), no CI action can run until
# someone re-pins. Every six hours, and whenever the default branch changes
# the worker-env pin or the rbe-worker pin, a small Blacksmith runner of the
# pool's image family provisions and measures itself exactly as a pool worker
# does (the pinned rbe-worker's blacksmith-worker.sh, WORKER_MODE=measure).
# Drift fails this run and opens or updates the pin's drift issue, with the
# manifest and pin to commit, before CI runs into it. A match closes the drift
# issues of superseded pins. Each measurement also leaves the host's fingerprint
# (host-fingerprint artifact) for bazel-nightly.yml's fresh-on-drift decision.
name: rbe-worker-env-canary

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - platforms/BUILD.bazel
      - tools/rbe/worker-env.txt
      - .github/actions/rbe-worker/**
      - .github/workflows/rbe-worker-env-canary.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  measure:
    name: measure the Blacksmith worker host
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # The pool runs on blacksmith-32vcpu-ubuntu-2404; the 2-vCPU runner of the
    # same image measured byte-identically (#6995) at a sixteenth of the cost.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      # The worker code: gastownhall/rbe-worker at .github/actions/rbe-worker/pin,
      # fetched anonymously from its main and verified there. No secret in
      # this step.
      - name: Fetch the pinned rbe-worker
        id: rbe-worker
        uses: ./.github/actions/rbe-worker
      - name: Provision and measure this host as a pool worker does
        id: measure
        env:
          WORKER_MODE: measure
          RBE_WORKER_DIR: ${{ steps.rbe-worker.outputs.dir }}
          RBE_WORKER_REVISION: ${{ steps.rbe-worker.outputs.sha }}
        run: '"$RBE_WORKER_DIR/blacksmith-worker.sh"'
      # Fresh-on-drift (rbe-reexecution-design.md S3c): what the pool's host is,
      # finer than worker-env, which keys some tools at major version only: every
      # package version as installed (the raw listing), the kernel, the runner
      # image's own version where the image sets ImageOS/ImageVersion (empty
      # otherwise), and the rbe-worker revision. bazel-nightly.yml re-executes every
      # test only when this moves, and at least once an ISO week.
      - name: Record the host fingerprint
        if: always() && steps.measure.outcome != 'skipped'
        env:
          RBE_WORKER_REVISION: ${{ steps.rbe-worker.outputs.sha }}
        run: |
          { cat "$RUNNER_TEMP/worker-env.raw.txt"; uname -r; echo "image ${ImageOS:-} ${ImageVersion:-}"; echo "rbe-worker $RBE_WORKER_REVISION"; } |
            sha256sum | cut -c1-64 >"$RUNNER_TEMP/host-fingerprint.txt"
          echo "host fingerprint: $(cat "$RUNNER_TEMP/host-fingerprint.txt")"
      - name: Upload the host fingerprint
        if: always() && steps.measure.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-fingerprint
          path: ${{ runner.temp }}/host-fingerprint.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the worker-env drift
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-env-drift
          path: ${{ runner.temp }}/worker-env-drift
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: worker-env drift report
    needs: measure
    if: "!cancelled() && needs.measure.result != 'skipped'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: rbe-worker-env-drift-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Download the worker-env drift
        id: drift
        if: needs.measure.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker-env-drift
          path: ${{ runner.temp }}/worker-env-drift
      - name: Fetch the pinned rbe-worker
        id: rbe-worker
        uses: ./.github/actions/rbe-worker
      - name: Open or update the drift issue
        if: steps.drift.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RBE_WORKER_DIR: ${{ steps.rbe-worker.outputs.dir }}
        run: '"$RBE_WORKER_DIR/worker-env-drift" report "$RUNNER_TEMP/worker-env-drift"'
      - name: Close the drift issues of superseded pins
        if: needs.measure.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RBE_WORKER_DIR: ${{ steps.rbe-worker.outputs.dir }}
        run: '"$RBE_WORKER_DIR/worker-env-drift" resolve'
