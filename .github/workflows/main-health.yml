name: Main health

on:
  push:
    branches: [main]
  # Pre-merge self-test: a change to this file runs the build check on its own
  # PR. Escalation is push-only, so a PR run can never file a P0 issue.
  pull_request:
    paths:
      - .github/workflows/main-health.yml

permissions: {}

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-mod-download
      - name: go build ./...
        run: go build ./...

  escalate:
    name: Escalate broken main
    needs: build-check
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One escalation at a time: two pushes failing together must not both miss
    # the other's issue and file twice.
    concurrency:
      group: main-health-escalate
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: File (or find) the P0 escalation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/scripts/main_health_escalate.py
