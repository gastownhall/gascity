id = "CVE-2026-112940"
ignoreUntil = 2027-01-26
source = ".github/requirements/mcp-agent-mail.txt"
package = "filelock"
version = "3.29.0"
reason = "GHSA-v4x8-3wr5-3wq8, filelock 3.29.0 ReadWriteLock; unused by gc-mcp-mail (.trivyignore.yaml)"

