# Bazel test hermeticity ledger.
#
# A remotely cached `bazel test` PASS is only true while every input the test
# reads is declared. This ledger records the go_test packages that read
# undeclared state, and what was decided for each:
#
#   [[target]]    the package's go_test must never be served from the cache.
#                 `tags` must include one of external / no-cache /
#                 no-remote-cache; requires-network documents (and, under a
#                 network-less sandbox, grants) internet access.
#                 tools/bazel/hermetic_tags.py writes these tags into the
#                 package's BUILD.bazel (run by `make bazel-sync`; the CI
#                 "BUILD files in sync" job fails on drift).
#   [[reviewed]]  a signal the static scan reports, confirmed not to make the
#                 result environment-dependent. One entry per (package,
#                 signal); a stale entry (no matching finding) fails.
#
# internal/testpolicy/bazelhermetic (TestRepositoryTestsAreHermeticOrLedgered)
# fails when the scan finds a signal in a package that is neither a target
# nor reviewed for it. Signals: dns, external-url, network-cli, wall-clock,
# shared-tmp. Full audit and rationale:
# engdocs/contributors/bazel-test-hermeticity-audit.md

[[target]]
package = "test/acceptance"
tags = ["external", "requires-network"]
reason = "gc init clones gascity-packs from github.com for the default gascity/roles import (ga-73eoo); the result depends on GitHub being reachable and serving the pinned ref. Drop the tags once the import resolves from the embedded @com_github_gastownhall_gascity_packs module."
evidence = [
  "internal/config/public_packs.go:29 (public gascity-packs source)",
  ".github/workflows/bazel-test.yml: acceptance is skipped on the network-less fork pool for this reason",
]

[[target]]
package = "test/integration"
tags = ["external", "requires-network"]
reason = "start-drift tests run `go build ./cmd/gc` on the worker, downloading every module from proxy.golang.org into a private, empty GOMODCACHE; tutorial_path runs gc init (the github.com clone above); dolt_config resolves the worker's hostname."
evidence = [
  "test/integration/start_drift_test.go:616 buildGCBinaryWithCommit",
  "test/integration/tutorial_path_test.go:55",
  "test/integration/dolt_config_test.go:48 net.LookupHost(os.Hostname())",
]

[[target]]
package = "internal/testpolicy/resourcecensus"
tags = ["external"]
reason = "TestRepositoryLedgerMatchesCensusAndDocumentation validates dated waivers against time.Now(); the 88 rows expiring 2026-10-31 warn from 2026-10-17 and fail from 2026-11-15 with no code change, so a cached PASS goes stale on the calendar."
evidence = ["internal/testpolicy/resourcecensus/census_test.go:2376"]

[[target]]
package = "internal/testutil/providerledger"
tags = ["external"]
reason = "TestCatalogMatchesProductionWiringAndDocumentation validates dated waivers against time.Now(); the earliest (2026-10-08) turns fatal on 2026-10-23 with no code change."
evidence = ["internal/testutil/providerledger/ledger_test.go:1583"]

[[target]]
package = "internal/beads/beadstest"
tags = ["external"]
reason = "TestLedgeredSkipsAreValidAndUnexpired checks conformance-skip expiries (2026-12-15) against time.Now(). Consumers of requireLedgeredSkip (internal/beads, ...) share the dependency; see the audit's follow-up to make that path date-free."
evidence = ["internal/beads/beadstest/conformance_skips_test.go:18"]

[[reviewed]]
package = "cmd/gc"
signal = "wall-clock"
reason = "TestRunAnalyzeReliability_FullPipelineMatchesGoldenSnapshot sizes its --since window as time.Since(fixed)+24h, so the fixture always falls inside it: the pass/fail result does not change with the date."

[[reviewed]]
package = "internal/runtime/ssh"
signal = "network-cli"
reason = "ssh_test.go dials 127.0.0.1:1 (refused) through the image's ssh client; the host-sshd test lives in ssh_localhost_integration_test.go behind the integration build tag, outside the Bazel target."
