# Accepted dependency risks for osv-scanner and the weekly security scan
# (.github/workflows/security-scan.yml).
#
# osv-scanner reads this file natively (`--config osv-scanner.toml`), and
# .github/workflows/scripts/security_scan_gate.py applies the same entries to
# govulncheck findings. An entry matches a finding through any of its ids or
# aliases, so a CVE id here also covers the GHSA and GO ids of that advisory.
#
# Rules, enforced by TestOSVScannerAllowlistMirrorsTrivyWaivers
# (scripts/security_scan_allowlist_test.go) and the gate itself:
#   - every entry has an id, an ignoreUntil date and a reason;
#   - the file holds nothing but [[IgnoredVulns]] entries: osv-scanner would
#     apply any other setting (such as [[PackageOverrides]]) on its own and
#     hide findings with no expiry, so the gate refuses it;
#   - every entry mirrors a documented waiver in .trivyignore.yaml with the
#     same id and the same expiry date. The rationale lives there; the reason
#     here is a one-line pointer. A risk is accepted once, in one reviewed
#     place, and both scanners stop accepting it on the same day.
#
# When an entry expires, osv-scanner and the gate both treat the finding as
# new again and the scheduled scan fails until the pin moves or the waiver is
# re-reviewed in .trivyignore.yaml and here together.

# gc-mcp-mail Python lock (.github/requirements/mcp-agent-mail.txt): filelock
# held below 4 and GitPython on 3.1.x by owner decision after the review of
# #8307. See the gc-mcp-mail block in .trivyignore.yaml.

