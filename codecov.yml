ignore:
  # Generated from internal/api/openapi.json and verified by TestGeneratedClientInSync.
  - "internal/api/genclient/client_gen.go"

coverage:
  status:
    default_rules:
      flag_coverage_not_uploaded_behavior: include
    project:
      default:
        target: auto
        flags:
          - bazel-unit
          - integration-review-formulas

flags:
  # bazel-nightly.yml: `bazel coverage //...` (bazel.yml's coverage job), the
  # combined lcov report of every default-configuration test target.
  bazel-unit:
    paths:
      - cmd/
      - internal/
      - test/
    carryforward: true
  # review-formulas.yml's shards.
  integration-review-formulas:
    paths:
      - cmd/
      - internal/
      - test/
    carryforward: true
