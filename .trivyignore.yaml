vulnerabilities:
  # As of 2026-10-11, rebuilt tools are pinned and artifact-checked at x/net
  # 0.60.0, which clears CVE-2026-78669. The only remaining findings are in
  # kubectl, an upstream-signed prebuilt that this repository installs rather
  # than rebuilds. The current stable Kubernetes v1.36.5 binary embeds Go
  # 1.26.8 and x/net 0.56.0; the fixes require Go 1.26.9 and x/net 0.60.0.
  # Keep exact path-scoped waivers for those three findings on a short horizon,
  # then update the kubectl pin and remove them as soon as a stable release
  # carries both fixes. The older v1.36.3 waivers were removed after the v1.36.5
  # upgrade cleared them.
  - id: CVE-2026-78667
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-11-07
    statement: Reached through Go stdlib (the current upstream kubectl v1.36.5 binary uses Go 1.26.8; fixed in Go 1.26.9). kubectl is an upstream-signed prebuilt this repo installs rather than rebuilds; update to a stable Kubernetes release containing the fix and drop this entry.
  - id: CVE-2026-78669
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-11-07
    statement: Reached through Go stdlib and golang.org/x/net (the current upstream kubectl v1.36.5 binary uses Go 1.26.8 and x/net v0.56.0; fixed in Go 1.26.9 and x/net v0.60.0). kubectl is an upstream-signed prebuilt this repo installs rather than rebuilds; update to a stable Kubernetes release containing both fixes and drop this entry.
  - id: CVE-2026-97031
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-11-07
    statement: Reached through Go stdlib (the current upstream kubectl v1.36.5 binary uses Go 1.26.8; fixed in Go 1.26.9). kubectl is an upstream-signed prebuilt this repo installs rather than rebuilds; update to a stable Kubernetes release containing the fix and drop this entry.
  # main's time-boxed waiver bridge (#5885) is fully retired: its thrift entry
  # went when contrib/k8s/Dockerfile.base's THRIFT_VERSION reached 0.24.0 and
  # its GitPython entries went when .github/requirements/mcp-agent-mail.txt
  # reached 3.1.59, so nothing here carries the bridge's 2026-09-21 horizon any
  # more. TestTrivyIgnoreKeepsReviewedBridgeEntries holds it retired.
