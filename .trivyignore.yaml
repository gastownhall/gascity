vulnerabilities:
  # Expiry horizon moved 2026-08-17: 2026-08-07 -> 2026-11-07, on a set trimmed
  # from 45 entries to 12. Every entry is now a kubectl entry on that horizon:
  # the four reviewed entries main's time-boxed bridge carried on its own
  # 2026-09-21 horizon were all fixed rather than re-dated, so the bridge is
  # retired and nothing in this file expires before 2026-11-07.
  #
  # Every binary this image rebuilds from source now carries patched modules,
  # so none of them is waived for a finding the rebuild clears.
  # contrib/k8s/Dockerfile.base forces golang.org/x/crypto, golang.org/x/net,
  # golang.org/x/text and github.com/apache/thrift forward in the gh and Dolt
  # builds the same way it already forced google.golang.org/grpc, and each
  # build asserts the versions it embedded. contrib/k8s/Dockerfile.agent
  # rebuilds bd from a source ref whose go.mod pins x/net 0.58.0, which
  # CVE-2026-78669 affects, so it forces grpc, thrift and x/net forward itself
  # (GRPC_VERSION, THRIFT_VERSION and XNET_VERSION in that file) and asserts
  # all three embedded versions; x/net's own requirements carry bd's x/crypto
  # and x/text forward too, unasserted. The rule the previous horizon
  # established still holds and now covers every rebuilt path without
  # exception: no rebuilt bd/dolt/gh path is waived for anything, so if a
  # rebuild re-triggers one of these the scan fails and the regression stays
  # visible instead of being absorbed. TestTrivyIgnoreDropsStdlibWaiversForRebuiltTools
  # enforces that, and its reviewedWaivers now names only the kubectl prebuilt,
  # so a rebuilt path cannot be waived without a deliberate edit there.
  #
  # kubectl is all that is left. It is an upstream-signed prebuilt that
  # contrib/k8s/Dockerfile.controller installs rather than builds, so nothing in
  # this repo can move its dependencies. Bumping the pin from v1.36.0 to v1.36.3
  # takes its Go stdlib from 1.26.2 to 1.26.5 and clears eight of its findings,
  # but v1.36.3 still ships x/net v0.49.0 and x/text v0.33.0, which leaves the
  # fifteen entries below. The first twelve need at most Go 1.26.6, x/net 0.56.0
  # and x/text 0.39.0, and v1.36.5 meets all three (Go 1.26.8, x/net 0.56.0,
  # x/text 0.39.0), so moving the pin to it clears them. The last three, from
  # the 2026-10-08 Go advisories (CVE-2026-78667, CVE-2026-78669,
  # CVE-2026-97031), need Go 1.26.9 and x/net 0.60.0, and no kubectl release is
  # built with either yet. Drop each entry as soon as a release clears it.
  #
  # br carried ten entries and now produces no findings at all, so it is gone
  # from this file too.
  #
  # The horizon is three months rather than the one month the previous
  # extensions used. When it was set, nothing in the kubectl set below was
  # fixable from this repo, so a shorter one bought a re-dating chore instead of
  # a decision.
