vulnerabilities:
  # Expiry horizon moved 2026-08-17: 2026-08-07 -> 2026-11-07, on a set trimmed
  # from 45 entries to 12.
  #
  # Every binary this image rebuilds from source now carries patched modules,
  # so none of them is waived here. contrib/k8s/Dockerfile.base forces
  # golang.org/x/crypto, golang.org/x/net, golang.org/x/text and
  # github.com/apache/thrift forward in the gh and Dolt builds the same way it
  # already forced google.golang.org/grpc, and each build asserts the versions
  # it embedded. contrib/k8s/Dockerfile.agent rebuilds bd from a source ref
  # whose go.mod already pins all four. The rule the previous horizon
  # established still holds and now covers every rebuilt path: if a rebuilt
  # bd/dolt/gh re-triggers one of these the scan must fail, so the regression
  # stays visible instead of being waived.
  #
  # kubectl is what is left. It is an upstream-signed prebuilt that
  # contrib/k8s/Dockerfile.controller installs rather than builds, so nothing in
  # this repo can move its dependencies. Bumping the pin from v1.36.0 to v1.36.3
  # takes its Go stdlib from 1.26.2 to 1.26.5 and clears eight of its findings;
  # the twelve below are what no released kubectl fixes yet. Its x/net is still
  # v0.49.0 and its x/text still v0.33.0, and both need a Kubernetes release
  # that bumps them. Drop each entry as soon as a release clears it.
  #
  # br carried ten entries and now produces no findings at all, so it is gone
  # from this file too.
  #
  # The horizon is three months rather than the one month the previous
  # extensions used. Nothing waived below is fixable from this repo, so a
  # shorter one buys a re-dating chore instead of a decision.
  - id: CVE-2026-25681
    paths:
      - "usr/local/bin/kubectl"
    expired_at: 2026-11-07
    statement: Reached through golang.org/x/net (kubectl v1.36.3 ships v0.49.0; fixed in 0.55.0). kubectl is an upstream-signed prebuilt this repo installs rather than rebuilds, so the fix has to come from a Kubernetes release; drop this entry once one ships that clears it.
