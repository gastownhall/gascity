    expired_at: 2026-11-07
    statement: Reached through golang.org/x/net (kubectl v1.36.3 ships v0.49.0; fixed in 0.55.0). kubectl is an upstream-signed prebuilt this repo installs rather than rebuilds, so the fix has to come from a Kubernetes release; drop this entry once one ships that clears it.
