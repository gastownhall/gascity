version: "2"

run:
  # Every golangci-lint on a host locks $TMPDIR/golangci-lint.lock and, by
  # default, gives up after 5s ("parallel golangci-lint is running"). Deploy
  # gates, maintainer-review gate checks and pre-commit hooks lint concurrently
  # on shared hosts, so the later run failed before analysis. The lock guards no
  # shared state: the result cache is safe for concurrent multi-process use.
  allow-parallel-runners: true
  modules-download-mode: readonly

severity:
  default: error

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  # Keep govet explicit in configured lint. The changed-scope target bounds
  # both this copy and the Go tool's vet to the same affected graph, preserving
  # their distinct diagnostics without repeating either across the whole repo.
  # Other default linters (errcheck, ineffassign, staticcheck, unused) remain
  # enabled alongside these configured extras.
  enable:
    - govet
    - errorlint
    - misspell
    - gocritic
    - revive
    - unconvert
    - unparam

  settings:
    misspell:
      locale: US

  exclusions:
    rules:
      # runtime shadows stdlib but is isolated to internal/.
      - path: internal/runtime/
        linters:
          - revive
        text: "var-naming"
      # exec is an established package name — renaming would break imports.
      - path: internal/runtime/exec/
        linters:
          - revive
        text: "var-naming"
      - path: internal/beads/exec/
        linters:
          - revive
        text: "var-naming"
      # api is an established package name for the HTTP API server.
      - path: internal/api/
        linters:
          - revive
        text: "var-naming"
      # mail is an established package name — renaming would break imports.
      - path: internal/mail/
        linters:
          - revive
        text: "var-naming"
      # extmsg is an established package name for external messaging.
      - path: internal/extmsg/
        linters:
          - revive
        text: "var-naming"
      # These domain packages intentionally use package-qualified exported names
      # (for example sling.SlingResult) to keep adapter call sites explicit.
      - path: internal/convoy/
        linters:
          - revive
        text: "stutters"
      - path: internal/graphroute/
        linters:
          - revive
        text: "stutters"
      - path: internal/sling/
        linters:
          - revive
        text: "stutters"
